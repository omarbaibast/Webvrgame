
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VR Camera</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas {
    width: 100vw;
    height: 100vh;
    display: block;
}

#video {
    display: none;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    z-index: 5;
}

button {
    background: #202020;
    color: white;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 14px;
}

#status {
    position: fixed;
    top: 15px;
    left: 10px;
    right: 10px;
    text-align: center;
    z-index: 5;
    background: #222c;
    padding: 12px;
    border-radius: 8px;
}

#zoomBox {
    position: fixed;
    top: 65px;
    left: 10px;
    right: 10px;
    text-align: center;
    z-index: 5;
}

#zoom {
    width: 180px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="view"></canvas>

<div id="status">VR CAMERA — CAMERA OFF</div>

<div id="zoomBox">
    Zoom <input id="zoom" type="range"
    min="1" max="3" value="1" step="0.1">
</div>

<div id="controls">
    <button onclick="startCamera()">START CAMERA</button>
    <button onclick="switchCamera()">SWITCH CAMERA</button>
    <button onclick="enterVR()">ENTER VR</button>
    <button onclick="stopCamera()">STOP</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");
const controls = document.getElementById("controls");
const zoom = document.getElementById("zoom");
const zoomBox = document.getElementById("zoomBox");

let stream = null;
let facing = "environment";
let vr = false;
let animation = null;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
}

window.addEventListener("resize", resize);
resize();

function drawEye(x, width, height) {
    if (!video.videoWidth || !video.videoHeight) return;

    const z = Number(zoom.value);

    const sourceRatio = video.videoWidth / video.videoHeight;
    const targetRatio = width / height;

    let sw, sh;

    if (sourceRatio > targetRatio) {
        sh = video.videoHeight / z;
        sw = sh * targetRatio;
    } else {
        sw = video.videoWidth / z;
        sh = sw / targetRatio;
    }

    const sx = (video.videoWidth - sw) / 2;
    const sy = (video.videoHeight - sh) / 2;

    ctx.drawImage(
        video,
        sx, sy, sw, sh,
        x, 0, width, height
    );
}

function render() {
    animation = requestAnimationFrame(render);

    const w = canvas.width;
    const h = canvas.height;
    const half = Math.floor(w / 2);

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, w, h);

    if (video.readyState >= 2) {
        drawEye(0, half, h);
        drawEye(half, w - half, h);
    }

    ctx.fillStyle = "#444";
    ctx.fillRect(half - 1, 0, 2, h);
}

render();

async function startCamera() {
    try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            throw new Error("Camera unavailable. Open using localhost or HTTPS in Chrome.");
        }

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        status.textContent = "REQUESTING CAMERA...";

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: facing,
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        });

        video.srcObject = stream;
        await video.play();

        status.textContent =
            "CAMERA ACTIVE — VR READY";

    } catch (error) {
        status.textContent = "ERROR: " + error.message;
        alert(error.message);
    }
}

async function switchCamera() {
    facing = facing === "environment"
        ? "user" : "environment";

    await startCamera();
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }

    video.srcObject = null;
    status.textContent = "CAMERA OFF";
}

async function enterVR() {
    if (!stream) {
        alert("Start the camera first!");
        return;
    }

    vr = !vr;

    if (vr) {
        try {
            await document.documentElement.requestFullscreen();
        } catch(e) {}

        try {
            await screen.orientation.lock("landscape");
        } catch(e) {}

        controls.style.display = "none";
        zoomBox.style.display = "none";
        status.style.display = "none";
    } else {
        controls.style.display = "flex";
        zoomBox.style.display = "block";
        status.style.display = "block";

        if (document.fullscreenElement) {
            await document.exitFullscreen();
        }
    }

    resize();
}

canvas.addEventListener("click", () => {
    if (vr) {
        enterVR();
    }
});
</script>

</body>
</html>
