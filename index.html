<!DOCTYPE html>

<body>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Header Overlay -->
  <div class="absolute top-4 left-4 z-10 pointer-events-none">
    <div class="glass-panel p-4 rounded-xl shadow-2xl flex items-center gap-3 border border-white/10 pointer-events-auto">
      <div class="w-10 h-10 rounded-lg bg-indigo-600/80 flex items-center justify-center text-white shadow-lg">
        <i class="fa-solid fa-user-astronaut text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide text-white">Humanoid Manifold</h1>
        <p class="text-xs text-gray-400">Continuous Topology & Curvature Explorer</p>
      </div>
    </div>
  </div>

  <!-- Include Three.js, OrbitControls, and lil-gui via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

  <script>
    // --- Application State ---
    const params = {
      manifoldMode: 'parametricHumanoid',
      uRes: 100,
      vRes: 120,
      scale: 1.0,
      materialPreset: 'cyberHolo',
      baseColor: '#ffffff',
      roughness: 0.15,
      metalness: 0.2,
      clearcoat: 1.0,
      transmission: 0.4,
      wireframe: true,
      wireframeColor: '#6366f1',
      wireframeOpacity: 0.25,
      curvatureMode: 'none', // 'none', 'gaussian', 'height', 'normal'
      animateBreathing: true,
      breathingSpeed: 1.2,
      breathingIntensity: 0.08,
      pulseDeform: false,
      autoRotate: true,
      autoRotateSpeed: 1.0,
      resetCamera: () => resetCamera()
    };

    // --- Humanoid Parametric Surface Equations ---
    // Smooth mathematical mappings for parametric humanoid manifolds
    const HumanoidManifolds = {
      
      // 1. Smooth Parametric Humanoid Torso / Body
      parametricHumanoid: (u, v, target) => {
        // u in [0, 1] maps around body perimeter (theta)
        // v in [0, 1] maps vertical height from head to feet
        const theta = u * Math.PI * 2;
        const y = (v - 0.5) * 4.2; // Height span

        // Base anatomical contour profile along height v
        let radius = 0.4;

        // Head (top)
        if (v > 0.85) {
          const headV = (v - 0.85) / 0.15;
          radius = 0.38 * Math.sin(headV * Math.PI);
        } 
        // Neck
        else if (v > 0.78) {
          const neckV = (v - 0.78) / 0.07;
          radius = 0.18 + 0.05 * Math.cos(neckV * Math.PI);
        } 
        // Shoulders & Chest
        else if (v > 0.58) {
          const chestV = (v - 0.58) / 0.20;
          radius = 0.48 + 0.22 * Math.sin(chestV * Math.PI);
          // Shoulder width modulation via cosine theta
          radius += 0.28 * Math.pow(Math.cos(theta), 2) * Math.sin(chestV * Math.PI);
        } 
        // Waist & Abdomen
        else if (v > 0.42) {
          const waistV = (v - 0.42) / 0.16;
          radius = 0.32 + 0.10 * Math.cos(waistV * Math.PI);
          radius += 0.08 * Math.pow(Math.cos(theta), 2);
        } 
        // Hips / Pelvis
        else if (v > 0.30) {
          const hipV = (v - 0.30) / 0.12;
          radius = 0.42 + 0.12 * Math.sin(hipV * Math.PI);
          radius += 0.12 * Math.pow(Math.cos(theta), 2);
        } 
        // Legs (split dual-cylinder manifold trick using sine harmonics)
        else {
          const legV = v / 0.30;
          const legRadius = 0.18 * Math.sin(legV * Math.PI * 0.9 + 0.1);
          // Create leg separation modulation
          const separation = 0.24 * (1.0 - legV * 0.3);
          const isLeft = Math.cos(theta) > 0 ? 1 : -1;
          const xOffset = isLeft * separation;
          
          const x = xOffset + legRadius * Math.cos(theta);
          const z = legRadius * Math.sin(theta) * 0.95;
          target.set(x, y, z);
          return;
        }

        // Elliptical cross-section modulation for natural torso depth vs width
        const depthFactor = 0.7 + 0.15 * Math.sin(v * Math.PI * 2);
        const x = radius * Math.cos(theta);
        const z = radius * depthFactor * Math.sin(theta);
        target.set(x, y, z);
      },

      // 2. Cyberpunk Android (Segmented smooth manifold curves)
      cyberAndroid: (u, v, target) => {
        const theta = u * Math.PI * 2;
        const y = (v - 0.5) * 4.0;
        
        // Base profile + ribbed cyberpunk surface modulation
        let r = 0.35 + 0.25 * Math.sin(v * Math.PI * 3);
        
        // Exoskeleton panel ribbing
        const ribbing = 0.04 * Math.sin(v * 40) * Math.cos(theta * 4);
        r += ribbing;

        // Chest core expansion
        if (v > 0.55 && v < 0.75) {
          r += 0.2 * Math.sin((v - 0.55) / 0.2 * Math.PI) * Math.pow(Math.cos(theta), 2);
        }

        const x = r * Math.cos(theta);
        const z = r * Math.sin(theta) * (0.8 + 0.2 * Math.cos(theta * 2));
        target.set(x, y, z);
      },

      // 3. Continuous Topological Torus-Humanoid Hybrid
      topologicalHybrid: (u, v, target) => {
        // A genus-1 continuous self-inverting torus manifold twisted into a stylized humanoid stance
        const uAngle = u * Math.PI * 2;
        const vAngle = v * Math.PI * 2;

        const R = 1.2 + 0.4 * Math.sin(vAngle * 2); // Major radius modulation
        const r = 0.45 + 0.15 * Math.cos(uAngle * 3); // Minor radius modulation

        const x = (R + r * Math.cos(vAngle)) * Math.cos(uAngle);
        const y = (R + r * Math.cos(vAngle)) * Math.sin(uAngle) * 1.5 - 0.2;
        const z = r * Math.sin(vAngle) + 0.3 * Math.sin(uAngle * 2);

        target.set(x, y, z).multiplyScalar(0.75);
      },

      // 4. Minimalist Organic Mannequin (Ultra-smooth continuous geometry)
      organicMannequin: (u, v, target) => {
        const theta = u * Math.PI * 2;
        const y = (v - 0.5) * 4.2;

        // Smooth continuous Gaussian blob blend along spine axis
        const headBlob = 0.4 * Math.exp(-Math.pow((v - 0.9) / 0.08, 2));
        const chestBlob = 0.6 * Math.exp(-Math.pow((v - 0.65) / 0.15, 2));
        const hipBlob = 0.5 * Math.exp(-Math.pow((v - 0.4) / 0.12, 2));
        const legBlob = 0.3 * Math.exp(-Math.pow((v - 0.18) / 0.18, 2));

        const r = 0.1 + headBlob + chestBlob + hipBlob + legBlob;
        
        const widthFactor = 1.0 + 0.4 * Math.exp(-Math.pow((v - 0.68) / 0.1, 2)) * Math.pow(Math.cos(theta), 2);

        const x = r * widthFactor * Math.cos(theta);
        const z = r * 0.8 * Math.sin(theta);
        target.set(x, y, z);
      }
    };

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070d, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.8, 6.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 15;
    controls.minDistance = 2;
    controls.target.set(0, 0, 0);

    function resetCamera() {
      camera.position.set(0, 0.8, 6.0);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // --- Lighting & Studio Environment ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x6366f1, 3.0); // Cyan/Indigo Key Light
    keyLight.position.set(6, 8, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xec4899, 2.0); // Pink Fill Light
    fillLight.position.set(-6, -2, -4);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0x38bdf8, 4.0, 12); // Blue Rim Light
    rimLight.position.set(0, 5, -4);
    scene.add(rimLight);

    // Reflective Floor Grid
    const gridHelper = new THREE.GridHelper(20, 40, 0x6366f1, 0x1e293b);
    gridHelper.position.y = -2.3;
    gridHelper.material.opacity = 0.35;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- Custom Shader for Curvature Overlay ---
    const CurvatureShader = {
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform stringCurvatureMode;
        uniform int uCurvatureMode; // 0: none, 1: gaussian, 2: height, 3: normal gradient
        uniform vec3 uBaseColor;
        uniform float uRoughness;
        uniform float uMetalness;
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec2 vUv;

        // Color map helpers for curvature mapping
        vec3 turboColormap(float t) {
          t = clamp(t, 0.0, 1.0);
          return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
        }

        void main() {
          vec3 viewDir = normalize(-vPosition);
          float NdotV = max(0.0, dot(vNormal, viewDir));
          
          vec3 finalColor = uBaseColor;

          if (uCurvatureMode == 1) {
            // Gaussian curvature approximation via derivatives of normal
            vec3 dNdx = dFdx(vNormal);
            vec3 dNdy = dFdy(vNormal);
            float curvature = length(dNdx) + length(dNdy);
            finalColor = turboColormap(curvature * 2.5);
          } else if (uCurvatureMode == 2) {
            // Height gradient color map
            float normalizedHeight = clamp((vPosition.y + 2.0) / 4.0, 0.0, 1.0);
            finalColor = turboColormap(normalizedHeight);
          } else if (uCurvatureMode == 3) {
            // Normal facing gradient
            finalColor = vNormal * 0.5 + 0.5;
          }

          // Basic shading output
          float light = max(0.2, NdotV);
          gl_FragColor = vec4(finalColor * light, 1.0);
        }
      `
    };

    // --- Material Presets ---
    const MaterialPresets = {
      cyberHolo: { color: '#ffffff', roughness: 0.1, metalness: 0.1, clearcoat: 1.0, transmission: 0.5 },
      chrome: { color: '#ffffff', roughness: 0.05, metalness: 1.0, clearcoat: 1.0, transmission: 0.0 },
      gold: { color: '#ffb703', roughness: 0.2, metalness: 0.95, clearcoat: 0.5, transmission: 0.0 },
      emeraldGlass: { color: '#10b981', roughness: 0.1, metalness: 0.05, clearcoat: 1.0, transmission: 0.8 },
      marble: { color: '#f8fafc', roughness: 0.35, metalness: 0.0, clearcoat: 0.2, transmission: 0.0 }
    };

    const surfaceMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.baseColor),
      roughness: params.roughness,
      metalness: params.metalness,
      clearcoat: params.clearcoat,
      clearcoatRoughness: 0.1,
      transmission: params.transmission,
      ior: 1.5,
      side: THREE.DoubleSide
    });

    const curvatureMaterial = new THREE.ShaderMaterial({
      vertexShader: CurvatureShader.vertexShader,
      fragmentShader: CurvatureShader.fragmentShader,
      uniforms: {
        uCurvatureMode: { value: 0 },
        uBaseColor: { value: new THREE.Color(params.baseColor) },
        uRoughness: { value: params.roughness },
        uMetalness: { value: params.metalness }
      },
      side: THREE.DoubleSide
    });

    const wireframeMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(params.wireframeColor),
      wireframe: true,
      transparent: true,
      opacity: params.wireframeOpacity
    });

    // --- Mesh & Geometry Builder ---
    let meshGroup = new THREE.Group();
    let mainMesh, wireframeMesh;
    scene.add(meshGroup);

    // Dynamic procedural geometry cache
    let originalPositions = null;

    function buildManifoldGeometry() {
      // Clear previous geometries
      while (meshGroup.children.length > 0) {
        const obj = meshGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }

      const parametricFunc = HumanoidManifolds[params.manifoldMode];
      const geometry = new THREE.ParametricGeometry(parametricFunc, params.uRes, params.vRes);
      geometry.center();
      geometry.computeVertexNormals();

      // Store original positions for real-time deformation animation
      originalPositions = geometry.attributes.position.array.slice();

      const activeMaterial = (params.curvatureMode !== 'none') ? curvatureMaterial : surfaceMaterial;

      mainMesh = new THREE.Mesh(geometry, activeMaterial);
      wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
      wireframeMesh.visible = params.wireframe;

      meshGroup.add(mainMesh);
      meshGroup.add(wireframeMesh);
      meshGroup.scale.setScalar(params.scale);
    }

    // Update Curvature Uniforms
    function updateCurvatureMode() {
      const modeMap = { 'none': 0, 'gaussian': 1, 'height': 2, 'normal': 3 };
      curvatureMaterial.uniforms.uCurvatureMode.value = modeMap[params.curvatureMode];
      
      if (mainMesh) {
        mainMesh.material = (params.curvatureMode !== 'none') ? curvatureMaterial : surfaceMaterial;
      }
    }

    // Apply Preset Materials
    function applyMaterialPreset(presetKey) {
      const p = MaterialPresets[presetKey];
      if (p) {
        params.baseColor = p.color;
        params.roughness = p.roughness;
        params.metalness = p.metalness;
        params.clearcoat = p.clearcoat;
        params.transmission = p.transmission;

        surfaceMaterial.color.set(p.color);
        surfaceMaterial.roughness = p.roughness;
        surfaceMaterial.metalness = p.metalness;
        surfaceMaterial.clearcoat = p.clearcoat;
        surfaceMaterial.transmission = p.transmission;

        curvatureMaterial.uniforms.uBaseColor.value.set(p.color);
      }
    }

    // Initialize Geometry
    applyMaterialPreset(params.materialPreset);
    buildManifoldGeometry();

    // --- Lil-GUI Panel Setup ---
    const gui = new lil.GUI({ title: 'Humanoid Manifold Controls' });

    // 1. Manifold Selector
    gui.add(params, 'manifoldMode', {
      'Parametric Humanoid Body': 'parametricHumanoid',
      'Cyberpunk Android': 'cyberAndroid',
      'Torus-Humanoid Hybrid': 'topologicalHybrid',
      'Organic Mannequin': 'organicMannequin'
    }).name('Topology Mode').onChange(buildManifoldGeometry);

    // 2. Curvature & Analysis
    const curvatureFolder = gui.addFolder('Curvature & Analysis');
    curvatureFolder.add(params, 'curvatureMode', {
      'Shaded Surface (Off)': 'none',
      'Gaussian Curvature Map': 'gaussian',
      'Height Gradient Map': 'height',
      'Normal Orientation Map': 'normal'
    }).name('Curvature Overlay').onChange(updateCurvatureMode);

    // 3. Material Controls
    const matFolder = gui.addFolder('PBR Surface Material');
    matFolder.add(params, 'materialPreset', {
      'Holographic Cyber Glow': 'cyberHolo',
      'Polished Chrome': 'chrome',
      'Golden Metallic': 'gold',
      'Emerald Glass': 'emeraldGlass',
      'Smooth Marble': 'marble'
    }).name('Preset').onChange((val) => {
      applyMaterialPreset(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    matFolder.addColor(params, 'baseColor').name('Base Color').onChange(c => {
      surfaceMaterial.color.set(c);
      curvatureMaterial.uniforms.uBaseColor.value.set(c);
    });
    matFolder.add(params, 'roughness', 0, 1, 0.01).name('Roughness').onChange(v => surfaceMaterial.roughness = v);
    matFolder.add(params, 'metalness', 0, 1, 0.01).name('Metalness').onChange(v => surfaceMaterial.metalness = v);
    matFolder.add(params, 'clearcoat', 0, 1, 0.01).name('Clearcoat').onChange(v => surfaceMaterial.clearcoat = v);
    matFolder.add(params, 'transmission', 0, 1, 0.01).name('Glass Transparency').onChange(v => surfaceMaterial.transmission = v);

    // 4. Wireframe Settings
    const wireFolder = gui.addFolder('Wireframe Overlay');
    wireFolder.add(params, 'wireframe').name('Show Wireframe').onChange(v => wireframeMesh.visible = v);
    wireFolder.addColor(params, 'wireframeColor').name('Wire Color').onChange(c => wireframeMaterial.color.set(c));
    wireFolder.add(params, 'wireframeOpacity', 0.05, 1.0, 0.05).name('Opacity').onChange(v => wireframeMaterial.opacity = v);

    // 5. Sampling & Resolution
    const geoFolder = gui.addFolder('Parametric Sampling');
    geoFolder.add(params, 'uRes', 30, 160, 2).name('U Grid Sampling').onChange(buildManifoldGeometry);
    geoFolder.add(params, 'vRes', 40, 200, 2).name('V Grid Sampling').onChange(buildManifoldGeometry);
    geoFolder.add(params, 'scale', 0.5, 2.0, 0.1).name('Scale').onChange(v => meshGroup.scale.setScalar(v));

    // 6. Animation Controls
    const animFolder = gui.addFolder('Dynamic Deformations');
    animFolder.add(params, 'animateBreathing').name('Breathing Wave');
    animFolder.add(params, 'breathingSpeed', 0.2, 3.0, 0.1).name('Breathing Rate');
    animFolder.add(params, 'breathingIntensity', 0.01, 0.25, 0.01).name('Breathing Scale');
    animFolder.add(params, 'pulseDeform').name('Energy Pulse Deform');
    animFolder.add(params, 'autoRotate').name('Auto Rotate Camera').onChange(v => controls.autoRotate = v);

    gui.add(params, 'resetCamera').name('Reset Camera View');

    // Configure OrbitControls
    controls.autoRotate = params.autoRotate;
    controls.autoRotateSpeed = params.autoRotateSpeed;

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation & Real-Time Deformation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Real-time Procedural Mesh Deformation (Breathing & Pulse Waves)
      if (mainMesh && originalPositions && (params.animateBreathing || params.pulseDeform)) {
        const positions = mainMesh.geometry.attributes.position.array;
        const count = positions.length / 3;

        const breathPhase = Math.sin(elapsedTime * params.breathingSpeed * 2.5);
        const pulsePhase = Math.sin(elapsedTime * 4.0);

        for (let i = 0; i < count; i++) {
          const idx = i * 3;
          const ox = originalPositions[idx];
          const oy = originalPositions[idx + 1];
          const oz = originalPositions[idx + 2];

          // Compute deformation factors based on height (oy)
          let deformX = 0;
          let deformZ = 0;

          if (params.animateBreathing) {
            // Chest breathing modulation (higher intensity around chest height oy ~ 0.5)
            const chestFactor = Math.exp(-Math.pow((oy - 0.4) / 0.8, 2));
            deformX += ox * breathPhase * params.breathingIntensity * chestFactor;
            deformZ += oz * breathPhase * params.breathingIntensity * 1.5 * chestFactor;
          }

          if (params.pulseDeform) {
            // Traveling wave pulse deformation along body Y-axis
            const wave = Math.sin(oy * 6.0 - elapsedTime * 5.0) * 0.04;
            deformX += ox * wave;
            deformZ += oz * wave;
          }

          positions[idx] = ox + deformX;
          positions[idx + 2] = oz + deformZ;
        }

        mainMesh.geometry.attributes.position.needsUpdate = true;
        mainMesh.geometry.computeVertexNormals();

        if (wireframeMesh) {
          wireframeMesh.geometry.attributes.position.needsUpdate = true;
        }
      }

      // Dynamic light animation for visual depth
      rimLight.position.x = Math.sin(elapsedTime * 0.6) * 5;
      rimLight.position.z = Math.cos(elapsedTime * 0.6) * 5;

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = animate;
  </script>
