<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Quaternion Sculpture</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050509;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        width: 280px;
        padding: 15px;
        background: rgba(0,0,0,0.72);
        color: white;
        border-radius: 12px;
        backdrop-filter: blur(8px);
    }

    #ui h2 {
        margin: 0 0 10px 0;
        font-size: 20px;
    }

    .control {
        margin: 12px 0;
    }

    label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
    }

    input {
        width: 100%;
    }

    button {
        width: 100%;
        padding: 9px;
        margin-top: 8px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }

    #info {
        font-size: 11px;
        line-height: 1.4;
        opacity: 0.7;
        margin-top: 12px;
    }
</style>
</head>

<body>

<div id="ui">

    <h2>Quaternion Sculpture</h2>

    <div class="control">
        <label>
            Rotation strength:
            <span id="rotationValue">3.0</span>
        </label>
        <input id="rotation"
               type="range"
               min="0"
               max="10"
               step="0.01"
               value="3">
    </div>

    <div class="control">
        <label>
            Deformation:
            <span id="deformationValue">0.35</span>
        </label>
        <input id="deformation"
               type="range"
               min="0"
               max="1.5"
               step="0.01"
               value="0.35">
    </div>

    <div class="control">
        <label>
            Frequency:
            <span id="frequencyValue">5</span>
        </label>
        <input id="frequency"
               type="range"
               min="1"
               max="15"
               step="1"
               value="5">
    </div>

    <div class="control">
        <label>
            Twist:
            <span id="twistValue">2.0</span>
        </label>
        <input id="twist"
               type="range"
               min="-10"
               max="10"
               step="0.01"
               value="2">
    </div>

    <button id="randomize">
        Randomize Sculpture
    </button>

    <button id="reset">
        Reset Sphere
    </button>

    <div id="info">
        Every vertex begins on a sphere.
        A position-dependent quaternion rotates
        each vertex independently, producing a
        continuous deformation field.
    </div>

</div>


<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


// ----------------------------------------------------
// SCENE
// ----------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050509);


// ----------------------------------------------------
// CAMERA
// ----------------------------------------------------

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

camera.position.set(3, 2.5, 5);


// ----------------------------------------------------
// RENDERER
// ----------------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ----------------------------------------------------
// CAMERA CONTROLS
// ----------------------------------------------------

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;


// ----------------------------------------------------
// LIGHTS
// ----------------------------------------------------

const ambient = new THREE.AmbientLight(
    0xffffff,
    1.2
);

scene.add(ambient);


const light1 = new THREE.DirectionalLight(
    0xffffff,
    4
);

light1.position.set(3, 4, 5);

scene.add(light1);


const light2 = new THREE.PointLight(
    0x4488ff,
    20,
    10
);

light2.position.set(-3, 1, 2);

scene.add(light2);


const light3 = new THREE.PointLight(
    0xff4477,
    15,
    10
);

light3.position.set(3, -2, -2);

scene.add(light3);


// ----------------------------------------------------
// ORIGINAL SPHERE
// ----------------------------------------------------

const resolution = 160;

const geometry = new THREE.SphereGeometry(
    1,
    resolution,
    resolution
);


// Save the original sphere positions.

const originalPositions =
    geometry.attributes.position.clone();


// ----------------------------------------------------
// MATERIAL
// ----------------------------------------------------

const material = new THREE.MeshPhysicalMaterial({

    color: 0x1888ff,

    metalness: 0.45,

    roughness: 0.18,

    transmission: 0.05,

    clearcoat: 1.0,

    clearcoatRoughness: 0.1,

    side: THREE.DoubleSide
});


const sculpture =
    new THREE.Mesh(
        geometry,
        material
    );

scene.add(sculpture);


// ----------------------------------------------------
// QUATERNION
// ----------------------------------------------------

const quaternion =
    new THREE.Quaternion();


// Temporary vectors

const original =
    new THREE.Vector3();

const point =
    new THREE.Vector3();

const axis =
    new THREE.Vector3();


// ----------------------------------------------------
// PARAMETERS
// ----------------------------------------------------

let rotationStrength = 3.0;

let deformationStrength = 0.35;

let frequency = 5;

let twistStrength = 2.0;


// ----------------------------------------------------
// MAIN SCULPTURE FUNCTION
// ----------------------------------------------------

function sculpt() {

    const position =
        geometry.attributes.position;

    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        // --------------------------------------------
        // ORIGINAL SPHERE POINT
        // --------------------------------------------

        original.fromBufferAttribute(
            originalPositions,
            i
        );

        point.copy(original);


        // --------------------------------------------
        // SPHERICAL COORDINATES
        // --------------------------------------------

        const x = original.x;
        const y = original.y;
        const z = original.z;

        const r = original.length();

        const theta =
            Math.atan2(z, x);

        const phi =
            Math.acos(
                THREE.MathUtils.clamp(
                    y / r,
                    -1,
                    1
                )
            );


        // --------------------------------------------
        // POSITION-DEPENDENT ROTATION ANGLE
        // --------------------------------------------

        const wave =
            Math.sin(
                frequency * theta +
                2.0 * phi
            );

        const wave2 =
            Math.sin(
                frequency * phi +
                theta * 2.0
            );


        let angle =
            rotationStrength *
            (
                0.5 * wave +
                0.5 * wave2
            );


        // Add a twist depending on height

        angle +=
            twistStrength * y;


        // --------------------------------------------
        // ROTATION AXIS
        // --------------------------------------------

        axis.set(

            Math.sin(phi) *
            Math.cos(theta),

            Math.cos(phi),

            Math.sin(phi) *
            Math.sin(theta)

        );


        axis.normalize();


        // --------------------------------------------
        // CREATE QUATERNION
        // --------------------------------------------

        quaternion.setFromAxisAngle(
            axis,
            angle
        );


        // --------------------------------------------
        // ROTATE THE POINT
        // --------------------------------------------

        point.applyQuaternion(
            quaternion
        );


        // --------------------------------------------
        // RADIAL DEFORMATION
        // --------------------------------------------

        const deformation =
            1.0 +

            deformationStrength *

            Math.sin(
                frequency * theta
            ) *

            Math.sin(
                frequency * phi
            );


        point.multiplyScalar(
            deformation
        );


        // --------------------------------------------
        // SECOND SMALL DEFORMATION
        // --------------------------------------------

        point.x +=
            deformationStrength *
            0.25 *
            Math.sin(
                3.0 * y +
                4.0 * theta
            );

        point.z +=
            deformationStrength *
            0.25 *
            Math.cos(
                3.0 * y +
                4.0 * theta
            );


        // --------------------------------------------
        // WRITE NEW POSITION
        // --------------------------------------------

        position.setXYZ(
            i,
            point.x,
            point.y,
            point.z
        );
    }


    position.needsUpdate = true;

    geometry.computeVertexNormals();
}


// ----------------------------------------------------
// UI
// ----------------------------------------------------

const rotationSlider =
    document.getElementById("rotation");

const deformationSlider =
    document.getElementById("deformation");

const frequencySlider =
    document.getElementById("frequency");

const twistSlider =
    document.getElementById("twist");


rotationSlider.oninput = () => {

    rotationStrength =
        parseFloat(rotationSlider.value);

    document.getElementById(
        "rotationValue"
    ).textContent =
        rotationStrength.toFixed(2);

    sculpt();
};


deformationSlider.oninput = () => {

    deformationStrength =
        parseFloat(deformationSlider.value);

    document.getElementById(
        "deformationValue"
    ).textContent =
        deformationStrength.toFixed(2);

    sculpt();
};


frequencySlider.oninput = () => {

    frequency =
        parseFloat(frequencySlider.value);

    document.getElementById(
        "frequencyValue"
    ).textContent =
        frequency;

    sculpt();
};


twistSlider.oninput = () => {

    twistStrength =
        parseFloat(twistSlider.value);

    document.getElementById(
        "twistValue"
    ).textContent =
        twistStrength.toFixed(2);

    sculpt();
};


// ----------------------------------------------------
// RANDOMIZE
// ----------------------------------------------------

document.getElementById(
    "randomize"
).onclick = () => {

    rotationStrength =
        Math.random() * 8;

    deformationStrength =
        Math.random() * 1.2;

    frequency =
        Math.floor(
            2 + Math.random() * 10
        );

    twistStrength =
        -5 + Math.random() * 10;


    rotationSlider.value =
        rotationStrength;

    deformationSlider.value =
        deformationStrength;

    frequencySlider.value =
        frequency;

    twistSlider.value =
        twistStrength;


    document.getElementById(
        "rotationValue"
    ).textContent =
        rotationStrength.toFixed(2);

    document.getElementById(
        "deformationValue"
    ).textContent =
        deformationStrength.toFixed(2);

    document.getElementById(
        "frequencyValue"
    ).textContent =
        frequency;

    document.getElementById(
        "twistValue"
    ).textContent =
        twistStrength.toFixed(2);


    sculpt();
};


// ----------------------------------------------------
// RESET
// ----------------------------------------------------

document.getElementById(
    "reset"
).onclick = () => {

    rotationStrength = 0;

    deformationStrength = 0;

    frequency = 5;

    twistStrength = 0;


    rotationSlider.value = 0;

    deformationSlider.value = 0;

    frequencySlider.value = 5;

    twistSlider.value = 0;


    document.getElementById(
        "rotationValue"
    ).textContent = "0.00";

    document.getElementById(
        "deformationValue"
    ).textContent = "0.00";

    document.getElementById(
        "frequencyValue"
    ).textContent = "5";

    document.getElementById(
        "twistValue"
    ).textContent = "0.00";


    sculpt();
};


// ----------------------------------------------------
// INITIAL SCULPTURE
// ----------------------------------------------------

sculpt();


// ----------------------------------------------------
// ANIMATION
// ----------------------------------------------------

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();


    // Slowly rotate the entire sculpture.

    sculpture.rotation.y =
        t * 0.12;


    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// ----------------------------------------------------
// RESIZE
// ----------------------------------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
