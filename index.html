  <!-- Include Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/ParametricGeometry.js"></script>

  <script>
    // --- Application State ---
    const params = {
      surface: 'enneper',
      uRes: 80,
      vRes: 80,
      scale: 1.0,
      color: '#ffffff',
      roughness: 0.1,
      metalness: 0.1,
      clearcoat: 1.0,
      transmission: 0.6,
      wireframe: true,
      autoRotate: true,
      preset: 'iridescent'
    };

    // --- Parametric Surface Equations ---
    const ParametricSurfaces = {
      // 1. Enneper Surface
      enneper: (u, v, target) => {
        u = (u - 0.5) * 3;
        v = (v - 0.5) * 3;
        const x = u - (Math.pow(u, 3) / 3) + u * Math.pow(v, 2);
        const y = v - (Math.pow(v, 3) / 3) + v * Math.pow(u, 2);
        const z = Math.pow(u, 2) - Math.pow(v, 2);
        target.set(x, z, y).multiplyScalar(0.7);
      },

      // 2. Figure-8 Klein Bottle
      klein: (u, v, target) => {
        u = u * Math.PI * 2;
        v = v * Math.PI * 2;
        const r = 4 - 2 * Math.cos(u);
        let x, y, z;
        if (u < Math.PI) {
          x = 6 * Math.cos(u) * (1 + Math.sin(u)) + r * Math.cos(u) * Math.cos(v);
          y = 16 * Math.sin(u) + r * Math.sin(u) * Math.cos(v);
        } else {
          x = 6 * Math.cos(u) * (1 + Math.sin(u)) + r * Math.cos(v + Math.PI);
          y = 16 * Math.sin(u);
        }
        z = r * Math.sin(v);
        target.set(x, y, z).multiplyScalar(0.12);
      },

      // 3. Möbius Strip
      mobius: (u, v, target) => {
        u = u * Math.PI * 2;
        v = (v - 0.5) * 1.2;
        const x = (1 + (v / 2) * Math.cos(u / 2)) * Math.cos(u);
        const y = (1 + (v / 2) * Math.cos(u / 2)) * Math.sin(u);
        const z = (v / 2) * Math.sin(u / 2);
        target.set(x, z, y).multiplyScalar(1.4);
      },

      // 4. Torus Knot Surface (Trefoil-like extrusion)
      torusknot: (u, v, target) => {
        u = u * Math.PI * 2;
        v = v * Math.PI * 2;
        const p = 2, q = 3;
        const rKnot = 0.5 * (2 + Math.sin(q * u));
        const cx = rKnot * Math.cos(p * u);
        const cy = rKnot * Math.sin(p * u);
        const cz = 0.5 * Math.cos(q * u);

        const rTube = 0.35;
        const x = cx + rTube * Math.cos(v) * Math.cos(p * u);
        const y = cy + rTube * Math.cos(v) * Math.sin(p * u);
        const z = cz + rTube * Math.sin(v);
        target.set(x, z, y).multiplyScalar(1.2);
      },

      // 5. Dini's Surface
      dini: (u, v, target) => {
        u = u * 4 * Math.PI;
        v = 0.01 + v * 0.98; // Avoid v=0 singularities
        const a = 1.0;
        const b = 0.2;
        const x = a * Math.cos(u) * Math.sin(v);
        const y = a * Math.sin(u) * Math.sin(v);
        const z = a * (Math.cos(v) + Math.log(Math.tan(v / 2))) + b * u;
        target.set(x, z - 2, y).multiplyScalar(0.4);
      }
    };

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0f19, 0.05);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 20;
    controls.minDistance = 1;

    // --- Lighting Setup ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x6366f1, 2.5); // Indigo Tint Key Light
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xec4899, 1.8); // Pink/Rose Fill Light
    fillLight.position.set(-5, -2, -5);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0x38bdf8, 3, 10); // Cyan Rim Light
    rimLight.position.set(0, 4, -3);
    scene.add(rimLight);

    // --- Material & Mesh Creation ---
    const surfaceMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.color),
      roughness: params.roughness,
      metalness: params.metalness,
      clearcoat: params.clearcoat,
      clearcoatRoughness: 0.1,
      transmission: params.transmission,
      ior: 1.5,
      side: THREE.DoubleSide,
      flatShading: false
    });

    const wireframeMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.15
    });

    let meshGroup = new THREE.Group();
    let mainMesh, wireframeMesh;
    scene.add(meshGroup);

    function buildGeometry() {
      // Clear previous meshes
      while (meshGroup.children.length > 0) {
        const obj = meshGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }

      const surfaceFunc = ParametricSurfaces[params.surface];
      const geometry = new THREE.ParametricGeometry(surfaceFunc, params.uRes, params.vRes);
      geometry.center();
      geometry.computeVertexNormals();

      mainMesh = new THREE.Mesh(geometry, surfaceMaterial);
      wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
      wireframeMesh.visible = params.wireframe;

      meshGroup.add(mainMesh);
      meshGroup.add(wireframeMesh);
      meshGroup.scale.setScalar(params.scale);
    }

    // Initial Build
    buildGeometry();

    // --- UI Controls Integration ---
    const surfaceSelect = document.getElementById('surface-select');
    const uResSlider = document.getElementById('u-res-slider');
    const vResSlider = document.getElementById('v-res-slider');
    const scaleSlider = document.getElementById('scale-slider');
    const colorPicker = document.getElementById('material-color');
    const roughnessSlider = document.getElementById('roughness-slider');
    const metalnessSlider = document.getElementById('metalness-slider');
    const clearcoatSlider = document.getElementById('clearcoat-slider');
    const transmissionSlider = document.getElementById('transmission-slider');
    const wireframeToggle = document.getElementById('wireframe-toggle');
    const autoRotateToggle = document.getElementById('autorotate-toggle');
    const resetCamBtn = document.getElementById('reset-cam-btn');

    // UI Input Event Listeners
    surfaceSelect.addEventListener('change', (e) => {
      params.surface = e.target.value;
      buildGeometry();
    });

    uResSlider.addEventListener('input', (e) => {
      params.uRes = parseInt(e.target.value);
      document.getElementById('u-res-val').innerText = params.uRes;
      buildGeometry();
    });

    vResSlider.addEventListener('input', (e) => {
      params.vRes = parseInt(e.target.value);
      document.getElementById('v-res-val').innerText = params.vRes;
      buildGeometry();
    });

    scaleSlider.addEventListener('input', (e) => {
      params.scale = parseFloat(e.target.value);
      document.getElementById('scale-val').innerText = params.scale.toFixed(1);
      meshGroup.scale.setScalar(params.scale);
    });

    colorPicker.addEventListener('input', (e) => {
      params.color = e.target.value;
      surfaceMaterial.color.set(params.color);
    });

    roughnessSlider.addEventListener('input', (e) => {
      params.roughness = parseFloat(e.target.value);
      document.getElementById('roughness-val').innerText = params.roughness.toFixed(2);
      surfaceMaterial.roughness = params.roughness;
    });

    metalnessSlider.addEventListener('input', (e) => {
      params.metalness = parseFloat(e.target.value);
      document.getElementById('metalness-val').innerText = params.metalness.toFixed(2);
      surfaceMaterial.metalness = params.metalness;
    });

    clearcoatSlider.addEventListener('input', (e) => {
      params.clearcoat = parseFloat(e.target.value);
      document.getElementById('clearcoat-val').innerText = params.clearcoat.toFixed(2);
      surfaceMaterial.clearcoat = params.clearcoat;
    });

    transmissionSlider.addEventListener('input', (e) => {
      params.transmission = parseFloat(e.target.value);
      document.getElementById('transmission-val').innerText = params.transmission.toFixed(2);
      surfaceMaterial.transmission = params.transmission;
    });

    wireframeToggle.addEventListener('change', (e) => {
      params.wireframe = e.target.checked;
      if (wireframeMesh) wireframeMesh.visible = params.wireframe;
    });

    autoRotateToggle.addEventListener('change', (e) => {
      params.autoRotate = e.target.checked;
      controls.autoRotate = params.autoRotate;
    });

    resetCamBtn.addEventListener('click', () => {
      camera.position.set(0, 2.5, 5);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    // Material Presets
    const presets = {
      iridescent: { color: '#ffffff', roughness: 0.1, metalness: 0.1, clearcoat: 1.0, transmission: 0.6 },
      gold: { color: '#ffb703', roughness: 0.2, metalness: 0.9, clearcoat: 0.3, transmission: 0.0 },
      chrome: { color: '#ffffff', roughness: 0.05, metalness: 1.0, clearcoat: 1.0, transmission: 0.0 },
      emerald: { color: '#10b981', roughness: 0.15, metalness: 0.0, clearcoat: 1.0, transmission: 0.75 }
    };

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const p = presets[e.target.dataset.preset];
        if (p) {
          params.color = p.color;
          params.roughness = p.roughness;
          params.metalness = p.metalness;
          params.clearcoat = p.clearcoat;
          params.transmission = p.transmission;

          colorPicker.value = p.color;
          roughnessSlider.value = p.roughness;
          metalnessSlider.value = p.metalness;
          clearcoatSlider.value = p.clearcoat;
          transmissionSlider.value = p.transmission;

          document.getElementById('roughness-val').innerText = p.roughness.toFixed(2);
          document.getElementById('metalness-val').innerText = p.metalness.toFixed(2);
          document.getElementById('clearcoat-val').innerText = p.clearcoat.toFixed(2);
          document.getElementById('transmission-val').innerText = p.transmission.toFixed(2);

          surfaceMaterial.color.set(p.color);
          surfaceMaterial.roughness = p.roughness;
          surfaceMaterial.metalness = p.metalness;
          surfaceMaterial.clearcoat = p.clearcoat;
          surfaceMaterial.transmission = p.transmission;
        }
      });
    });

    // Mobile UI Toggle
    const toggleBtn = document.getElementById('toggle-ui-btn');
    const controlPanel = document.getElementById('control-panel');
    toggleBtn.addEventListener('click', () => {
      controlPanel.classList.toggle('translate-x-full');
    });

    // Configure Initial OrbitControls state
    controls.autoRotate = params.autoRotate;
    controls.autoRotateSpeed = 1.5;

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Slow dynamic pulsing or rim light shift for aesthetic depth
      rimLight.position.x = Math.sin(elapsedTime * 0.5) * 4;
      rimLight.position.z = Math.cos(elapsedTime * 0.5) * 4;

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = animate;
  </script>
</body>
