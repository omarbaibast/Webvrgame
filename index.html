<!DOCTYPE html>

  <!-- Tailwind CSS CDN -->

  <!-- FontAwesome for Icons -->

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      color: #fff;
    }
    
    /* Stereo Split Layout */
    .stereo-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    .eye-view {
      width: 50vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Eye Divider Line for VR Box Alignment */
    .eye-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 40;
      pointer-events: none;
    }
    
    canvas.webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;

    /* VR HUD Styling */
    .vr-hud {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;

      justify-content: space-between;
      padding: 1.5rem;
      box-sizing: border-box;

    /* Glowing HUD accents */

            <circle cx="20" cy="20" r="8" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="2 2"/>
            <line x1="20" y1="2" x2="20" y2="10" stroke="#00F0FF" stroke-width="1.5"/>
            <line x1="20" y1="30" x2="20" y2="38" stroke="#00F0FF" stroke-width="1.5"/>
            <line x1="2" y1="20" x2="10" y2="20" stroke="#00F0FF" stroke-width="1.5"/>
            <line x1="30" y1="20" x2="38" y2="20" stroke="#00F0FF" stroke-width="1.5"/>

        <!-- Bottom GPS Data Card -->
        <div class="hud-card p-3 w-full max-w-xs">
          <div class="flex items-center gap-2 text-xs font-semibold text-cyan-400 mb-1">

  </div>

  <!-- Manual On-Screen Controls for Setup / Desktop Testing -->
  <div class="setup-overlay shadow-2xl">

    <button id="btn-stop" class="px-3 py-1.5 rounded-lg bg-gray-700/80 hover:bg-gray-600 text-xs font-semibold text-white flex items-center gap-2 transition">
      <i class="fa-solid fa-square"></i> Voice: "Stop"
    </button>
    <button id="btn-mode" class="px-3 py-1.5 rounded-lg bg-indigo-600/80 hover:bg-indigo-500 text-xs font-semibold text-white flex items-center gap-2 transition">
      <i class="fa-solid fa-vr-cardboard"></i> Switch Mode ("Play"/"AR")
    </button>
  </div>

  <!-- Application Logic JavaScript -->
  <script>
    /**
     * WebVR / WebAR Dual-Eye Voice Controller Engine
     */
    
    // --- Application State ---
    const state = {
      mode: 'AR', // 'AR' or 'VR'
      isRecording: false,
      recordingStartTime: 0,
      recInterval: null,
      recordedClips: [], // Stores { id, blobUrl, gps, timestamp }
      activeVideoIndex: 0,
      gps: {
        lat: 'Waiting...',
        lng: 'Waiting...',
        alt: 'N/A',
        accuracy: 'N/A'
      },
      lastVoiceCmd: 'Listening for "Record" / "Stop" / "Play"',
      cameraActive: false
    };

    // --- DOM Elements ---
    const videoElem = document.getElementById('webcam-video');
    const leftCanvas = document.getElementById('canvas-left');
    const rightCanvas = document.getElementById('canvas-right');

    const leftModeBadge = document.getElementById('left-mode-badge');
    const rightModeBadge = document.getElementById('right-mode-badge');
    const leftRecInd = document.getElementById('left-rec-indicator');
    const rightRecInd = document.getElementById('right-rec-indicator');
    const leftRecTimer = document.getElementById('left-rec-timer');
    const rightRecTimer = document.getElementById('right-rec-timer');
    const leftGpsInfo = document.getElementById('left-gps-info');
    const rightGpsInfo = document.getElementById('right-gps-info');
    const leftLastCmd = document.getElementById('left-last-command');
    const rightLastCmd = document.getElementById('right-last-command');

    // --- Three.js Dual Eye Setup ---
    let scene, rendererLeft, rendererRight;
    let cameraLeft, cameraRight;
    let arCameraPlane, arVideoTexture;
    let arFloatingObjectsGroup;
    let vrTheaterGroup, vrVideoPlane, vrVideoTexture, vrTextCanvasPlane;
    let vrTextCanvas, vrTextCtx;

    const EYE_SEPARATION = 0.064; // Standard interpupillary distance for stereo effect

    function init3D() {
      // Create Main Scene
      scene = new THREE.Scene();

      // Setup Cameras for Stereoscopic View
      const aspect = (window.innerWidth / 2) / window.innerHeight;
      
      cameraLeft = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
      cameraRight = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);

      cameraLeft.position.set(-EYE_SEPARATION / 2, 0, 3);
      cameraRight.position.set(EYE_SEPARATION / 2, 0, 3);

      // Renderers for Left & Right Canvases
      rendererLeft = new THREE.WebGLRenderer({ canvas: leftCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      rendererRight = new THREE.WebGLRenderer({ canvas: rightCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      
      resizeRenderers();

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
      dirLight.position.set(2, 4, 3);
      scene.add(dirLight);

      // --- Build AR Plane Background ---
      // Dummy texture if camera isn't loaded yet
      const canvasPlaceholder = document.createElement('canvas');
      canvasPlaceholder.width = 640;
      canvasPlaceholder.height = 480;
      const ctx = canvasPlaceholder.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 640, 480);
      ctx.fillStyle = '#00f0ff';
      ctx.font = '24px sans-serif';
      ctx.fillText('Camera feed initializing...', 180, 240);

      arVideoTexture = new THREE.CanvasTexture(canvasPlaceholder);
      const arPlaneGeo = new THREE.PlaneGeometry(16, 9);
      const arPlaneMat = new THREE.MeshBasicMaterial({ map: arVideoTexture, depthWrite: false });
      arCameraPlane = new THREE.Mesh(arPlaneGeo, arPlaneMat);
      arCameraPlane.position.set(0, 0, -10);
      scene.add(arCameraPlane);

      // --- Floating Interactive AR Elements ---
      arFloatingObjectsGroup = new THREE.Group();
      
      // Floating Cyber Ring
      const ringGeo = new THREE.TorusGeometry(0.8, 0.04, 16, 100);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, wireframe: true, emissive: 0x00f0ff, emissiveIntensity: 0.5 });
      const cyberRing = new THREE.Mesh(ringGeo, ringMat);
      cyberRing.position.set(0, 0, 0);
      arFloatingObjectsGroup.add(cyberRing);

      // Orbiting Cubes
      const cubeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
      for (let i = 0; i < 4; i++) {
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        const angle = (i / 4) * Math.PI * 2;
        cube.position.set(Math.cos(angle) * 1.5, Math.sin(angle) * 1.5, 0);
        cube.userData = { angle: angle };
        arFloatingObjectsGroup.add(cube);
      }
      
      scene.add(arFloatingObjectsGroup);

      // --- VR Theater Gallery Setup ---
      vrTheaterGroup = new THREE.Group();
      vrTheaterGroup.visible = false; // Hidden in AR mode

      // Curved Virtual Theater Screen
      const screenGeo = new THREE.PlaneGeometry(4, 2.25);
      const screenMat = new THREE.MeshBasicMaterial({ color: 0x111122 });
      vrVideoPlane = new THREE.Mesh(screenGeo, screenMat);
      vrVideoPlane.position.set(0, 0.2, -3);
      vrTheaterGroup.add(vrVideoPlane);

      // Geotag VR Info Card (2D Canvas to 3D Mesh)
      vrTextCanvas = document.createElement('canvas');
      vrTextCanvas.width = 512;
      vrTextCanvas.height = 256;
      vrTextCtx = vrTextCanvas.getContext('2d');
      updateVRInfoCard("No recording selected", "N/A");

      vrTextCanvasTexture = new THREE.CanvasTexture(vrTextCanvas);
      const vrCardGeo = new THREE.PlaneGeometry(3, 1.2);
      const vrCardMat = new THREE.MeshBasicMaterial({ map: vrTextCanvasTexture, transparent: true });
      vrTextCanvasPlane = new THREE.Mesh(vrCardGeo, vrCardMat);
      vrTextCanvasPlane.position.set(0, -1.6, -3);
      vrTheaterGroup.add(vrTextCanvasPlane);

      // VR Environment Grid Background
      const gridHelper = new THREE.GridHelper(20, 20, 0x00f0ff, 0x1e293b);
      gridHelper.position.y = -2;
      vrTheaterGroup.add(gridHelper);

      scene.add(vrTheaterGroup);

      // Device Orientation Controller Setup for head-tracking preview
      window.addEventListener('deviceorientation', handleHeadTracking);
    }

    // Dynamic VR Info Card Canvas Renderer
    function updateVRInfoCard(title, gpsText) {
      if (!vrTextCtx) return;
      vrTextCtx.clearRect(0, 0, 512, 256);
      
      // Card Background Glassmorphism
      vrTextCtx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      vrTextCtx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
      vrTextCtx.lineWidth = 4;
      vrTextCtx.beginPath();
      vrTextCtx.roundRect(10, 10, 492, 236, 16);
      vrTextCtx.fill();
      vrTextCtx.stroke();

      // Card Header
      vrTextCtx.fillStyle = '#00f0ff';
      vrTextCtx.font = 'bold 22px sans-serif';
      vrTextCtx.fillText('RECORDED GEOTAG DATA', 30, 45);

      // Video Info
      vrTextCtx.fillStyle = '#ffffff';
      vrTextCtx.font = '18px sans-serif';
      vrTextCtx.fillText(`Clip: ${title}`, 30, 85);

      // GPS Lines
      vrTextCtx.fillStyle = '#94a3b8';
      vrTextCtx.font = '16px monospace';
      const lines = gpsText.split('\n');
      lines.forEach((line, idx) => {
        vrTextCtx.fillText(line, 30, 130 + (idx * 25));
      });

      if (vrTextCanvasPlane && vrTextCanvasPlane.material.map) {
        vrTextCanvasPlane.material.map.needsUpdate = true;
      }
    }

    // Head-tracking fallback using Device Orientation
    function handleHeadTracking(e) {
      if (e.alpha !== null && state.mode === 'VR') {
        const yaw = THREE.MathUtils.degToRad(e.alpha || 0);
        const pitch = THREE.MathUtils.degToRad(e.beta || 0);
        
        // Slightly tilt camera in VR mode for immersion
        cameraLeft.rotation.y = yaw * 0.1;
        cameraRight.rotation.y = yaw * 0.1;
      }
    }

    function resizeRenderers() {
      const width = window.innerWidth / 2;
      const height = window.innerHeight;

      cameraLeft.aspect = width / height;
      cameraLeft.updateProjectionMatrix();

      cameraRight.aspect = width / height;
      cameraRight.updateProjectionMatrix();

      rendererLeft.setSize(width, height);
      rendererRight.setSize(width, height);
    }

    window.addEventListener('resize', resizeRenderers);

    // --- WebAR Camera Access ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        videoElem.srcObject = stream;
        await videoElem.play();

        arVideoTexture = new THREE.VideoTexture(videoElem);
        arCameraPlane.material.map = arVideoTexture;
        arCameraPlane.material.needsUpdate = true;
        state.cameraActive = true;
        updateLastCommand("Camera Feed Active");
      } catch (err) {
        console.warn("Camera access denied or unvailable:", err);
        updateLastCommand("Cam Error: Use Setup Mode");
      }
    }

    // --- Speech Recognition API (Voice Control) ---
    let recognition;
    function initVoiceControl() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        updateLastCommand("Voice API not supported");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim().toLowerCase();
        console.log("Voice Command Recognized:", transcript);
        processVoiceCommand(transcript);
      };

      recognition.onerror = (e) => {
        console.warn("Voice Recognition Error:", e.error);
      };

      recognition.onend = () => {
        // Auto-restart continuous listening loop
        try { recognition.start(); } catch(e) {}
      };

      try {
        recognition.start();
      } catch(e) {
        console.error("Could not start voice recognition", e);
      }
    }

    function processVoiceCommand(cmd) {
      updateLastCommand(`Heard: "${cmd}"`);

      if (cmd.includes('record') || cmd.includes('start recording')) {
        startRecording();
      } else if (cmd.includes('stop') || cmd.includes('stop recording')) {
        stopRecording();
      } else if (cmd.includes('play') || cmd.includes('view') || cmd.includes('gallery')) {
        switchMode('VR');
      } else if (cmd.includes('ar') || cmd.includes('back') || cmd.includes('live')) {
        switchMode('AR');
      } else if (cmd.includes('next')) {
        cycleNextVRVideo();
      }
    }

    function updateLastCommand(msg) {
      state.lastVoiceCmd = msg;
      leftLastCmd.textContent = msg;
      rightLastCmd.textContent = msg;
    }

    // --- GPS Geolocation API ---
    function initGPS() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            state.gps.lat = pos.coords.latitude.toFixed(5);
            state.gps.lng = pos.coords.longitude.toFixed(5);
            state.gps.alt = pos.coords.altitude ? `${pos.coords.altitude.toFixed(1)}m` : 'Sea Level';
            state.gps.accuracy = `${pos.coords.accuracy.toFixed(1)}m`;
            renderGPSHUD();
          },
          (err) => {
            state.gps.lat = '37.7749 (Sim)';
            state.gps.lng = '-122.4194';
            renderGPSHUD();
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        state.gps.lat = '37.7749 (Sim)';
        state.gps.lng = '-122.4194';
        renderGPSHUD();
      }
    }

    function renderGPSHUD() {
      const text = `LAT: ${state.gps.lat} | LNG: ${state.gps.lng}\nALT: ${state.gps.alt} | ACC: ${state.gps.accuracy}`;
      leftGpsInfo.innerText = text;
      rightGpsInfo.innerText = text;
    }

    // --- MediaRecorder (Recording AR Dual Canvas Stream) ---
    let mediaRecorder;
    let recordedChunks = [];

    function startRecording() {
      if (state.isRecording) return;

      // Merge Left Eye Canvas Stream into Recording
      const stream = leftCanvas.captureStream(30);

      // Include audio track if available
      if (videoElem.srcObject && videoElem.srcObject.getAudioTracks().length > 0) {
        stream.addTrack(videoElem.srcObject.getAudioTracks()[0]);
      }

      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      recordedChunks = [];
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = saveRecordedVideo;

      mediaRecorder.start();
      state.isRecording = true;
      state.recordingStartTime = Date.now();

      // Update UI Indicators
      leftRecInd.classList.remove('hidden');
      rightRecInd.classList.remove('hidden');

      state.recInterval = setInterval(updateRecTimer, 1000);
      updateLastCommand("Recording Started...");
    }

    function stopRecording() {
      if (!state.isRecording) return;

      mediaRecorder.stop();
      state.isRecording = false;

      clearInterval(state.recInterval);
      leftRecInd.classList.add('hidden');
      rightRecInd.classList.add('hidden');
      updateLastCommand("Recording Saved!");
    }

    function updateRecTimer() {
      const elapsedSec = Math.floor((Date.now() - state.recordingStartTime) / 1000);
      const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const secs = String(elapsedSec % 60).padStart(2, '0');
      const timerStr = `REC ${mins}:${secs}`;
      leftRecTimer.textContent = timerStr;
      rightRecTimer.textContent = timerStr;
    }

    function saveRecordedVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const videoUrl = URL.createObjectURL(blob);
      
      const newClip = {
        id: Date.now(),
        url: videoUrl,
        gps: { ...state.gps },
        timestamp: new Date().toLocaleTimeString()
      };

      state.recordedClips.push(newClip);
      state.activeVideoIndex = state.recordedClips.length - 1;
      
      console.log("Saved Video Geotagged Clip:", newClip);
    }

    // --- AR / VR Mode Switcher ---
    function switchMode(targetMode) {
      state.mode = targetMode;
      
      if (targetMode === 'VR') {
        leftModeBadge.textContent = 'VR GALLERY';
        rightModeBadge.textContent = 'VR GALLERY';
        leftModeBadge.className = 'px-2.5 py-1 rounded-md text-xs font-bold tracking-wider bg-indigo-500/20 text-indigo-400 border border-indigo-500/40';
        rightModeBadge.className = 'px-2.5 py-1 rounded-md text-xs font-bold tracking-wider bg-indigo-500/20 text-indigo-400 border border-indigo-500/40';

        arCameraPlane.visible = false;
        arFloatingObjectsGroup.visible = false;
        vrTheaterGroup.visible = true;

        loadVRVideoPlayback();
      } else {
        leftModeBadge.textContent = 'AR MODE';
        rightModeBadge.textContent = 'AR MODE';
        leftModeBadge.className = 'px-2.5 py-1 rounded-md text-xs font-bold tracking-wider bg-cyan-500/20 text-cyan-400 border border-cyan-500/40';
        rightModeBadge.className = 'px-2.5 py-1 rounded-md text-xs font-bold tracking-wider bg-cyan-500/20 text-cyan-400 border border-cyan-500/40';

        arCameraPlane.visible = true;
        arFloatingObjectsGroup.visible = true;
        vrTheaterGroup.visible = false;
      }
    }

    function loadVRVideoPlayback() {
      if (state.recordedClips.length === 0) {
        updateVRInfoCard("No Videos Recorded Yet", "Say 'Record' in AR mode to make your first geotagged VR clip.");
        return;
      }

      const clip = state.recordedClips[state.activeVideoIndex];
      const playbackVideo = document.createElement('video');
      playbackVideo.src = clip.url;
      playbackVideo.crossOrigin = 'anonymous';
      playbackVideo.loop = true;
      playbackVideo.play();

      vrVideoTexture = new THREE.VideoTexture(playbackVideo);
      vrVideoPlane.material.map = vrVideoTexture;
      vrVideoPlane.material.needsUpdate = true;

      const gpsDetails = `LAT: ${clip.gps.lat}\nLNG: ${clip.gps.lng}\nALT: ${clip.gps.alt}\nTIMESTAMP: ${clip.timestamp}`;
      updateVRInfoCard(`Clip #${state.activeVideoIndex + 1}`, gpsDetails);
    }

    function cycleNextVRVideo() {
      if (state.recordedClips.length === 0) return;
      state.activeVideoIndex = (state.activeVideoIndex + 1) % state.recordedClips.length;
      loadVRVideoPlayback();
    }

    // --- Animation & Render Loop ---
    function animate(time) {
      requestAnimationFrame(animate);

      // Rotate Floating AR Objects
      if (arFloatingObjectsGroup.visible) {
        arFloatingObjectsGroup.rotation.y = time * 0.0005;
        arFloatingObjectsGroup.children.forEach((child, idx) => {
          if (child.userData.angle !== undefined) {
            child.rotation.x += 0.02;
            child.rotation.y += 0.02;
          }
        });
      }

      // Render Stereo Left and Right Views
      rendererLeft.render(scene, cameraLeft);
      rendererRight.render(scene, cameraRight);
    }

    // --- Setup Event Listeners for Manual On-Screen Controls ---
    document.getElementById('btn-toggle-cam').addEventListener('click', initCamera);
    document.getElementById('btn-record').addEventListener('click', startRecording);
    document.getElementById('btn-stop').addEventListener('click', stopRecording);
    document.getElementById('btn-mode').addEventListener('click', () => {
      switchMode(state.mode === 'AR' ? 'VR' : 'AR');
    });

    // --- Initialize Application ---
    window.onload = () => {
      init3D();
      initCamera();
      initVoiceControl();
      initGPS();
      animate(0);
    };
  </script>
</body>
</html>
