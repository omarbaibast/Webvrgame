
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voxel Sandbox - Creative Mode</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas { display: block; }

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: rgba(0,10,25,.85);
  border: 1px solid #00d9ff;
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  pointer-events: none;
}

#material { color: #00ffff; font-weight: bold; }

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  color: cyan;
  font-size: 25px;
  z-index: 5;
  pointer-events: none;
}

#diagnostics {
  position: fixed;
  top: 125px;
  left: 10px;
  z-index: 15;
  max-width: calc(100vw - 20px);
  max-height: 100px;
  overflow: auto;
  background: rgba(0,0,0,.8);
  color: #66ff88;
  font-size: 10px;
  padding: 8px;
  pointer-events: none;
}

#help {
  position: fixed;
  bottom: 8px;
  left: 8px;
  z-index: 10;
  background: rgba(0,0,0,.7);
  padding: 8px;
  font-size: 11px;
  line-height: 1.5;
  pointer-events: none;
}

#touchControls {
  position: fixed;
  bottom: 15px;
  right: 12px;
  z-index: 20;
  display: flex;
  gap: 8px;
}

.touchButton {
  width: 55px;
  height: 55px;
  border: 1px solid #00d9ff;
  border-radius: 50%;
  background: rgba(0,40,70,.75);
  color: white;
  font-size: 18px;
  touch-action: none;
}

#enterButton {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 30;
  padding: 10px;
  color: white;
  background: #07536a;
  border: 1px solid cyan;
  border-radius: 6px;
}

@media (hover: hover) and (pointer: fine) {
  #touchControls { display: none; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <b>VOXEL CREATIVE MODE</b><br>
  Material: <span id="material">CYAN METAL</span><br>
  Cubes: <span id="cubeCount">0</span><br>
  Controller: <span id="connection">Waiting...</span><br>
  VR: <span id="vrStatus">Ready</span>
</div>

<div id="diagnostics">Waiting for controller...</div>
<div id="crosshair">+</div>

<button id="enterButton">ENTER VR</button>

<div id="help">
  WASD: Move | Mouse: Look<br>
  Left click: Place | Right click: Destroy<br>
  L1/R1: Material | L2+R2: Place<br>
  Circle: Destroy | X: Up | Square: Down<br>
  Left stick: Move | Right stick: Look
</div>

<div id="touchControls">
  <button class="touchButton" id="placeTouch">+</button>
  <button class="touchButton" id="destroyTouch">O</button>
  <button class="touchButton" id="upTouch">↑</button>
  <button class="touchButton" id="downTouch">↓</button>
  <button class="touchButton" id="nextTouch">M</button>
</div>

<script type="module">

import * as THREE from "three";
import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/webxr/VRButton.js";

// ==================================================
// SCENE
// ==================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080d18);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth/window.innerHeight, 0.1, 500
);

const player = new THREE.Group();
scene.add(player);

camera.position.set(0, 1.6, 0);
player.add(camera);

// ==================================================
// LIGHTS
// ==================================================

scene.add(new THREE.HemisphereLight(
  0x80dfff, 0x151020, 1.5
));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10,20,10);
scene.add(sun);

// ==================================================
// RENDERER
// ==================================================

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);

// ==================================================
// VR
// ==================================================

const vrButton = VRButton.createButton(renderer);
document.body.appendChild(vrButton);

document.getElementById("enterButton").onclick = () => {
  if (!navigator.xr) {
    alert("WebXR is not available. Use HTTPS and a compatible VR browser.");
    return;
  }

  navigator.xr.isSessionSupported("immersive-vr")
    .then(supported => {
      if (!supported) {
        alert("Immersive VR is not supported by this browser.");
        return;
      }

      navigator.xr.requestSession("immersive-vr", {
        optionalFeatures: ["local-floor", "bounded-floor"]
      }).then(session => renderer.xr.setSession(session))
        .catch(error => alert(error.message));
    });
};

// ==================================================
// MATERIALS
// ==================================================

const materials = [
  {name:"CYAN METAL",color:0x00ccff,emissive:0x003344},
  {name:"ALIEN PURPLE",color:0x8833ff,emissive:0x220044},
  {name:"LIME ENERGY",color:0x66ff33,emissive:0x224400},
  {name:"GOLD",color:0xffbb22,emissive:0x442200},
  {name:"WHITE FUTURE",color:0xffffff,emissive:0x222222},
  {name:"DARK STEEL",color:0x444d5a,emissive:0x000000},
  {name:"RED ENERGY",color:0xff2244,emissive:0x440011},
  {name:"ICE CRYSTAL",color:0x99ffff,emissive:0x225555}
];

let selectedMaterial = 0;

function makeMaterial(index) {
  const m = materials[index];

  return new THREE.MeshStandardMaterial({
    color:m.color,
    emissive:m.emissive,
    metalness:0.65,
    roughness:0.3
  });
}

function nextMaterial(direction) {
  selectedMaterial =
    (selectedMaterial + direction + materials.length)
    % materials.length;

  document.getElementById("material").textContent =
    materials[selectedMaterial].name;
}

// ==================================================
// VOXEL SYSTEM
// ==================================================

const cubeGeometry = new THREE.BoxGeometry(1,1,1);
const voxels = [];

function updateCount() {
  document.getElementById("cubeCount").textContent =
    voxels.length;
}

function createVoxel(position) {

  // Prevent overlapping cubes
  for (const voxel of voxels) {
    if (voxel.position.distanceTo(position) < 0.1) {
      return;
    }
  }

  const cube = new THREE.Mesh(
    cubeGeometry,
    makeMaterial(selectedMaterial)
  );

  cube.position.copy(position);
  cube.userData.isVoxel = true;
  cube.userData.materialIndex = selectedMaterial;

  scene.add(cube);
  voxels.push(cube);

  updateCount();
}

function destroyVoxel(cube) {
  if (!cube || !cube.userData.isVoxel) return;

  scene.remove(cube);

  const index = voxels.indexOf(cube);
  if (index !== -1) voxels.splice(index,1);

  cube.material.dispose();
  updateCount();
}

// ==================================================
// AIMING
// ==================================================

const raycaster = new THREE.Raycaster();
raycaster.far = 8;

const center = new THREE.Vector2(0,0);

let targetVoxel = null;
let targetNormal = null;

function updateTarget() {

  // Aim from the center of the camera view.
  raycaster.setFromCamera(center,camera);

  const hits = raycaster.intersectObjects(voxels,false);

  targetVoxel = null;
  targetNormal = null;

  if (hits.length > 0) {
    targetVoxel = hits[0].object;

    targetNormal = hits[0].face.normal.clone()
      .transformDirection(targetVoxel.matrixWorld);
  }
}

function placeVoxel() {
  if (!targetVoxel || !targetNormal) return;

  const position = targetVoxel.position.clone()
    .add(targetNormal.clone());

  createVoxel(position);
}

function destroyTarget() {
  if (targetVoxel) destroyVoxel(targetVoxel);
}

// ==================================================
// CONTROLLER CONNECTION
// ==================================================

window.addEventListener("gamepadconnected", event => {
  document.getElementById("connection").textContent =
    "Connected";

  console.log("Gamepad connected:", event.gamepad.id);
});

window.addEventListener("gamepaddisconnected", () => {
  document.getElementById("connection").textContent =
    "Disconnected";
});

const previousButtons = {};

function pressed(gp,index) {
  return !!gp.buttons[index]?.pressed;
}

function justPressed(gp,index) {
  const current = pressed(gp,index);
  const old = previousButtons[index] || false;

  previousButtons[index] = current;

  return current && !old;
}

function axis(gp,index) {
  const value = gp.axes[index] || 0;
  return Math.abs(value) < 0.15 ? 0 : value;
}

function updateGamepad() {

  const gamepads = navigator.getGamepads
    ? navigator.getGamepads()
    : [];

  let gp = null;

  for (const item of gamepads) {
    if (item && item.connected) {
      gp = item;
      break;
    }
  }

  const diagnostic = document.getElementById("diagnostics");

  if (!gp) {
    diagnostic.textContent =
      "No controller detected. Press a controller button after pairing.";
    document.getElementById("connection").textContent =
      "Waiting...";
    return;
  }

  document.getElementById("connection").textContent =
    "Connected";

  diagnostic.textContent =
    gp.id + " | Mapping: " + (gp.mapping || "custom") +
    " | Axes: " +
    Array.from(gp.axes).map(v=>v.toFixed(2)).join(", ") +
    " | Buttons: " +
    gp.buttons.map((b,i)=>i+":"+(b.pressed?"ON":"off")).join(" ");

  // Standard DualShock 4 mapping:
  // 0 Cross, 1 Circle, 2 Square, 4 L1, 5 R1,
  // 6 L2, 7 R2.

  if (justPressed(gp,4)) nextMaterial(-1);
  if (justPressed(gp,5)) nextMaterial(1);

  // Aim with L2; place with R2.
  if (pressed(gp,6) && justPressed(gp,7)) {
    placeVoxel();
  }

  // Circle: destroy.
  if (justPressed(gp,1)) {
    destroyTarget();
  }

  // Cross: up.
  if (pressed(gp,0)) {
    player.position.y += 0.06;
  }

  // Square: down.
  if (pressed(gp,2)) {
    player.position.y -= 0.06;
  }

  // Left stick: move player.
  const lx = axis(gp,0);
  const ly = axis(gp,1);

  const forward = new THREE.Vector3(0,0,-1)
    .applyQuaternion(player.quaternion);

  const right = new THREE.Vector3(1,0,0)
    .applyQuaternion(player.quaternion);

  player.position.addScaledVector(forward,-ly*0.08);
  player.position.addScaledVector(right,lx*0.08);

  // Right stick: rotate camera.
  const rx = axis(gp,2);
  const ry = axis(gp,3);

  player.rotation.y -= rx*0.045;

  camera.rotation.x -= ry*0.045;

  camera.rotation.x = THREE.MathUtils.clamp(
    camera.rotation.x,-1.5,1.5
  );
}

// ==================================================
// KEYBOARD AND MOUSE
// ==================================================

const keys = {};

window.addEventListener("keydown",e=>{
  keys[e.code]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

let mouseLocked = false;

renderer.domElement.addEventListener("click",()=>{
  if (!renderer.xr.isPresenting) {
    renderer.domElement.requestPointerLock?.();
  }
});

document.addEventListener("pointerlockchange",()=>{
  mouseLocked =
    document.pointerLockElement === renderer.domElement;
});

document.addEventListener("mousemove",e=>{
  if (!mouseLocked || renderer.xr.isPresenting) return;

  player.rotation.y -= e.movementX*0.002;
  camera.rotation.x -= e.movementY*0.002;

  camera.rotation.x = THREE.MathUtils.clamp(
    camera.rotation.x,-1.5,1.5
  );
});

window.addEventListener("mousedown",e=>{
  if (renderer.xr.isPresenting) return;

  if (e.button===0) placeVoxel();
  if (e.button===2) destroyTarget();
});

window.addEventListener("contextmenu",e=>e.preventDefault());

function updateKeyboard() {
  if (renderer.xr.isPresenting) return;

  if (keys.KeyW) player.translateZ(-0.08);
  if (keys.KeyS) player.translateZ(0.08);
  if (keys.KeyA) player.translateX(-0.08);
  if (keys.KeyD) player.translateX(0.08);

  if (keys.Space) player.position.y+=0.08;
  if (keys.ShiftLeft) player.position.y-=0.08;
}

// ==================================================
// MOBILE TOUCH BUTTONS
// ==================================================

function touchAction(id, action) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    action();
  });
}

touchAction("placeTouch",placeVoxel);
touchAction("destroyTouch",destroyTarget);
touchAction("nextTouch",()=>nextMaterial(1));
touchAction("upTouch",()=>player.position.y+=0.3);
touchAction("downTouch",()=>player.position.y-=0.3);

// ==================================================
// VR STATUS
// ==================================================

renderer.xr.addEventListener("sessionstart",()=>{
  document.getElementById("vrStatus").textContent="Active";
});

renderer.xr.addEventListener("sessionend",()=>{
  document.getElementById("vrStatus").textContent="Ready";
});

// ==================================================
// RESIZE
// ==================================================

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ==================================================
// GAME LOOP
// ==================================================

function animate() {
  updateGamepad();
  updateKeyboard();
  updateTarget();

  renderer.render(scene,camera);
}

renderer.setAnimationLoop(animate);

</script>
</body>
</html>
