<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Studio-Grade AI Dance Producer</title>
    <style>
        body { margin: 0; background: #070709; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #container { position: relative; width: 800px; height: 600px; border-radius: 16px; overflow: hidden; border: 2px solid #3f3f46; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        video, canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
        #ui { margin-top: 15px; text-align: center; }
        button { padding: 16px 36px; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5); transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
        #info { margin-top: 10px; color: #a1a1aa; font-family: monospace; font-size: 14px; }
    </style>

    <!-- Tone.js, MediaPipe & Camera Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="webcam" playsinline></video>
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>
    <div id="ui">
        <button id="btn">Load Studio Samples & Start</button>
        <div id="info">Status: Waiting for asset load...</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const btn = document.getElementById('btn');
        const infoEl = document.getElementById('info');

        let isEngineRunning = false;
        let pianoSampler, kickSynth, hihatSynth, compressor, reverb, delay;
        let lastNotePlayed = "";

        // Professional Pentatonic scale for smooth, melodic playback
        const leadScale = ["C4", "D4", "F4", "G4", "A4", "C5", "D5", "F5", "G5"];

        function logStatus(msg) {
            infoEl.innerText = msg;
        }

        async function initStudioEngine() {
            logStatus("Starting audio context & loading studio samples...");
            await Tone.start();
            Tone.Transport.bpm.value = 115; // Smooth modern tempo

            // --- MASTER STUDIO EFFECTS CHAIN ---
            compressor = new Tone.Compressor({
                threshold: -20,
                ratio: 4,
                attack: 0.003,
                release: 0.25
            }).toDestination(); // Glues everything together like a final master track

            reverb = new Tone.Reverb({
                decay: 4.5,
                wet: 0.35
            });
            await reverb.generate();
            reverb.connect(compressor);

            delay = new Tone.FeedbackDelay({
                delayTime: "4n.",
                feedback: 0.25,
                wet: 0.2
            }).connect(reverb);

            // --- 1. REAL PIANO SAMPLER (Replaces cheap synth beeps) ---
            // Loads actual recorded acoustic grand piano audio notes from CDN
            pianoSampler = new Tone.Sampler({
                urls: {
                    "C4": "C4.mp3",
                    "Dis4": "Ds4.mp3",
                    "F#4": "Fs4.mp3",
                    "A4": "A4.mp3",
                },
                baseUrl: "https://tonejs.github.io/audio/salamander/",
                onload: () => {
                    logStatus("Piano samples loaded! Starting beat transport...");
                    startTransport();
                }
            }).connect(delay);

            // --- 2. PUNCHY KICK & CRISP HI-HAT ---
            kickSynth = new Tone.MembraneSynth({
                pitchDecay: 0.02,
                octaves: 8,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.5, sustain: 0, release: 0.5 }
            }).connect(compressor);

            hihatSynth = new Tone.NoiseSynth({
                filter: { type: "highpass", frequency: 6000 },
                envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
            }).connect(reverb);
        }

        function startTransport() {
            // 4-on-the-floor professional house beat kick
            new Tone.Loop(time => {
                kickSynth.triggerAttackRelease("C1", "8n", time, 0.9);
            }, "4n").start(0);

            // Off-beat hi-hat groove
            new Tone.Loop(time => {
                hihatSynth.triggerAttackRelease("16n", time, 0.4);
            }, "8n").start("8n");

            // Ambient background chord progression played via piano sampler
            const chordLoop = new Tone.Loop(time => {
                pianoSampler.triggerAttackRelease(["C3", "G3", "C4"], "2m", time, 0.5);
            }, "2m").start(0);

            Tone.Transport.start();
            isEngineRunning = true;
            logStatus("Studio engine active! Move your right hand to play live piano melodies.");
        }

        // --- POSE TRACKING ---
        const pose = new Pose({ 
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` 
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.7 });
        
        pose.onResults(results => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && isEngineRunning && pianoSampler.loaded) {
                const landmarks = results.poseLandmarks;
                const rWrist = landmarks[16];
                
                // Map right hand height to piano notes
                const noteIndex = Math.floor((1.0 - rWrist.y) * leadScale.length);
                const clampedIdx = Math.max(0, Math.min(leadScale.length - 1, noteIndex));
                const activeNote = leadScale[clampedIdx];

                if (activeNote !== lastNotePlayed) {
                    pianoSampler.triggerAttackRelease(activeNote, "4n", Tone.now(), 0.8);
                    lastNotePlayed = activeNote;
                }
            }
            canvasCtx.restore();
        });

        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            await initStudioEngine();

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({ image: videoElement });
                },
                width: 800,
                height: 600
            });
            await camera.start();
        });
    </script>
</body>
</html>
