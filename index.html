<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quaternion Bio-Structure</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Import Three.js via ES Modules -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Geometry & Materials (Core vs Membrane)
        const atomGeometry = new THREE.SphereGeometry(0.12, 16, 16);
        const coreMaterial = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, metalness: 0.9 });
        const membraneMaterial = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.75 });

        const totalAtoms = 300;
        const instancedMesh = new THREE.InstancedMesh(atomGeometry, membraneMaterial, totalAtoms);
        scene.add(instancedMesh);

        // 3. Generate Spherical Lattice using Polar Quaternions
        const atomMetaData = [];
        const dummy = new THREE.Object3D();

        function getFibonacciPoint(i, total) {
            const phi = i * 2.39996;
            const y = 1 - (i / (total - 1)) * 2;
            const r = Math.sqrt(1 - y * y);
            return { x: Math.cos(phi) * r, y: y, z: Math.sin(phi) * r };
        }

        const theta = Math.PI * 0.35; // Polar angle parameter
        const baseRadius = 4.0;

        for (let i = 0; i < totalAtoms; i++) {
            const v = getFibonacciPoint(i, totalAtoms);

            // Polar Quaternion Formula: q = cos(theta) + sin(theta) * v
            const w = Math.cos(theta);
            const q = new THREE.Quaternion(v.x * Math.sin(theta), v.y * Math.sin(theta), v.z * Math.sin(theta), w);

            atomMetaData.push({
                basePos: new THREE.Vector3(v.x * baseRadius, v.y * baseRadius, v.z * baseRadius),
                quaternion: q,
                frequency: 2.0 + (i % 3) * 0.5,
                phase: i * 0.1
            });
        }

        // 4. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        camera.position.set(0, 0, 12);

        // 5. Animation Loop (Breathing Pulse)
        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;

            atomMetaData.forEach((atom, idx) => {
                // Biological rhythm pulse
                const pulse = Math.sin(t * atom.frequency + atom.phase) * 0.2;
                const currentPos = atom.basePos.clone().multiplyScalar(1 + (pulse * 0.15));

                dummy.position.copy(currentPos);
                dummy.quaternion.copy(atom.quaternion);
                
                const scale = 1 + (pulse * 0.1);
                dummy.scale.set(scale, scale, scale);

                dummy.updateMatrix();
                instancedMesh.setMatrixAt(idx, dummy.matrix);
            });

            instancedMesh.instanceMatrix.needsUpdate = true;

            // Rotate entire structure for 3D depth inspection
            instancedMesh.rotation.y = t * 0.15;
            instancedMesh.rotation.x = Math.sin(t * 0.08) * 0.2;

            renderer.render(scene, camera);
        }

        animate(0);

        // Handle Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
