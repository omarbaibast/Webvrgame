    <!-- Three.js Setup -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"

    <script type="module">
        import * as THREE from 'three';

        // --- 4D BLOCK MATERIALS ---
        const HYPER_MATERIALS = [
            { id: 1, name: 'Cyan Crystal', color: 0x06b6d4, emissive: 0x0891b2 },
            { id: 2, name: 'Hyper Gold', color: 0xeab308, emissive: 0xca8a04 },
            { id: 3, name: 'Cosmic Slate', color: 0x64748b, emissive: 0x334155 },
            { id: 4, name: 'Neon Magenta', color: 0xec4899, emissive: 0xbe185d },
            { id: 5, name: 'Plasma Green', color: 0x10b981, emissive: 0x059669 },
            { id: 6, name: 'Quantum Indigo', color: 0x6366f1, emissive: 0x4338ca }
        ];

        let selectedMaterialId = 1;

        // --- GLOBAL STATE ---
        const state = {
            focalR: 10.0,
            rotXW: 0.0,
            rotYW: 0.0,
            rotZW: 0.0,
            isLocked: false,
            blockCount: 0,
            fps: 60
        };

        // --- 4D VECTOR & TRANSFORM CALCULATIONS ---
        class Vector4D {
            constructor(x = 0, y = 0, z = 0, w = 0) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.w = w;
            }

            // Rotates point in 4D space across XW, YW, and ZW planes
            apply4DRotation(rxw, ryw, rzw) {
                let { x, y, z, w } = this;

                // XW Plane
                if (rxw !== 0) {
                    const c = Math.cos(rxw), s = Math.sin(rxw);
                    const nx = x * c - w * s;
                    const nw = x * s + w * c;
                    x = nx; w = nw;
                }
                // YW Plane
                if (ryw !== 0) {
                    const c = Math.cos(ryw), s = Math.sin(ryw);
                    const ny = y * c - w * s;
                    const nw = y * s + w * c;
                    y = ny; w = nw;
                }
                // ZW Plane
                if (rzw !== 0) {
                    const c = Math.cos(rzw), s = Math.sin(rzw);
                    const nz = z * c - w * s;
                    const nw = z * s + w * c;
                    z = nz; w = nw;
                }

                this.x = x; this.y = y; this.z = z; this.w = w;
                return this;
            }

            // 4D Stereographic Projection Formula:
            // P_3d = (x / (R - w), y / (R - w), z / (R - w)) * R
            projectStereographic(R) {
                const denominator = Math.max(0.1, R - this.w);
                const scale = R / denominator;
                return new THREE.Vector3(
                    this.x * scale,
                    this.y * scale,
                    this.z * scale
                );
            }
        }

        // --- THREE.JS SCENE SETUP ---
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);

        // Fixed Camera Setup at (0, 2, 8) looking at center target (0,0,0)
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);
        camera.lookAt(0, 0, 0);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight1.position.set(10, 20, 15);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xec4899, 0.8);
        dirLight2.position.set(-10, -10, -10);
        scene.add(dirLight2);

        // Placement Preview Wireframe Cube
        const previewGeo = new THREE.BoxGeometry(1.05, 1.05, 1.05);
        const previewMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
        const targetPreviewMesh = new THREE.Mesh(previewGeo, previewMat);
        targetPreviewMesh.visible = false;
        scene.add(targetPreviewMesh);

        // --- 4D VOXEL WORLD ENGINE ---
        class VoxelWorld4D {
            constructor() {
                this.grid = new Map();
                this.meshGroup = new THREE.Group();
                scene.add(this.meshGroup);
            }

            getKey(x, y, z, w) {
                return `${x},${y},${z},${w}`;
            }

            setBlock(x, y, z, w, materialId) {
                const key = this.getKey(x, y, z, w);
                if (materialId === 0) {
                    this.grid.delete(key);
                } else {
                    this.grid.set(key, { x, y, z, w, materialId });
                }
            }

            clear() {
                this.grid.clear();
                this.rebuildMesh();
            }

            // Initializes world with guaranteed visible platform & central structure
            initDefaultWorld() {
                this.grid.clear();

                // 1. Guaranteed 5x5 floor platform at Y = -2 directly in front of camera
                for (let x = -2; x <= 2; x++) {
                    for (let z = -2; z <= 2; z++) {
                        const matId = ((Math.abs(x) + Math.abs(z)) % 2 === 0) ? 3 : 1;
                        this.setBlock(x, -2, z, 0, matId);
                    }
                }

                // 2. Central 4D Tesseract Structure at Y = 0..1
                this.setBlock(0, 0, 0, 0, 2);  // Gold center
                this.setBlock(1, 0, 0, 0, 1);
                this.setBlock(-1, 0, 0, 0, 1);
                this.setBlock(0, 1, 0, 0, 4);
                this.setBlock(0, 0, 1, 0, 5);
                this.setBlock(0, 0, -1, 0, 5);
                
                // Hyper-dimension W slice blocks
                this.setBlock(0, 0, 0, 1, 6);
                this.setBlock(0, 0, 0, -1, 6);

                this.rebuildMesh();
            }

            rebuildMesh() {
                // Clear active meshes
                while (this.meshGroup.children.length > 0) {
                    const child = this.meshGroup.children.pop();
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                }

                state.blockCount = this.grid.size;
                document.getElementById('block-counter').innerText = state.blockCount;

                if (this.grid.size === 0) return;

                // Subdivided Box geometry template for stereographic vertex distortion
                const baseBoxGeo = new THREE.BoxGeometry(0.95, 0.95, 0.95, 3, 3, 3);

                this.grid.forEach((voxel) => {
                    const matDef = HYPER_MATERIALS.find(m => m.id === voxel.materialId) || HYPER_MATERIALS[0];

                    const geo = baseBoxGeo.clone();
                    const posAttr = geo.attributes.position;

                    // Project each vertex of the voxel box from 4D -> 3D stereographically
                    for (let i = 0; i < posAttr.count; i++) {
                        const vx = posAttr.getX(i) + voxel.x;
                        const vy = posAttr.getY(i) + voxel.y;
                        const vz = posAttr.getZ(i) + voxel.z;
                        const vw = voxel.w;

                        const v4 = new Vector4D(vx, vy, vz, vw);
                        v4.apply4DRotation(state.rotXW, state.rotYW, state.rotZW);
                        const p3 = v4.projectStereographic(state.focalR);

                        posAttr.setXYZ(i, p3.x, p3.y, p3.z);
                    }

                    geo.computeVertexNormals();

                    // W-depth slice dynamic hue shift
                    const wHueShift = voxel.w * 0.08;
                    const baseCol = new THREE.Color(matDef.color);
                    baseCol.offsetHSL(wHueShift, 0, 0);

                    const material = new THREE.MeshStandardMaterial({
                        color: baseCol,
                        emissive: new THREE.Color(matDef.emissive),
                        emissiveIntensity: 0.3,
                        roughness: 0.3,
                        metalness: 0.7,
                        side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(geo, material);
                    mesh.userData = { voxel };
                    this.meshGroup.add(mesh);
                });
            }
        }

        const world4D = new VoxelWorld4D();
        world4D.initDefaultWorld();

        // --- PLAYER & CAMERA CONTROLLER ---
        class PlayerController {
            constructor() {
                this.pos4D = new Vector4D(0, 2, 8, 0);
                this.pitch = -0.2;
                this.yaw = 0;
                this.keys = {};
            }

            update(dt) {
                const speed = 8.0;
                const moveVec = new THREE.Vector3();

                if (this.keys['KeyW']) moveVec.z -= 1;
                if (this.keys['KeyS']) moveVec.z += 1;
                if (this.keys['KeyA']) moveVec.x -= 1;
                if (this.keys['KeyD']) moveVec.x += 1;
                if (this.keys['KeyR']) moveVec.y += 1;
                if (this.keys['KeyF']) moveVec.y -= 1;

                moveVec.normalize();
                moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

                this.pos4D.x += moveVec.x * speed * dt;
                this.pos4D.y += moveVec.y * speed * dt;
                this.pos4D.z += moveVec.z * speed * dt;

                // 4D W-Axis Navigation (Q/E)
                if (this.keys['KeyQ']) this.pos4D.w -= speed * dt;
                if (this.keys['KeyE']) this.pos4D.w += speed * dt;

                // Sync Three.js Camera position via 4D stereographic mapping
                const projPos = this.pos4D.projectStereographic(state.focalR);
                camera.position.copy(projPos);

                const lookDir = new THREE.Vector3(
                    -Math.sin(this.yaw) * Math.cos(this.pitch),
                    Math.sin(this.pitch),
                    -Math.cos(this.yaw) * Math.cos(this.pitch)
                );
                camera.lookAt(projPos.clone().add(lookDir));

                // Update HUD Text
                document.getElementById('pos-display').innerText = 
                    `X:${this.pos4D.x.toFixed(1)} Y:${this.pos4D.y.toFixed(1)} Z:${this.pos4D.z.toFixed(1)} W:${this.pos4D.w.toFixed(1)}`;

                // Update Raycast Target Highlight Preview
                this.updateRaycastPreview();
            }

            updateRaycastPreview() {
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

                const intersects = raycaster.intersectObjects(world4D.meshGroup.children);
                if (intersects.length > 0) {
                    const hit = intersects[0];
                    targetPreviewMesh.position.copy(hit.object.position);
                    targetPreviewMesh.visible = true;
                } else {
                    targetPreviewMesh.visible = false;
                }
            }
        }

        const player = new PlayerController();

        // --- BLOCK INTERACTION ENGINE (PLACE / BREAK) ---
        function executeBlockAction(isBreak) {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(world4D.meshGroup.children);
            if (intersects.length > 0) {
                const hit = intersects[0];
                const targetVoxel = hit.object.userData.voxel;

                if (isBreak) {
                    // Remove targeted voxel
                    world4D.setBlock(targetVoxel.x, targetVoxel.y, targetVoxel.z, targetVoxel.w, 0);
                    world4D.rebuildMesh();
                } else {
                    // Place new block adjacent to targeted voxel face
                    const normal = hit.face.normal.clone();
                    const newX = targetVoxel.x + Math.round(normal.x);
                    const newY = targetVoxel.y + Math.round(normal.y);
                    const newZ = targetVoxel.z + Math.round(normal.z);
                    const newW = Math.round(player.pos4D.w);

                    world4D.setBlock(newX, newY, newZ, newW, selectedMaterialId);
                    world4D.rebuildMesh();
                }
            } else if (!isBreak) {
                // If aiming into empty space, place block 3 units in front of player
                const dir = new THREE.Vector3(
                    -Math.sin(player.yaw) * Math.cos(player.pitch),
                    Math.sin(player.pitch),
                    -Math.cos(player.yaw) * Math.cos(player.pitch)
                ).normalize();

                const spawnX = Math.round(player.pos4D.x + dir.x * 3);
                const spawnY = Math.round(player.pos4D.y + dir.y * 3);
                const spawnZ = Math.round(player.pos4D.z + dir.z * 3);
                const spawnW = Math.round(player.pos4D.w);

                world4D.setBlock(spawnX, spawnY, spawnZ, spawnW, selectedMaterialId);
                world4D.rebuildMesh();
            }
        }

        // --- INPUT & CONTROLS BINDING ---
        // Mouse Look & Pointer Lock
        canvas.addEventListener('click', () => {
            if (!state.isLocked) canvas.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            state.isLocked = (document.pointerLockElement === canvas);
        });

        window.addEventListener('mousemove', (e) => {
            if (!state.isLocked) return;
            const sensitivity = 0.0025;
            player.yaw -= e.movementX * sensitivity;
            player.pitch -= e.movementY * sensitivity;
            player.pitch = Math.max(-Math.PI / 2.05, Math.min(Math.PI / 2.05, player.pitch));
        });

        window.addEventListener('keydown', (e) => {
            player.keys[e.code] = true;
            if (e.code.startsWith('Digit')) {
                const num = parseInt(e.code.replace('Digit', ''));
                if (num >= 1 && num <= 6) selectMaterial(num);
            }
        });

        window.addEventListener('keyup', (e) => {
            player.keys[e.code] = false;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!state.isLocked) return;
            if (e.button === 0) executeBlockAction(true);  // Left Click: Break
            if (e.button === 2) executeBlockAction(false); // Right Click: Place
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- ON-SCREEN TOUCH & ACTION BUTTONS ---
        document.getElementById('btn-place').onclick = () => executeBlockAction(false);
        document.getElementById('btn-break').onclick = () => executeBlockAction(true);

        const bindTouchKey = (btnId, keyCode) => {
            const btn = document.getElementById(btnId);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); player.keys[keyCode] = true; });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); player.keys[keyCode] = false; });
            btn.addEventListener('pointerleave', () => { player.keys[keyCode] = false; });
        };

        bindTouchKey('btn-fwd', 'KeyW');
        bindTouchKey('btn-back', 'KeyS');
        bindTouchKey('btn-left', 'KeyA');
        bindTouchKey('btn-right', 'KeyD');
        bindTouchKey('btn-up-y', 'KeyR');
        bindTouchKey('btn-dn-y', 'KeyF');
        bindTouchKey('btn-w-up', 'KeyE');
        bindTouchKey('btn-w-dn', 'KeyQ');

        // --- HOTBAR GENERATION ---
        const hotbarContainer = document.getElementById('hotbar');
        HYPER_MATERIALS.forEach((mat, idx) => {
            const btn = document.createElement('button');
            btn.className = `hotbar-item w-9 h-9 rounded-xl flex flex-col items-center justify-center font-bold text-xs border border-slate-700 glass-panel ${idx === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = `#${mat.color.toString(16).padStart(6, '0')}44`;
            btn.innerHTML = `<span class="text-[10px] text-slate-300 font-mono">${idx + 1}</span>`;
            btn.onclick = () => selectMaterial(idx + 1);
            hotbarContainer.appendChild(btn);
        });

        function selectMaterial(slotIndex) {
            selectedMaterialId = slotIndex;
            const items = hotbarContainer.querySelectorAll('.hotbar-item');
            items.forEach((item, idx) => {
                if (idx === slotIndex - 1) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // --- PANEL CONTROL SLIDERS ---
        document.getElementById('slider-radius').addEventListener('input', (e) => {
            state.focalR = parseFloat(e.target.value);
            document.getElementById('radius-val').innerText = state.focalR.toFixed(1);
            world4D.rebuildMesh();
        });

        document.getElementById('slider-rot-xw').addEventListener('input', (e) => {
            state.rotXW = parseFloat(e.target.value);
            document.getElementById('xw-val').innerText = `${Math.round(state.rotXW * 57.3)}°`;
            world4D.rebuildMesh();
        });

        document.getElementById('slider-rot-yw').addEventListener('input', (e) => {
            state.rotYW = parseFloat(e.target.value);
            document.getElementById('yw-val').innerText = `${Math.round(state.rotYW * 57.3)}°`;
            world4D.rebuildMesh();
        });

        document.getElementById('slider-rot-zw').addEventListener('input', (e) => {
            state.rotZW = parseFloat(e.target.value);
            document.getElementById('zw-val').innerText = `${Math.round(state.rotZW * 57.3)}°`;
            world4D.rebuildMesh();
        });

        document.getElementById('preset-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'default') world4D.initDefaultWorld();
            else if (val === 'tesseract') {
                world4D.grid.clear();
                for (let x = -1; x <= 1; x++)
                    for (let y = -1; y <= 1; y++)
                        for (let z = -1; z <= 1; z++)
                            for (let w = -1; w <= 1; w++)
                                world4D.setBlock(x*2, y*2, z*2, w*2, ((Math.abs(w)+Math.abs(x))%6)+1);
                world4D.rebuildMesh();
            } else if (val === 'ring') {
                world4D.grid.clear();
                for (let a = 0; a < Math.PI * 2; a += 0.4) {
                    const x = Math.round(Math.cos(a) * 4);
                    const z = Math.round(Math.sin(a) * 4);
                    world4D.setBlock(x, 0, z, 0, 1);
                    world4D.setBlock(x, 0, z, 1, 4);
                }
                world4D.rebuildMesh();
            } else if (val === 'sphere') {
                world4D.grid.clear();
                for (let x = -2; x <= 2; x++)
                    for (let y = -2; y <= 2; y++)
                        for (let z = -2; z <= 2; z++)
                            for (let w = -2; w <= 2; w++)
                                if (x*x + y*y + z*z + w*w === 4)
                                    world4D.setBlock(x, y, z, w, 2);
                world4D.rebuildMesh();
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            player.pos4D = new Vector4D(0, 2, 8, 0);
            player.pitch = -0.2;
            player.yaw = 0;
            state.rotXW = state.rotYW = state.rotZW = 0;
            document.getElementById('slider-rot-xw').value = 0;
            document.getElementById('slider-rot-yw').value = 0;
            document.getElementById('slider-rot-zw').value = 0;
            document.getElementById('xw-val').innerText = '0°';
            document.getElementById('yw-val').innerText = '0°';
            document.getElementById('zw-val').innerText = '0°';
            world4D.rebuildMesh();
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            world4D.clear();
        });

        // Collapsible Panel Drawer
        const togglePanelBtn = document.getElementById('toggle-panel');
        const panelContent = document.getElementById('panel-content');
        const chevronIcon = document.getElementById('chevron-icon');
        let isPanelOpen = true;

        togglePanelBtn.addEventListener('click', () => {
            isPanelOpen = !isPanelOpen;
            panelContent.style.display = isPanelOpen ? 'block' : 'none';
            chevronIcon.style.transform = isPanelOpen ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        // --- ANIMATION & RENDER LOOP ---
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            frameCount++;
            fpsTimer += dt;
            if (fpsTimer >= 0.5) {
                state.fps = Math.round(frameCount / fpsTimer);
                document.getElementById('fps-counter').innerText = state.fps;
                frameCount = 0;
                fpsTimer = 0;
            }

            player.update(dt);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start main loop
        animate(performance.now());
    </script>
</body>
</html>
