
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Recorder and Audio Data</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: white;
  font-family: system-ui, sans-serif;
}
main { max-width: 800px; margin: auto; }
h1 { color: #8daaff; }
button {
  padding: 12px 16px;
  margin: 5px 3px 5px 0;
  border: 0;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}
#start { background: #8daaff; }
#stop { background: #ff7185; }
#status { color: #9fe8c8; margin: 15px 0; }
.panel {
  background: #1b2335;
  padding: 16px;
  border-radius: 12px;
  margin: 15px 0;
  overflow-wrap: anywhere;
}
canvas {
  width: 100%;
  height: 160px;
  background: #080d18;
  border-radius: 8px;
}
audio { width: 100%; margin-top: 15px; }
.stat { margin: 8px 0; }
small { color: #b9c4d9; }
</style>
</head>

<body>
<main>
<h1>Voice Lab</h1>
<p>Record your voice and extract numerical audio data.</p>

<div class="panel">
  <button id="start">🎙 Start recording</button>
  <button id="stop" disabled>■ Stop</button>
  <p id="status">Ready to record.</p>
  <div class="stat">Time: <b id="time">0.0 s</b></div>
  <div class="stat">Sample rate: <b id="rate">—</b></div>
  <div class="stat">RMS amplitude: <b id="rms">—</b></div>
  <div class="stat">Peak amplitude: <b id="peak">—</b></div>
  <div class="stat">Dominant frequency: <b id="freq">—</b></div>
  <div class="stat">Data samples: <b id="count">0</b></div>
  <audio id="player" controls hidden></audio>
</div>

<div class="panel">
  <h3>Waveform</h3>
  <canvas id="wave" width="800" height="200"></canvas>
</div>

<div class="panel">
  <h3>Frequency spectrum</h3>
  <canvas id="spectrum" width="800" height="200"></canvas>
</div>

<div class="panel">
  <h3>Export your data</h3>
  <button id="downloadAudio" disabled>Download audio</button>
  <button id="downloadCSV" disabled>Download CSV data</button>
  <button id="downloadJSON" disabled>Download JSON data</button>
  <p><small>Audio is processed in your browser. It is not uploaded to a server.</small></p>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

let stream = null;
let audioContext = null;
let analyser = null;
let recorder = null;
let chunks = [];
let data = [];
let audioBlob = null;
let audioURL = null;
let running = false;
let startTime = 0;
let lastSample = 0;
let animation = null;
let mime = "audio/webm";

const waveCanvas = $("wave");
const spectrumCanvas = $("spectrum");
const waveCtx = waveCanvas.getContext("2d");
const specCtx = spectrumCanvas.getContext("2d");

function status(message) {
  $("status").textContent = message;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function clearGraph(ctx, canvas) {
  ctx.fillStyle = "#080d18";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawWave(samples) {
  clearGraph(waveCtx, waveCanvas);
  const middle = waveCanvas.height / 2;

  waveCtx.strokeStyle = "#8daaff";
  waveCtx.lineWidth = 2;
  waveCtx.beginPath();

  for (let x = 0; x < waveCanvas.width; x++) {
    const i = Math.floor(
      x * samples.length / waveCanvas.width
    );
    const y = middle + samples[i] * middle * 0.9;

    if (x === 0) waveCtx.moveTo(x, y);
    else waveCtx.lineTo(x, y);
  }

  waveCtx.stroke();
}

function drawSpectrum(samples) {
  clearGraph(specCtx, spectrumCanvas);

  const bars = 100;
  const width = spectrumCanvas.width / bars;
  const height = spectrumCanvas.height;

  for (let b = 0; b < bars; b++) {
    const from = Math.floor(b * samples.length / bars);
    const to = Math.floor((b + 1) * samples.length / bars);
    let maximum = 0;

    for (let i = from; i < to; i++) {
      maximum = Math.max(maximum, samples[i]);
    }

    const barHeight = maximum / 255 * height;

    specCtx.fillStyle = "#63dfb1";
    specCtx.fillRect(
      b * width,
      height - barHeight,
      Math.max(1, width - 1),
      barHeight
    );
  }
}

function analyze() {
  if (!analyser || !audioContext) return;

  const waveform = new Float32Array(analyser.fftSize);
  const frequencies = new Uint8Array(
    analyser.frequencyBinCount
  );

  analyser.getFloatTimeDomainData(waveform);
  analyser.getByteFrequencyData(frequencies);

  let sumSquares = 0;
  let peak = 0;

  for (const sample of waveform) {
    sumSquares += sample * sample;
    peak = Math.max(peak, Math.abs(sample));
  }

  const rms = Math.sqrt(sumSquares / waveform.length);

  let maxIndex = 0;
  let maxValue = 0;

  for (let i = 1; i < frequencies.length; i++) {
    if (frequencies[i] > maxValue) {
      maxValue = frequencies[i];
      maxIndex = i;
    }
  }

  const dominantFrequency =
    maxIndex * audioContext.sampleRate / analyser.fftSize;

  $("rms").textContent = rms.toFixed(5);
  $("peak").textContent = peak.toFixed(5);
  $("freq").textContent =
    maxValue > 0 ? Math.round(dominantFrequency) + " Hz" : "—";
  $("rate").textContent =
    audioContext.sampleRate.toLocaleString() + " Hz";

  drawWave(waveform);
  drawSpectrum(frequencies);

  const elapsed = (performance.now() - startTime) / 1000;
  $("time").textContent = elapsed.toFixed(1) + " s";

  if (running && elapsed - lastSample >= 0.1) {
    lastSample = elapsed;

    // Save a compact snapshot of the waveform.
    const snapshot = [];
    const step = Math.max(1, Math.floor(waveform.length / 64));

    for (let i = 0; i < waveform.length; i += step) {
      snapshot.push(Number(waveform[i].toFixed(4)));
    }

    data.push({
      time_s: Number(elapsed.toFixed(3)),
      rms: Number(rms.toFixed(6)),
      peak: Number(peak.toFixed(6)),
      dominant_frequency_hz:
        Number(dominantFrequency.toFixed(2)),
      waveform: snapshot
    });

    $("count").textContent = data.length;
  }

  if (running) {
    animation = requestAnimationFrame(analyze);
  }
}

async function startRecording() {
  if (running) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    status(
      "Microphone unavailable. Open this page on HTTPS " +
      "using a modern browser."
    );
    return;
  }

  if (!window.MediaRecorder) {
    status("This browser does not support audio recording.");
    return;
  }

  $("start").disabled = true;
  status("Requesting microphone permission...");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    audioContext = new AudioContextClass();
    await audioContext.resume();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.5;

    const source =
      audioContext.createMediaStreamSource(stream);

    source.connect(analyser);

    const types = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/mp4"
    ];

    mime = types.find(
      type => MediaRecorder.isTypeSupported(type)
    ) || "";

    recorder = mime
      ? new MediaRecorder(stream, { mimeType: mime })
      : new MediaRecorder(stream);

    mime = recorder.mimeType || mime || "audio/webm";

    chunks = [];
    data = [];
    lastSample = 0;

    $("count").textContent = "0";
    $("downloadAudio").disabled = true;
    $("downloadCSV").disabled = true;
    $("downloadJSON").disabled = true;

    if (audioURL) {
      URL.revokeObjectURL(audioURL);
      audioURL = null;
    }

    $("player").hidden = true;
    $("player").removeAttribute("src");

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        chunks.push(event.data);
      }
    };

    recorder.onerror = () => {
      status("The browser encountered a recording error.");
    };

    recorder.onstop = () => {
      audioBlob = new Blob(chunks, { type: mime });
      audioURL = URL.createObjectURL(audioBlob);

      $("player").src = audioURL;
      $("player").hidden = false;

      $("downloadAudio").disabled = false;
      $("downloadCSV").disabled = data.length === 0;
      $("downloadJSON").disabled = data.length === 0;

      status(
        "Recording complete. " + data.length +
        " measurement samples collected."
      );
    };

    startTime = performance.now();
    running = true;

    recorder.start(250);

    $("stop").disabled = false;
    status("Recording... Speak into your microphone.");

    cancelAnimationFrame(animation);
    analyze();

  } catch (error) {
    running = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    $("start").disabled = false;
    $("stop").disabled = true;

    const messages = {
      NotAllowedError:
        "Microphone permission denied. Allow microphone access " +
        "in your browser settings.",
      NotFoundError:
        "No microphone was found on this device.",
      NotReadableError:
        "The microphone is busy or cannot be accessed."
    };

    status(messages[error.name] ||
      "Recording failed: " + error.message);
  }
}

function stopRecording() {
  if (!running) return;

  running = false;
  cancelAnimationFrame(animation);

  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  $("stop").disabled = true;
  $("start").disabled = false;
}

function exportCSV() {
  if (!data.length) return;

  const headers = [
    "time_s",
    "rms",
    "peak",
    "dominant_frequency_hz",
    "waveform"
  ];

  const rows = data.map(item =>
    headers.map(key => {
      let value = key === "waveform"
        ? item.waveform.join(" ")
        : item[key];

      value = String(value);

      return /[",\n]/.test(value)
        ? '"' + value.replace(/"/g, '""') + '"'
        : value;
    }).join(",")
  );

  downloadBlob(
    new Blob(
      [headers.join(",") + "\r\n" + rows.join("\r\n")],
      { type: "text/csv;charset=utf-8" }
    ),
    "voice-data.csv"
  );
}

$("start").addEventListener("click", startRecording);
$("stop").addEventListener("click", stopRecording);

$("downloadAudio").addEventListener("click", () => {
  if (!audioBlob) return;

  const extension = mime.includes("ogg")
    ? "ogg"
    : mime.includes("mp4")
      ? "m4a"
      : "webm";

  downloadBlob(audioBlob, "voice-recording." + extension);
});

$("downloadCSV").addEventListener("click", exportCSV);

$("downloadJSON").addEventListener("click", () => {
  downloadBlob(
    new Blob(
      [JSON.stringify({
        sample_rate_hz: audioContext?.sampleRate || null,
        measurements: data
      }, null, 2)],
      { type: "application/json" }
    ),
    "voice-data.json"
  );
});

clearGraph(waveCtx, waveCanvas);
clearGraph(specCtx, spectrumCanvas);
</script>
</body>
</html>
