<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Three.js Mobile VR + PS4 Starter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #0b0e14; font-family: system-ui, sans-serif; color: #e6edf3; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(11, 14, 20, 0.78); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.5;
      pointer-events: none; max-width: 320px;
    }
    #controls {
      position: fixed; bottom: 16px; left: 16px; z-index: 10;
      display: flex; gap: 8px;
    }
    button.ui-btn {
      background: #1f6feb; color: #fff; border: none; border-radius: 6px;
      padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.ui-btn:active { opacity: 0.85; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div><strong>Pad:</strong> <span id="pad-status">Press any PS4 button...</span></div>
    <div><strong>Mode:</strong> <span id="view-mode">Mono (WebXR / Stereo ready)</span></div>
    <div><strong>Debug:</strong> <span id="pad-debug">LX: 0.00 LY: 0.00 | RX: 0.00 RY: 0.00</span></div>
  </div>

  <div id="controls">
    <button id="stereo-toggle" class="ui-btn" type="button">Toggle Stereo SBS</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { StereoEffect } from 'three/addons/effects/StereoEffect.js';

    // --- 1. Scene, Rig & Camera ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.035);

    // Move the player rig, not the raw camera, so XR/stereo offsets stay clean
    const playerRig = new THREE.Group();
    playerRig.position.set(0, 1.6, 5);
    scene.add(playerRig);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    playerRig.add(camera);

    // --- 2. Renderer, WebXR & Stereo Fallback ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(VRButton.createButton(renderer));

    const stereoEffect = new StereoEffect(renderer);
    stereoEffect.setSize(window.innerWidth, window.innerHeight);
    let stereoEnabled = false;

    const viewModeEl = document.getElementById('view-mode');
    const stereoBtn = document.getElementById('stereo-toggle');
    stereoBtn.addEventListener('click', () => {
      stereoEnabled = !stereoEnabled;
      viewModeEl.textContent = stereoEnabled ? 'Side-by-Side Stereo' : 'Mono';
      if (stereoEnabled) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      } else {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
      renderer.setSize(window.innerWidth, window.innerHeight);
      stereoEffect.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 3. Minimal Reference World ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(6, 10, 6);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(40, 40, 0x388bfd, 0x1e2636);
    scene.add(grid);

    const targetCube = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x58a6ff, roughness: 0.4 })
    );
    targetCube.position.set(0, 1.2, 0);
    scene.add(targetCube);

    // --- 4. PS4 DualShock 4 Gamepad Poller ---
    const padStatusEl = document.getElementById('pad-status');
    const padDebugEl = document.getElementById('pad-debug');

    const padState = {
      connected: false,
      axes: { lx: 0, ly: 0, rx: 0, ry: 0 },
      buttons: new Map(),      // index -> boolean (held)
      prevButtons: new Map()   // index -> boolean (previous frame)
    };

    function applyDeadzone(value, deadzone = 0.14) {
      if (Math.abs(value) < deadzone) return 0;
      const sign = Math.sign(value);
      return sign * ((Math.abs(value) - deadzone) / (1 - deadzone));
    }

    function pollGamepad() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      let activePad = null;

      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i] && gamepads[i].connected) {
          activePad = gamepads[i];
          break;
        }
      }

      if (!activePad) {
        padState.connected = false;
        padStatusEl.textContent = 'Disconnected (press any button)';
        return;
      }

      padState.connected = true;
      padStatusEl.textContent = activePad.id.slice(0, 36);

      // Standard mapping: axes[0..1] = Left Stick, axes[2..3] = Right Stick
      padState.axes.lx = applyDeadzone(activePad.axes[0] ?? 0);
      padState.axes.ly = applyDeadzone(activePad.axes[1] ?? 0);
      padState.axes.rx = applyDeadzone(activePad.axes[2] ?? 0);
      padState.axes.ry = applyDeadzone(activePad.axes[3] ?? 0);

      padState.prevButtons = new Map(padState.buttons);
      for (let b = 0; b < activePad.buttons.length; b++) {
        const btn = activePad.buttons[b];
        const pressed = Boolean(btn && (btn.pressed || btn.value > 0.5));
        padState.buttons.set(b, pressed);
      }

      padDebugEl.textContent =
        `LX:${padState.axes.lx.toFixed(2)} LY:${padState.axes.ly.toFixed(2)} | ` +
        `RX:${padState.axes.rx.toFixed(2)} RY:${padState.axes.ry.toFixed(2)}`;
    }

    function isJustPressed(buttonIndex) {
      return Boolean(padState.buttons.get(buttonIndex)) && !Boolean(padState.prevButtons.get(buttonIndex));
    }

    window.addEventListener('gamepadconnected', (e) => {
      padStatusEl.textContent = `Connected: ${e.gamepad.id.slice(0, 32)}`;
    });

    window.addEventListener('gamepaddisconnected', () => {
      padStatusEl.textContent = 'Disconnected';
    });

    // --- 5. Locomotion & Frame Loop (Pre-allocated Scratch Vectors) ---
    const forwardVec = new THREE.Vector3();
    const rightVec = new THREE.Vector3();
    const moveDir = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    const moveSpeed = 4.0;   // meters/sec
    const turnSpeed = 2.0;   // radians/sec
    let lastTime = performance.now();

    function updatePlayer(dt) {
      if (!padState.connected) return;

      // Right stick X rotates rig horizontally (snap or smooth turn)
      if (Math.abs(padState.axes.rx) > 0) {
        playerRig.rotation.y -= padState.axes.rx * turnSpeed * dt;
      }

      // Project camera forward direction onto XZ plane for natural look-relative movement
      camera.getWorldDirection(forwardVec);
      forwardVec.y = 0;
      if (forwardVec.lengthSq() > 1e-6) {
        forwardVec.normalize();
      }
      rightVec.crossVectors(forwardVec, upAxis).normalize();

      // Left stick: LY negative is forward (-Z / forwardVec), LX positive is right
      moveDir.set(0, 0, 0);
      moveDir.addScaledVector(forwardVec, -padState.axes.ly);
      moveDir.addScaledVector(rightVec, padState.axes.lx);
      if (moveDir.lengthSq() > 1) moveDir.normalize();

      playerRig.position.addScaledVector(moveDir, moveSpeed * dt);

      // Example edge-triggered action: Cross (button 0 on standard mapping) resets rig position
      if (isJustPressed(0)) {
        playerRig.position.set(0, 1.6, 5);
        playerRig.rotation.y = 0;
        targetCube.material.color.setHex(Math.random() * 0xffffff);
      }
    }

    renderer.setAnimationLoop((now) => {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      pollGamepad();
      updatePlayer(dt);

      targetCube.rotation.y += 0.8 * dt;
      targetCube.rotation.x += 0.4 * dt;

      // WebXR manages its own stereo camera pair when a session is active
      if (renderer.xr.isPresenting) {
        renderer.render(scene, camera);
      } else if (stereoEnabled) {
        stereoEffect.render(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    });

    // --- 6. Resize Handling ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      stereoEffect.setSize(w, h);
    });
  </script>
</body>
</html>
