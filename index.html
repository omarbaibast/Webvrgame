<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Stereographic Projection</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';

  // 1. Scene & Renderer Setup
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  camera.position.z = 1;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 2. Stereographic Vertex & Fragment Shaders
  const stereographicShader = {
    uniforms: {
      uTime: { value: 0 },
      uFOV: { value: 2.0 } // Controls projection scale / field of view
    },
    vertexShader: `
      uniform float uTime;
      uniform float uFOV;
      varying vec3 vColor;

      void main() {
        // Simple rotation of the object in world space
        float c = cos(uTime);
        float s = sin(uTime);
        mat3 rotY = mat3(
          c, 0.0, s,
          0.0, 1.0, 0.0,
         -s, 0.0, c
        );
        
        // Translate world position slightly forward along Z
        vec3 worldPos = rotY * position + vec3(0.0, 0.0, 3.0);
        
        // --- Stereographic Projection Formula ---
        // Normalize vector to get point on unit sphere
        vec3 p = normalize(worldPos);
        
        // Project onto 2D plane: X = x / (1 + z), Y = y / (1 + z)
        vec2 stereoPos = p.xy / (1.0 + p.z) * uFOV;

        vColor = color;
        gl_Position = vec4(stereoPos, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        gl_FragColor = vec4(vColor, 1.0);
      }
    `
  };

  // 3. Create High-Subdivision Geometry
  // Non-linear projection requires dense vertices so straight edges curve smoothly
  const geometry = new THREE.IcosahedronGeometry(1.5, 5);
  
  // Assign vertex colors for visualization
  const colors = [];
  const posAttr = geometry.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    colors.push(
      Math.abs(posAttr.getX(i)),
      Math.abs(posAttr.getY(i)),
      Math.abs(posAttr.getZ(i))
    );
  }
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const material = new THREE.ShaderMaterial({
    vertexShader: stereographicShader.vertexShader,
    fragmentShader: stereographicShader.fragmentShader,
    uniforms: stereographicShader.uniforms,
    wireframe: true,
    vertexColors: true
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // 4. Animation Loop
  function animate(time) {
    requestAnimationFrame(animate);
    material.uniforms.uTime.value = time * 0.001;
    renderer.render(scene, camera);
  }
  animate(0);

  // Handle Window Resize
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
