<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C60 Buckminsterfullerene - Quaternion Molecule</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010104; font-family: monospace; }
        #info {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: #38bdf8; font-size: 16px; pointer-events: none;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); z-index: 10;
        }
        #error-log { color: #ff4444; position: absolute; top: 50px; left: 20px; z-index: 100; font-size: 14px; }
    </style>
</head>
<body>
    <div id="info">C₆₀ Buckminsterfullerene (Buckyball) — Quaternion Lattice</div>
    <div id="error-log"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('error-log').innerText = "Error: " + msg + " (Line: " + line + ")";
            return true;
        };

        try {
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010104, 0.05);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // --- 1. MATHEMATICAL GENERATION OF C60 VERTICES ---
            const phi = (1 + Math.sqrt(5)) / 2;
            const carbonVertices = [];

            function addCyclicPerms(x, y, z) {
                const coords = [[x, y, z], [z, x, y], [y, z, x]];
                coords.forEach(c => {
                    for (let sx of [-1, 1]) {
                        for (let sy of [-1, 1]) {
                            for (let sz of [-1, 1]) {
                                const v = new THREE.Vector3(c[0]*sx, c[1]*sy, c[2]*sz);
                                if (!carbonVertices.some(existing => existing.distanceTo(v) < 0.01)) {
                                    carbonVertices.push(v);
                                }
                            }
                        }
                    }
                });
            }

            addCyclicPerms(0, 1, 3 * phi);
            addCyclicPerms(1, 2 + phi, 2 * phi);
            addCyclicPerms(phi, 2, 2 + phi);

            carbonVertices.forEach(v => v.multiplyScalar(0.55));

            // --- 2. DETECT COVALENT BONDS ---
            const bonds = [];
            for (let i = 0; i < carbonVertices.length; i++) {
                for (let j = i + 1; j < carbonVertices.length; j++) {
                    const dist = carbonVertices[i].distanceTo(carbonVertices[j]);
                    if (dist >= 0.8 && dist <= 1.3) {
                        bonds.push({ start: carbonVertices[i], end: carbonVertices[j] });
                    }
                }
            }

            // --- 3. MESHES ---
            const atomGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const atomMat = new THREE.MeshPhysicalMaterial({
                color: 0x06b6d4,
                roughness: 0.1,
                metalness: 0.1,
                transmission: 0.85,
                thickness: 0.5,
                clearcoat: 1.0,
                iridescence: 0.9,
                emissive: 0x0284c7,
                emissiveIntensity: 0.4
            });

            const atomMesh = new THREE.InstancedMesh(atomGeo, atomMat, carbonVertices.length);

            const bondGeo = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);
            const bondMat = new THREE.MeshStandardMaterial({
                color: 0x94a3b8,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x1e293b,
                emissiveIntensity: 0.3
            });
            const bondMesh = new THREE.InstancedMesh(bondGeo, bondMat, bonds.length);

            const masterGroup = new THREE.Group();
            masterGroup.add(atomMesh);
            masterGroup.add(bondMesh);
            scene.add(masterGroup);

            // --- 4. INITIALIZE DATA & QUATERNIONS ---
            const atomData = [];
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();

            carbonVertices.forEach((pos, idx) => {
                const theta = Math.PI * 0.25;
                const q = new THREE.Quaternion(
                    pos.x * Math.sin(theta),
                    pos.y * Math.sin(theta),
                    pos.z * Math.sin(theta
