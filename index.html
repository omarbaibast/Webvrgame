<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js VR Rotating Cube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #11131a;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // 1. Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161925);

    // Eye height (~1.6m) is helpful when testing in VR
    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 1.6, 3);

    // 2. Renderer & WebXR setup
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Add the official VR button to the page
    document.body.appendChild(VRButton.createButton(renderer));

    // 3. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
    directionalLight.position.set(3, 5, 4);
    scene.add(directionalLight);

    // 4. Floor grid for spatial reference in VR
    const gridHelper = new THREE.GridHelper(12, 24, 0x4f6bed, 0x2a2f45);
    scene.add(gridHelper);

    // 5. Rotating Cube positioned comfortably at eye level in front of the user
    const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const material = new THREE.MeshStandardMaterial({
      color: 0x5c7cfa,
      roughness: 0.3,
      metalness: 0.2,
    });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(0, 1.6, -2);
    scene.add(cube);

    // Optional wireframe edge highlight
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(
      edges,
      new THREE.LineBasicMaterial({ color: 0xa5b8ff })
    );
    cube.add(line);

    // 6. Handle window resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Render loop (use setAnimationLoop instead of requestAnimationFrame for WebXR)
    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      cube.rotation.x += delta * 0.9;
      cube.rotation.y += delta * 1.2;

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
