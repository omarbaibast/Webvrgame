<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Dance Song Producer - Debug Version</title>
    <style>
        body { margin: 0; background: #0a0a0c; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #container { position: relative; width: 800px; height: 600px; border-radius: 16px; overflow: hidden; border: 2px solid #27272a; background: #000; }
        video, canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
        #ui { margin-top: 15px; text-align: center; }
        button { padding: 14px 32px; background: #ec4899; color: white; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4); }
        #info { margin-top: 10px; color: #a1a1aa; font-family: monospace; font-size: 14px; max-width: 800px; word-break: break-all; }
    </style>

    <!-- Tone.js, MediaPipe & Camera Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="webcam" playsinline></video>
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>
    <div id="ui">
        <button id="btn">Click to Start Engine & Camera</button>
        <div id="info">Status: Waiting for user click...</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const btn = document.getElementById('btn');
        const infoEl = document.getElementById('info');

        let isEngineRunning = false;
        let kick, hihat, pianoChordSynth, leadSynth, reverb, delay;
        let lastNotePlayed = "";
        const leadScale = ["A4", "C5", "D5", "E5", "G5", "A5"];

        function logStatus(msg, isError = false) {
            console.log(msg);
            infoEl.style.color = isError ? "#f87171" : "#a1a1aa";
            infoEl.innerText = msg;
        }

        async function initMusicEngine() {
            try {
                logStatus("Starting Tone.js context...");
                await Tone.start();
                Tone.Transport.bpm.value = 120;

                logStatus("Generating Reverb impulse response...");
                reverb = new Tone.Reverb({ decay: 3, wet: 0.4 }).toDestination();
                await reverb.generate();

                delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.3, wet: 0.2 }).connect(reverb);

                kick = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 6,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.4 }
                }).toDestination();

                hihat = new Tone.NoiseSynth({
                    filter: { type: "highpass", frequency: 5000 },
                    envelope: { attack: 0.001, decay: 0.08, sustain: 0 }
                }).connect(reverb);

                pianoChordSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 1.5, sustain: 0.2, release: 1.5 }
                }).connect(reverb);

                const chordProgression = [
                    ["A3", "C4", "E4"], ["F3", "A3", "C4"],
                    ["C3", "E3", "G3"], ["G3", "B3", "D4"]
                ];
                let chordStep = 0;

                leadSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 }
                }).connect(delay);

                new Tone.Loop(time => { kick.triggerAttackRelease("C1", "4n", time); }, "4n").start(0);
                new Tone.Loop(time => { hihat.triggerAttackRelease("16n", time); }, "8n").start("8n");
                new Tone.Loop(time => {
                    pianoChordSynth.triggerAttackRelease(chordProgression[chordStep], "1m", time);
                    chordStep = (chordStep + 1) % chordProgression.length;
                }, "1m").start(0);

                Tone.Transport.start();
                isEngineRunning = true;
                logStatus("Audio engine running successfully!");
            } catch (err) {
                logStatus("Audio Error: " + err.message, true);
                console.error(err);
            }
        }

        const pose = new Pose({ 
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` 
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.7 });
        
        pose.onResults(results => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && isEngineRunning) {
                const landmarks = results.poseLandmarks;
                const rWrist = landmarks[16];
                const noteIndex = Math.floor((1.0 - rWrist.y) * leadScale.length);
                const clampedIdx = Math.max(0, Math.min(leadScale.length - 1, noteIndex));
                const activeNote = leadScale[clampedIdx];

                if (activeNote !== lastNotePlayed) {
                    leadSynth.triggerAttackRelease(activeNote, "8n");
                    lastNotePlayed = activeNote;
                }
            }
            canvasCtx.restore();
        });

        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            logStatus("Initializing audio and requesting camera permission...");
            
            await initMusicEngine();

            try {
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await pose.send({ image: videoElement });
                    },
                    width: 800,
                    height: 600
                });
                await camera.start();
                logStatus("Camera active! Step back and move your right hand.");
            } catch (err) {
                logStatus("Camera Error: " + err.message + ". Make sure you allowed webcam access and are running via a local server (http://localhost).", true);
                console.error(err);
            }
        });
    </script>
</body>
</html>
