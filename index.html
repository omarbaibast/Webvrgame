
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QSSE-1 | Quaternion Space Encryption</title>
<style>
body {
  font: 16px system-ui, sans-serif;
  max-width: 850px;
  margin: auto;
  padding: 18px;
  background: #101522;
  color: #edf2ff;
}
h1 { color: #86d8ff; }
textarea, input, button {
  box-sizing: border-box;
  width: 100%;
  margin: 7px 0 14px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #52627c;
  font: inherit;
}
textarea, input {
  background: #1c2639;
  color: white;
}
textarea { min-height: 100px; }
button {
  background: #2269a8;
  color: white;
  font-weight: bold;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #1c2639;
  padding: 12px;
  border-radius: 8px;
}
.panel {
  border: 1px solid #52627c;
  border-radius: 12px;
  padding: 15px;
  margin: 15px 0;
}
small { color: #b6c7df; }
</style>
</head>
<body>

<h1>QSSE-1</h1>
<p>Quaternion Space-to-Space Encryption</p>

<div class="panel">
  <h2>1. Message and secret</h2>
  <label>Message</label>
  <textarea id="message">Hello from quaternion space!</textarea>

  <label>Secret password</label>
  <input id="password" type="password"
         autocomplete="new-password"
         placeholder="Enter a strong password">

  <button id="encrypt">Transform and encrypt</button>
  <button id="decrypt">Decrypt and reconstruct</button>
</div>

<div class="panel">
  <h2>2. Encrypted package</h2>
  <textarea id="package" placeholder="Ciphertext package appears here. Paste a package here to decrypt it."></textarea>
  <button id="copy">Copy package</button>
</div>

<div class="panel">
  <h2>3. Quaternion-space observation</h2>
  <p><small>Example blocks before and after spatial transformation:</small></p>
  <pre id="visual">Waiting for encryption...</pre>
</div>

<div class="panel">
  <h2>4. Recovered message</h2>
  <pre id="result">Nothing decrypted yet.</pre>
</div>

<div class="panel">
  <h2>Status</h2>
  <pre id="status">Ready.</pre>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const encoder = new TextEncoder();
const decoder = new TextDecoder("utf-8", {fatal:true});

function say(message) {
  $("status").textContent = message;
}

function b64(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
}

function unb64(text) {
  const s = atob(text);
  return Uint8Array.from(s, c => c.charCodeAt(0));
}

function concat(...arrays) {
  const out = new Uint8Array(
    arrays.reduce((n, a) => n + a.length, 0)
  );
  let offset = 0;
  for (const a of arrays) {
    out.set(a, offset);
    offset += a.length;
  }
  return out;
}

function randomBytes(n) {
  return crypto.getRandomValues(new Uint8Array(n));
}

// Quaternion represented as [w, x, y, z].
function mul(a, b) {
  const [w,x,y,z] = a;
  const [v,i,j,k] = b;
  return [
    w*v - x*i - y*j - z*k,
    w*i + x*v + y*k - z*j,
    w*j - x*k + y*v + z*i,
    w*k + x*j - y*i + z*v
  ];
}

function conjugate(q) {
  return [q[0], -q[1], -q[2], -q[3]];
}

// Derive a reproducible unit quaternion from the password.
// This is a spatial encoding key, NOT a replacement for AES.
async function rotationFor(password) {
  const bytes = encoder.encode(
    "QSSE-1 spatial encoding|" + password
  );
  const digest = new Uint8Array(
    await crypto.subtle.digest("SHA-256", bytes)
  );

  const view = new DataView(
    digest.buffer, digest.byteOffset, digest.byteLength
  );

  const q = [];
  for (let i = 0; i < 4; i++) {
    q.push(view.getUint32(i * 4, false) / 2147483648 - 1);
  }

  const norm = Math.hypot(...q);
  if (norm < 1e-12) throw Error("Invalid rotation key.");
  return q.map(x => x / norm);
}

// Each four input bytes become one quaternion.
// Zero padding is removed using the stored original length.
function spatialEncode(bytes, r) {
  const blocks = Math.ceil(bytes.length / 4);
  const output = new ArrayBuffer(blocks * 32);
  const view = new DataView(output);
  const samples = [];

  for (let b = 0; b < blocks; b++) {
    const offset = b * 4;
    const q = [0, 0, 0, 0];

    for (let j = 0; j < 4; j++) {
      q[j] = offset + j < bytes.length
        ? bytes[offset + j] : 0;
    }

    const transformed = mul(mul(r, q), conjugate(r));

    for (let j = 0; j < 4; j++) {
      view.setFloat64(b * 32 + j * 8,
                      transformed[j], true);
    }

    if (b < 3) {
      samples.push({
        input: q.map(v => v.toFixed(3)),
        output: transformed.map(v => v.toFixed(3))
      });
    }
  }

  return {
    bytes: new Uint8Array(output),
    samples
  };
}

function spatialDecode(bytes, originalLength, r) {
  if (bytes.length % 32 !== 0) {
    throw Error("Invalid spatial data length.");
  }

  const blocks = bytes.length / 32;
  if (originalLength > blocks * 4 ||
      originalLength <= Math.max(0, (blocks - 1) * 4)) {
    if (!(originalLength === 0 && blocks === 0)) {
      throw Error("Invalid original length.");
    }
  }

  const view = new DataView(
    bytes.buffer, bytes.byteOffset, bytes.byteLength
  );
  const output = new Uint8Array(originalLength);
  const inverse = conjugate(r);

  for (let b = 0; b < blocks; b++) {
    const transformed = [];

    for (let j = 0; j < 4; j++) {
      const value = view.getFloat64(b * 32 + j * 8, true);
      if (!Number.isFinite(value) || Math.abs(value) > 1000) {
        throw Error("Invalid quaternion component.");
      }
      transformed.push(value);
    }

    const original = mul(
      mul(inverse, transformed), r
    );

    for (let j = 0; j < 4; j++) {
      const index = b * 4 + j;
      if (index < originalLength) {
        const rounded = Math.round(original[j]);
        if (Math.abs(original[j] - rounded) > 1e-6 ||
            rounded < 0 || rounded > 255) {
          throw Error("Spatial reconstruction failed.");
        }
        output[index] = rounded;
      }
    }
  }

  return output;
}

async function deriveAESKey(password, salt) {
  const material = await crypto.subtle.importKey(
    "raw", encoder.encode(password),
    "PBKDF2", false, ["deriveKey"]
  );

  return crypto.subtle.deriveKey({
    name: "PBKDF2",
    salt,
    iterations: 310000,
    hash: "SHA-256"
  }, material, {
    name: "AES-GCM",
    length: 256
  }, false, ["encrypt", "decrypt"]);
}

function showSamples(samples) {
  $("visual").textContent = samples.length
    ? samples.map((s, i) =>
        "Block " + i +
        "\nOriginal quaternion: [" + s.input.join(", ") + "]" +
        "\nRotated quaternion:  [" + s.output.join(", ") + "]"
      ).join("\n\n")
    : "Empty message: no quaternion blocks.";
}

$("encrypt").addEventListener("click", async () => {
  try {
    if (!crypto.subtle) {
      throw Error("Web Crypto unavailable. Use HTTPS or localhost.");
    }

    const password = $("password").value;
    if (password.length < 12) {
      throw Error("Use a password of at least 12 characters.");
    }

    const plain = encoder.encode($("message").value);
    const salt = randomBytes(16);
    const iv = randomBytes(12);

    const r = await rotationFor(password);
    const encoded = spatialEncode(plain, r);
    const key = await deriveAESKey(password, salt);

    const header = {
      version: "QSSE-1",
      encoding: "quaternion-f64-le",
      originalLength: plain.length
    };
    const aad = encoder.encode(JSON.stringify(header));

    const encrypted = await crypto.subtle.encrypt({
      name: "AES-GCM",
      iv,
      additionalData: aad,
      tagLength: 128
    }, key, encoded.bytes);

    const pkg = {
      ...header,
      salt: b64(salt),
      iv: b64(iv),
      ciphertext: b64(new Uint8Array(encrypted))
    };

    $("package").value = JSON.stringify(pkg);
    $("result").textContent = "Encrypted successfully.";
    showSamples(encoded.samples);
    say("Success. Spatial encoding applied; AES-GCM authenticated the package.");
  } catch (e) {
    say("Encryption error: " + e.message);
  }
});

$("decrypt").addEventListener("click", async () => {
  try {
    if (!crypto.subtle) {
      throw Error("Web Crypto unavailable. Use HTTPS or localhost.");
    }

    const password = $("password").value;
    if (password.length < 12) {
      throw Error("Enter the original password.");
    }

    const pkg = JSON.parse($("package").value);

    if (pkg.version !== "QSSE-1" ||
        pkg.encoding !== "quaternion-f64-le" ||
        !Number.isSafeInteger(pkg.originalLength) ||
        pkg.originalLength < 0 ||
        pkg.originalLength > 10000000) {
      throw Error("Unsupported or invalid QSSE package.");
    }

    const salt = unb64(pkg.salt);
    const iv = unb64(pkg.iv);
    const ciphertext = unb64(pkg.ciphertext);

    if (salt.length !== 16 || iv.length !== 12 ||
        ciphertext.length < 16) {
      throw Error("Invalid package fields.");
    }

    const header = {
      version: "QSSE-1",
      encoding: "quaternion-f64-le",
      originalLength: pkg.originalLength
    };
    const aad = encoder.encode(JSON.stringify(header));
    const key = await deriveAESKey(password, salt);

    // AES-GCM rejects an incorrect password or altered ciphertext.
    const transformed = await crypto.subtle.decrypt({
      name: "AES-GCM",
      iv,
      additionalData: aad,
      tagLength: 128
    }, key, ciphertext);

    const r = await rotationFor(password);
    const plainBytes = spatialDecode(
      new Uint8Array(transformed),
      pkg.originalLength,
      r
    );

    $("result").textContent = decoder.decode(plainBytes);
    say("Success. Authentication passed and the original message was reconstructed.");
  } catch (e) {
    $("result").textContent = "No message recovered.";
    say("Decryption failed. Check the password and package. " +
        "Details: " + e.message);
  }
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("package").value);
    say("Package copied.");
  } catch {
    say("Clipboard unavailable. Select and copy the package manually.");
  }
});
</script>
</body>
</html>
