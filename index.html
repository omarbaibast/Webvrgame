<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quaternion Sculpture</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;

    width:230px;
    padding:15px;

    color:white;
    background:rgba(0,0,0,.75);
    border-radius:12px;

    font-family:Arial;
}

#ui h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
}

input{
    width:100%;
}
</style>
</head>

<body>

<div id="ui">

<h2>Quaternion Sculpture</h2>

<label>
Rotation
<input id="rotation"
       type="range"
       min="0"
       max="8"
       value="2.5"
       step="0.01">
</label>

<label>
Deformation
<input id="deformation"
       type="range"
       min="0"
       max="1"
       value=".4"
       step=".01">
</label>

<label>
Frequency
<input id="frequency"
       type="range"
       min="1"
       max="12"
       value="5"
       step="1">
</label>

<label>
Twist
<input id="twist"
       type="range"
       min="-8"
       max="8"
       value="2"
       step=".01">
</label>

</div>


<!-- ONLY EXTERNAL LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>


<script>

/*
========================================================
QUATERNION SCULPTURE
========================================================
*/


// ------------------------------------------------------
// SCENE
// ------------------------------------------------------

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x050509);


// ------------------------------------------------------
// CAMERA
// ------------------------------------------------------

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.z = 4;


// ------------------------------------------------------
// RENDERER
// ------------------------------------------------------

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(
    renderer.domElement
);


// ------------------------------------------------------
// LIGHT
// ------------------------------------------------------

const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    3,
    4,
    5
);

scene.add(light);


scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);


// ------------------------------------------------------
// SPHERE
// ------------------------------------------------------

const geometry =
    new THREE.SphereGeometry(
        1,
        100,
        100
    );


// Save original sphere

const original =
    geometry.attributes.position.clone();


// ------------------------------------------------------
// MATERIAL
// ------------------------------------------------------

const material =
    new THREE.MeshPhongMaterial({

        color:0x2088ff,

        shininess:120,

        side:THREE.DoubleSide
    });


// ------------------------------------------------------
// MESH
// ------------------------------------------------------

const sculpture =
    new THREE.Mesh(
        geometry,
        material
    );

scene.add(sculpture);


// ------------------------------------------------------
// QUATERNION
// ------------------------------------------------------

const q =
    new THREE.Quaternion();


// ------------------------------------------------------
// VECTORS
// ------------------------------------------------------

const p =
    new THREE.Vector3();

const axis =
    new THREE.Vector3();


// ------------------------------------------------------
// PARAMETERS
// ------------------------------------------------------

let rotation = 2.5;

let deformation = .4;

let frequency = 5;

let twist = 2;


// ------------------------------------------------------
// SCULPTURE FUNCTION
// ------------------------------------------------------

function sculpt(){

    const positions =
        geometry.attributes.position;


    for(
        let i=0;
        i<positions.count;
        i++
    ){

        // Original sphere point

        p.fromBufferAttribute(
            original,
            i
        );


        const x = p.x;
        const y = p.y;
        const z = p.z;


        // ------------------------------------------
        // SPHERICAL COORDINATES
        // ------------------------------------------

        const theta =
            Math.atan2(z,x);

        const phi =
            Math.acos(y);


        // ------------------------------------------
        // QUATERNION ROTATION ANGLE
        // ------------------------------------------

        let angle =

            rotation *

            Math.sin(
                frequency * theta
            );


        angle +=
            twist * y;


        // ------------------------------------------
        // ROTATION AXIS
        // ------------------------------------------

        axis.set(

            Math.sin(phi) *
            Math.cos(theta),

            Math.cos(phi),

            Math.sin(phi) *
            Math.sin(theta)

        );

        axis.normalize();


        // ------------------------------------------
        // BUILD QUATERNION
        // ------------------------------------------

        q.setFromAxisAngle(
            axis,
            angle
        );


        // ------------------------------------------
        // ROTATE POINT
        // ------------------------------------------

        p.applyQuaternion(q);


        // ------------------------------------------
        // RADIAL DEFORMATION
        // ------------------------------------------

        const scale =

            1 +

            deformation *

            Math.sin(
                frequency * theta
            ) *

            Math.sin(
                frequency * phi
            );


        p.multiplyScalar(scale);


        // ------------------------------------------
        // WRITE BACK TO MESH
        // ------------------------------------------

        positions.setXYZ(
            i,
            p.x,
            p.y,
            p.z
        );

    }


    positions.needsUpdate = true;

    geometry.computeVertexNormals();
}


// ------------------------------------------------------
// SLIDERS
// ------------------------------------------------------

document
.getElementById("rotation")
.addEventListener(
    "input",
    function(){

        rotation =
            Number(this.value);

        sculpt();
    }
);


document
.getElementById("deformation")
.addEventListener(
    "input",
    function(){

        deformation =
            Number(this.value);

        sculpt();
    }
);


document
.getElementById("frequency")
.addEventListener(
    "input",
    function(){

        frequency =
            Number(this.value);

        sculpt();
    }
);


document
.getElementById("twist")
.addEventListener(
    "input",
    function(){

        twist =
            Number(this.value);

        sculpt();
    }
);


// ------------------------------------------------------
// CREATE INITIAL SCULPTURE
// ------------------------------------------------------

sculpt();


// ------------------------------------------------------
// ANIMATION
// ------------------------------------------------------

function animate(){

    requestAnimationFrame(
        animate
    );

    sculpture.rotation.y +=
        0.005;

    sculpture.rotation.x =
        Math.sin(
            Date.now()*0.0003
        )*.15;

    renderer.render(
        scene,
        camera
    );
}

animate();


// ------------------------------------------------------
// RESIZE
// ------------------------------------------------------

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
