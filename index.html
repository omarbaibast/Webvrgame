<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Interactive Dance Synth</title>
    <style>
        body { margin: 0; background: #0b0c10; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #container { position: relative; width: 800px; height: 600px; border-radius: 16px; overflow: hidden; border: 2px solid #1f2833; }
        video, canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
        #btn { margin-top: 15px; padding: 12px 28px; background: #66fcf1; color: #0b0c10; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; }
    </style>

    <!-- Tone.js, MediaPipe & Camera Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <video id="webcam" playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
    <button id="btn">Initialize High-Quality Audio Engine</button>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const btn = document.getElementById('btn');

        let synth, subBass, filter, reverb, delay;
        let isAudioReady = false;
        let lastPlayedNote = "";

        // --- 1. A Pentatonic Scale in MIDI Note Values ---
        // A Minor Pentatonic across 2 octaves (A2 to E5)
        const scaleMidi = [45, 48, 50, 52, 55, 57, 60, 62, 64, 67, 69, 72, 74, 76];

        // --- 2. Advanced Audio Graph Setup ---
        async function setupAudioEngine() {
            await Tone.start();

            // Reverb & Delay Effects Chain
            reverb = new Tone.Reverb({ decay: 4, wet: 0.35 }).toDestination();
            await reverb.generate();

            delay = new Tone.FeedbackDelay({
                delayTime: "8n.", // Dotted eighth-note delay
                feedback: 0.3,
                wet: 0.25
            }).connect(reverb);

            // Filter for brightness/squelch
            filter = new Tone.Filter({
                frequency: 800,
                type: "lowpass",
                rolloff: -24
            }).connect(delay);

            // Polyphonic Synth Patch (Warm Pad / Pluck)
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "fatfat" }, // Thick dual-sawtooth
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 1.2 }
            }).connect(filter);

            // Deep Sub-Bass Synth
            subBass = new Tone.MonoSynth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.1, decay: 0.3, sustain: 0.8, release: 0.8 }
            }).toDestination();

            isAudioReady = true;
        }

        // Quantize a 0.0 - 1.0 position to the nearest note in our scale
        function mapPositionToNote(normalizedVal) {
            const index = Math.floor((1.0 - normalizedVal) * scaleMidi.length);
            const clampedIndex = Math.max(0, Math.min(scaleMidi.length - 1, index));
            return Tone.Frequency(scaleMidi[clampedIndex], "midi").toNote();
        }

        // --- 3. Pose Tracking and Music Mapping ---
        const pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.7 });
        pose.onResults(onPoseResults);

        function onPoseResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && isAudioReady) {
                const landmarks = results.poseLandmarks;

                // Right Wrist (16): Plays melodic notes on height change
                const rWrist = landmarks[16];
                const currentNote = mapPositionToNote(rWrist.y);

                if (currentNote !== lastPlayedNote) {
                    synth.triggerAttackRelease(currentNote, "8n");
                    lastPlayedNote = currentNote;
                }

                // Left Wrist (15): Controls Cutoff Filter (X) and Delay Wetness (Y)
                const lWrist = landmarks[15];
                const filterFreq = 200 + ((1.0 - lWrist.x) * 4000);
                filter.frequency.setTargetAtTime(filterFreq, Tone.now(), 0.05);

                // Nose / Head height controls Sub-Bass pitch
                const nose = landmarks[0];
                const bassNote = Tone.Frequency(scaleMidi[Math.floor((1.0 - nose.y) * 4)], "midi").toNote();
                subBass.frequency.setTargetAtTime(bassNote, Tone.now(), 0.1);
            }
            canvasCtx.restore();
        }

        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            await setupAudioEngine();
            const camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: 800, height: 600
            });
            camera.start();
        });
    </script>
</body>
</html>
