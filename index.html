
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Voxel Creative Sandbox</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #080d18;
    font-family: Arial, sans-serif;
    color: white;
  }

  #hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    background: rgba(0, 10, 25, 0.8);
    padding: 12px;
    border: 1px solid #00d9ff;
    border-radius: 8px;
    font-size: 14px;
  }

  #material {
    color: #00ffff;
    font-weight: bold;
  }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    color: cyan;
    font-size: 24px;
    pointer-events: none;
  }

  #help {
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 10;
    padding: 10px;
    background: rgba(0, 0, 0, 0.65);
    font-size: 12px;
    line-height: 1.6;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div>VOXEL CREATIVE MODE</div>
  <div>Material: <span id="material">CYAN METAL</span></div>
  <div>Cubes: <span id="cubeCount">0</span></div>
  <div>VR: <span id="vrStatus">Ready</span></div>
</div>

<div id="crosshair">+</div>

<div id="help">
  WASD: Move | Mouse: Look<br>
  Left Click: Place | Right Click: Destroy<br>
  L1 / R1: Change Material<br>
  L2: Aim | R2: Place<br>
  Circle: Destroy | X: Up | Square: Down<br>
  Left Stick: Move | Right Stick: Look
</div>

<script type="module">

import * as THREE from "three";
import { VRButton } from
  "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/webxr/VRButton.js";

// --------------------------------------------------
// SCENE
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080d18);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

// Camera/player rig
const player = new THREE.Group();
scene.add(player);

camera.position.set(0, 1.6, 0);
player.add(camera);

// --------------------------------------------------
// LIGHTING
// --------------------------------------------------

const ambient = new THREE.HemisphereLight(
  0x80dfff,
  0x151020,
  1.5
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(10, 20, 10);
scene.add(sun);

// --------------------------------------------------
// RENDERER
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

renderer.xr.enabled = true;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

document.body.appendChild(
  VRButton.createButton(renderer)
);

// --------------------------------------------------
// MATERIALS
// --------------------------------------------------

const materials = [
  {
    name: "CYAN METAL",
    color: 0x00ccff,
    emissive: 0x003344
  },
  {
    name: "ALIEN PURPLE",
    color: 0x8833ff,
    emissive: 0x220044
  },
  {
    name: "LIME ENERGY",
    color: 0x66ff33,
    emissive: 0x224400
  },
  {
    name: "GOLD",
    color: 0xffbb22,
    emissive: 0x442200
  },
  {
    name: "WHITE FUTURE",
    color: 0xffffff,
    emissive: 0x222222
  },
  {
    name: "DARK STEEL",
    color: 0x444d5a,
    emissive: 0x000000
  }
];

let selectedMaterial = 0;

function createMaterial(index) {
  const m = materials[index];

  return new THREE.MeshStandardMaterial({
    color: m.color,
    emissive: m.emissive,
    metalness: 0.65,
    roughness: 0.3
  });
}

// --------------------------------------------------
// VOXEL WORLD
// --------------------------------------------------

const voxelSize = 1;

const voxelGeometry = new THREE.BoxGeometry(
  voxelSize,
  voxelSize,
  voxelSize
);

const voxels = [];

function updateCubeCount() {
  document.getElementById("cubeCount").textContent =
    voxels.length;
}

function createVoxel(position) {
  // Avoid placing a voxel inside an existing voxel.
  for (const voxel of voxels) {
    if (voxel.position.distanceTo(position) < 0.1) {
      return;
    }
  }

  const cube = new THREE.Mesh(
    voxelGeometry,
    createMaterial(selectedMaterial)
  );

  cube.position.copy(position);

  cube.userData.isVoxel = true;
  cube.userData.materialIndex = selectedMaterial;

  scene.add(cube);
  voxels.push(cube);

  updateCubeCount();
}

function destroyVoxel(cube) {
  if (!cube || !cube.userData.isVoxel) {
    return;
  }

  scene.remove(cube);

  const index = voxels.indexOf(cube);

  if (index !== -1) {
    voxels.splice(index, 1);
  }

  cube.material.dispose();

  updateCubeCount();
}

// --------------------------------------------------
// AIMING / TARGETING
// --------------------------------------------------

const raycaster = new THREE.Raycaster();

raycaster.far = 8;

const center = new THREE.Vector2(0, 0);

let targetVoxel = null;
let targetFace = null;

function updateTarget() {
  raycaster.setFromCamera(center, camera);

  const hits = raycaster.intersectObjects(
    voxels,
    false
  );

  targetVoxel = null;
  targetFace = null;

  if (hits.length > 0) {
    targetVoxel = hits[0].object;
    targetFace = hits[0].face;
  }
}

function placeTargetedVoxel() {
  if (!targetVoxel || !targetFace) {
    return;
  }

  const normal = targetFace.normal.clone();

  // Convert the face normal into world coordinates.
  normal.transformDirection(targetVoxel.matrixWorld);

  const newPosition = targetVoxel.position.clone();

  newPosition.add(
    normal.multiplyScalar(voxelSize)
  );

  createVoxel(newPosition);
}

function destroyTargetedVoxel() {
  if (targetVoxel) {
    destroyVoxel(targetVoxel);
  }
}

// --------------------------------------------------
// MATERIAL SWITCHING
// --------------------------------------------------

function nextMaterial(direction) {
  selectedMaterial += direction;

  if (selectedMaterial < 0) {
    selectedMaterial = materials.length - 1;
  }

  if (selectedMaterial >= materials.length) {
    selectedMaterial = 0;
  }

  document.getElementById("material").textContent =
    materials[selectedMaterial].name;
}

// --------------------------------------------------
// DESKTOP CONTROLS
// --------------------------------------------------

const keys = {};

window.addEventListener("keydown", (event) => {
  keys[event.code] = true;
});

window.addEventListener("keyup", (event) => {
  keys[event.code] = false;
});

let mouseLocked = false;

renderer.domElement.addEventListener(
  "click",
  () => {
    if (!renderer.xr.isPresenting) {
      renderer.domElement.requestPointerLock();
    }
  }
);

document.addEventListener(
  "pointerlockchange",
  () => {
    mouseLocked =
      document.pointerLockElement === renderer.domElement;
  }
);

document.addEventListener(
  "mousemove",
  (event) => {
    if (!mouseLocked || renderer.xr.isPresenting) {
      return;
    }

    player.rotation.y -= event.movementX * 0.002;

    camera.rotation.x -= event.movementY * 0.002;

    camera.rotation.x = THREE.MathUtils.clamp(
      camera.rotation.x,
      -Math.PI / 2,
      Math.PI / 2
    );
  }
);

window.addEventListener("mousedown", (event) => {
  if (renderer.xr.isPresenting) {
    return;
  }

  if (event.button === 0) {
    placeTargetedVoxel();
  }

  if (event.button === 2) {
    destroyTargetedVoxel();
  }
});

window.addEventListener("contextmenu", (event) => {
  event.preventDefault();
});

// --------------------------------------------------
// GAMEPAD CONTROLS
// --------------------------------------------------

const previousButtons = {};

function buttonPressed(gamepad, index) {
  return gamepad.buttons[index]?.pressed || false;
}

function buttonJustPressed(gamepad, index) {
  const current = buttonPressed(gamepad, index);
  const previous = previousButtons[index] || false;

  previousButtons[index] = current;

  return current && !previous;
}

function updateGamepad() {
  const gamepads = navigator.getGamepads();

  let gamepad = null;

  for (const gp of gamepads) {
    if (gp && gp.connected) {
      gamepad = gp;
      break;
    }
  }

  if (!gamepad) {
    return;
  }

  // L1: Previous material
  if (buttonJustPressed(gamepad, 4)) {
    nextMaterial(-1);
  }

  // R1: Next material
  if (buttonJustPressed(gamepad, 5)) {
    nextMaterial(1);
  }

  // L2: Aim
  const aiming = buttonPressed(gamepad, 6);

  // R2: Place voxel while aiming
  if (
    aiming &&
    buttonJustPressed(gamepad, 7)
  ) {
    placeTargetedVoxel();
  }

  // Circle: Destroy
  if (buttonJustPressed(gamepad, 1)) {
    destroyTargetedVoxel();
  }

  // X: Move up
  if (buttonPressed(gamepad, 0)) {
    player.position.y += 0.08;
  }

  // Square: Move down
  if (buttonPressed(gamepad, 2)) {
    player.position.y -= 0.08;
  }

  // Left stick: Player movement
  const leftX = gamepad.axes[0] || 0;
  const leftY = gamepad.axes[1] || 0;

  const moveSpeed = 0.08;

  const forward = new THREE.Vector3(
    0, 0, -1
  ).applyQuaternion(player.quaternion);

  const right = new THREE.Vector3(
    1, 0, 0
  ).applyQuaternion(player.quaternion);

  player.position.addScaledVector(
    forward,
    -leftY * moveSpeed
  );

  player.position.addScaledVector(
    right,
    leftX * moveSpeed
  );

  // Right stick: Camera movement
  const rightX = gamepad.axes[2] || 0;
  const rightY = gamepad.axes[3] || 0;

  const deadzone = 0.15;

  if (Math.abs(rightX) > deadzone) {
    player.rotation.y -= rightX * 0.04;
  }

  if (Math.abs(rightY) > deadzone) {
    camera.rotation.x -= rightY * 0.04;

    camera.rotation.x = THREE.MathUtils.clamp(
      camera.rotation.x,
      -Math.PI / 2,
      Math.PI / 2
    );
  }
}

// --------------------------------------------------
// DESKTOP MOVEMENT
// --------------------------------------------------

function updateKeyboardMovement() {
  const speed = 0.08;

  if (keys["KeyW"]) {
    player.translateZ(-speed);
  }

  if (keys["KeyS"]) {
    player.translateZ(speed);
  }

  if (keys["KeyA"]) {
    player.translateX(-speed);
  }

  if (keys["KeyD"]) {
    player.translateX(speed);
  }

  if (keys["Space"]) {
    player.position.y += speed;
  }

  if (keys["ShiftLeft"]) {
    player.position.y -= speed;
  }
}

// --------------------------------------------------
// VR STATUS
// --------------------------------------------------

renderer.xr.addEventListener(
  "sessionstart",
  () => {
    document.getElementById("vrStatus").textContent =
      "Active";
  }
);

renderer.xr.addEventListener(
  "sessionend",
  () => {
    document.getElementById("vrStatus").textContent =
      "Ready";
  }
);

// --------------------------------------------------
// MAIN LOOP
// --------------------------------------------------

function animate() {
  updateTarget();

  updateGamepad();

  if (!renderer.xr.isPresenting) {
    updateKeyboardMovement();
  }

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener("resize", () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>
</body>
</html>
