
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Music Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #090b12;
  color: #f8fafc;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 950px;
  margin: auto;
}

h1 { font-size: 26px; margin-bottom: 6px; }
p { color: #a8b0c0; }

#stage {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: #161b29;
  border: 1px solid #30384b;
  border-radius: 16px;
}

video, canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video { transform: scaleX(-1); }

#status {
  padding: 12px;
  margin: 12px 0;
  background: #151a27;
  border-radius: 10px;
  color: #b8c6e3;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0;
}

button, select, input {
  font: inherit;
}

button {
  border: 0;
  padding: 12px 18px;
  border-radius: 10px;
  background: #c026d3;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button:disabled { opacity: .55; }

.panel {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid #30384b;
  border-radius: 12px;
  background: #111522;
}

label {
  display: block;
  margin: 10px 0;
}

input[type="range"] { width: 100%; }

.instrument {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #262c3b;
}

.small {
  font-size: 13px;
  color: #929db2;
}

#meter {
  height: 7px;
  background: #30384b;
  border-radius: 8px;
  overflow: hidden;
  margin-top: 8px;
}

#energyBar {
  height: 100%;
  width: 0%;
  background: #d946ef;
  transition: width .12s;
}
</style>
</head>

<body>
<main>
  <h1>Dance Music Studio</h1>
  <p>Dance in front of your camera. Your movements control the music.</p>

  <div id="stage">
    <video id="camera" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Ready. Press Start Studio to begin.</div>

  <div class="controls">
    <button id="start">Start Studio</button>
    <button id="stop" disabled>Stop Music</button>
  </div>

  <div class="panel">
    <label>
      Tempo: <strong id="bpmText">110 BPM</strong>
      <input id="bpm" type="range" min="70" max="150" value="110">
    </label>

    <label>
      Music intensity: <strong id="intensityText">70%</strong>
      <input id="intensity" type="range" min="10" max="100" value="70">
    </label>

    <label>
      Musical style
      <select id="style">
        <option value="balanced">Balanced band</option>
        <option value="dance">Dance groove</option>
        <option value="calm">Calm and melodic</option>
      </select>
    </label>
  </div>

  <div class="panel">
    <h3>Instrument levels</h3>

    <label class="instrument">
      <span>Piano</span>
      <input id="pianoOn" type="checkbox" checked>
    </label>

    <label class="instrument">
      <span>Guitar</span>
      <input id="guitarOn" type="checkbox" checked>
    </label>

    <label class="instrument">
      <span>Bass</span>
      <input id="bassOn" type="checkbox" checked>
    </label>

    <label class="instrument">
      <span>Drums</span>
      <input id="drumsOn" type="checkbox" checked>
    </label>

    <p class="small">
      Body energy
      <div id="meter"><div id="energyBar"></div></div>
    </p>
  </div>

  <p class="small">
    Requires camera permission and an internet connection to load
    the libraries and instrument samples. Use HTTPS or localhost.
  </p>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const video = $("camera");
const canvas = $("overlay");
const ctx = canvas.getContext("2d");
const status = $("status");

let camera = null;
let pose = null;
let running = false;
let starting = false;
let audioReady = false;
let lastPoseTime = 0;
let lastMelodyTime = 0;
let lastGuitarTime = 0;
let lastStep = -1;
let lastBassStep = -1;
let previousHandY = null;
let movementEnergy = 0;
let lastMovement = 0;
let melodyIndex = 0;
let chordIndex = 0;

let piano, guitar, bass;
let kick, snare, hat;
let master, reverb, compressor;
let loops = [];
let cameraStream = null;

const scale = ["A4", "C5", "D5", "E5", "G5", "A5"];

const chords = [
  ["A3", "C4", "E4"],
  ["F3", "A3", "C4"],
  ["C3", "E3", "G3"],
  ["G3", "B3", "D4"]
];

const bassNotes = ["A1", "F1", "C2", "G1"];

function setStatus(message) {
  status.textContent = message;
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function instrumentEnabled(id) {
  return $(id).checked;
}

function safeTrigger(instrument, notes, duration, time) {
  if (!instrument) return;
  try {
    instrument.triggerAttackRelease(notes, duration, time);
  } catch (error) {
    console.warn("Instrument playback error:", error);
  }
}

function makeSampler(urls, baseUrl, volume) {
  return new Tone.Sampler({
    urls,
    baseUrl,
    release: 0.8,
    volume,
    onerror: error => console.error("Sample loading error:", error)
  });
}

async function initAudio() {
  await Tone.start();

  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.bpm.value = Number($("bpm").value);

  master = new Tone.Gain(0.8).toDestination();

  compressor = new Tone.Compressor({
    threshold: -18,
    ratio: 3,
    attack: 0.01,
    release: 0.2
  }).connect(master);

  reverb = new Tone.Reverb({
    decay: 2.2,
    wet: 0.18
  }).connect(compressor);

  await reverb.generate();

  // Recorded piano samples.
  piano = makeSampler({
    A2: "A2.mp3",
    C3: "C3.mp3",
    E3: "E3.mp3",
    A3: "A3.mp3",
    C4: "C4.mp3",
    E4: "E4.mp3",
    A4: "A4.mp3",
    C5: "C5.mp3",
    E5: "E5.mp3",
    A5: "A5.mp3",
    C6: "C6.mp3"
  }, "https://tonejs.github.io/audio/salamander/", -8);

  piano.connect(reverb);

  // Nylon guitar samples from the FluidR3 General MIDI soundfont.
  // The remote sample host must be reachable from your browser.
  guitar = makeSampler({
    C3: "C3.mp3",
    "D#3": "Ds3.mp3",
    F3: "F3.mp3",
    G3: "G3.mp3",
    A3: "A3.mp3",
    C4: "C4.mp3",
    "D#4": "Ds4.mp3",
    F4: "F4.mp3",
    G4: "G4.mp3",
    A4: "A4.mp3",
    C5: "C5.mp3"
  }, "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_guitar_nylon-mp3/", -9);

  guitar.connect(reverb);

  // Sampled electric bass.
  bass = makeSampler({
    C2: "C2.mp3",
    F2: "F2.mp3",
    G2: "G2.mp3",
    A2: "A2.mp3",
    C3: "C3.mp3",
    F3: "F3.mp3",
    G3: "G3.mp3",
    A3: "A3.mp3"
  }, "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/electric_bass_finger-mp3/", -7);

  bass.connect(compressor);

  // Drum sounds are synthesized for immediate response.
  // Replace these with licensed drum samples for a more realistic kit.
  kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 6,
    oscillator: { type: "sine" },
    envelope: {
      attack: 0.001,
      decay: 0.3,
      sustain: 0,
      release: 0.12
    },
    volume: -4
  }).connect(compressor);

  snare = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: {
      attack: 0.001,
      decay: 0.16,
      sustain: 0,
      release: 0.03
    },
    volume: -13
  }).connect(compressor);

  hat = new Tone.MetalSynth({
    frequency: 250,
    envelope: {
      attack: 0.001,
      decay: 0.07,
      release: 0.01
    },
    harmonicity: 5.1,
    modulationIndex: 32,
    resonance: 4000,
    octaves: 1.5,
    volume: -22
  }).connect(compressor);

  // Wait for all recorded instruments to load.
  await Promise.all([
    piano.loaded,
    guitar.loaded,
    bass.loaded
  ]);

  audioReady = true;
}

function intensity() {
  return Number($("intensity").value) / 100;
}

function playChord(time) {
  if (!instrumentEnabled("pianoOn")) return;

  const chord = chords[chordIndex % chords.length];
  const level = intensity();

  // Chord voicing.
  safeTrigger(piano, chord, "2n", time);

  // Guitar adds an offbeat strum-like chord.
  if (
    instrumentEnabled("guitarOn") &&
    $("style").value !== "calm"
  ) {
    const guitarChord = chord.map(note =>
      Tone.Frequency(note).transpose(12).toNote()
    );

    safeTrigger(
      guitar,
      guitarChord,
      "8n",
      time + 0.01
    );
  }

  chordIndex++;
}

function setupLoops() {
  loops.forEach(loop => loop.dispose());
  loops = [];

  // Four-beat bar: drums, chords and bass stay synchronized.
  loops.push(new Tone.Loop(time => {
    const step = lastStep + 1;
    lastStep = step;

    const beat = step % 4;
    const style = $("style").value;
    const energy = movementEnergy;
    const level = intensity();

    if (instrumentEnabled("drumsOn")) {
      // Kick on beats 1 and 3; additional dance kick on beat 2/4.
      if (beat === 0 || beat === 2 || (style === "dance" && beat === 1)) {
        safeTrigger(kick, "C1", "8n", time);
      }

      // Snare on beats 2 and 4.
      if (beat === 1 || beat === 3) {
        safeTrigger(snare, "16n", time);
      }

      // Hi-hat on eighth-note subdivisions.
      safeTrigger(hat, "32n", time);
    }

    // Bass follows the root of the chord progression.
    if (instrumentEnabled("bassOn")) {
      const root = bassNotes[chordIndex % bassNotes.length];

      if (beat === 0 || (style === "dance" && beat === 2)) {
        safeTrigger(bass, root, "8n", time);
      }
    }

    // Chords change every bar.
    if (beat === 0) {
      playChord(time);
    }

  }, "4n").start(0));

  // Guitar rhythmic accents between beats.
  loops.push(new Tone.Loop(time => {
    if (
      !instrumentEnabled("guitarOn") ||
      $("style").value === "calm"
    ) return;

    const chord = chords[
      (chordIndex + chords.length - 1) % chords.length
    ];

    const notes = chord.map(n =>
      Tone.Frequency(n).transpose(12).toNote()
    );

    safeTrigger(guitar, notes, "16n", time);
  }, "8n").start("8n"));

  // Melody is generated from the selected scale and quantized to the beat.
  loops.push(new Tone.Loop(time => {
    if (!instrumentEnabled("pianoOn")) return;

    const energy = movementEnergy;
    const step = melodyIndex % scale.length;
    const note = scale[step];

    if (energy > 0.08) {
      safeTrigger(
        piano,
        note,
        "8n",
        time
      );

      melodyIndex++;
    }
  }, "8n").start(0));

  lastStep = -1;
  lastBassStep = -1;
  Tone.Transport.start();
}

// Camera and body tracking.
pose = new Pose({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

pose.onResults(results => {
  if (!running) return;

  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  if (results.image) {
    ctx.save();
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(results.image, 0, 0, w, h);
    ctx.restore();
  }

  const landmarks = results.poseLandmarks;
  if (!landmarks) {
    setStatus("Looking for your body...");
    return;
  }

  // Draw pose landmarks as simple circles.
  ctx.fillStyle = "#e879f9";

  for (const point of landmarks) {
    if (point.visibility > 0.45) {
      ctx.beginPath();
      ctx.arc(point.x * w, point.y * h, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const leftWrist = landmarks[15];
  const rightWrist = landmarks[16];
  const leftShoulder = landmarks[11];
  const rightShoulder = landmarks[12];

  if (
    leftWrist.visibility < 0.4 ||
    rightWrist.visibility < 0.4
  ) return;

  // Hand height controls melody register and selection.
  const handY = (leftWrist.y + rightWrist.y) / 2;
  const noteIndex = Math.max(
    0,
    Math.min(
      scale.length - 1,
      Math.floor((1 - handY) * scale.length)
    )
  );

  // Estimate movement from wrist displacement between frames.
  const now = performance.now();

  if (previousHandY !== null && lastMovement > 0) {
    const velocity = Math.abs(handY - previousHandY);
    const measured = Math.min(1, velocity * 12);
    movementEnergy = movementEnergy * 0.8 + measured * 0.2;
  }

  previousHandY = handY;
  lastMovement = now;

  // Raised hands trigger guitar accents, with a cooldown.
  const shouldersY = (leftShoulder.y + rightShoulder.y) / 2;
  const handsRaised =
    leftWrist.y < shouldersY &&
    rightWrist.y < shouldersY;

  if (
    handsRaised &&
    now - lastGuitarTime > 650 &&
    instrumentEnabled("guitarOn")
  ) {
    const chord = chords[chordIndex % chords.length];

    safeTrigger(
      guitar,
      chord.map(n => Tone.Frequency(n).transpose(12).toNote()),
      "8n"
    );

    lastGuitarTime = now;
  }

  $("energyBar").style.width =
    `${Math.round(movementEnergy * 100)}%`;

  setStatus(
    `Music: ${running ? "Playing" : "Stopped"} | ` +
    `Tempo: ${Tone.Transport.bpm.value} BPM | ` +
    `Melody zone: ${scale[noteIndex]} | ` +
    `Energy: ${Math.round(movementEnergy * 100)}%`
  );
});

// Controls.
$("bpm").addEventListener("input", () => {
  $("bpmText").textContent = `${$("bpm").value} BPM`;

  if (Tone.Transport) {
    Tone.Transport.bpm.rampTo(Number($("bpm").value), 0.1);
  }
});

$("intensity").addEventListener("input", () => {
  $("intensityText").textContent = `${$("intensity").value}%`;

  if (master) {
    master.gain.rampTo(
      0.3 + intensity() * 0.7,
      0.1
    );
  }
});

$("start").addEventListener("click", async () => {
  if (running || starting) return;

  starting = true;
  $("start").disabled = true;

  try {
    setStatus("Starting audio engine...");

    await initAudio();

    setStatus("Loading camera...");

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 800 },
        height: { ideal: 600 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    camera = new Camera(video, {
      onFrame: async () => {
        if (running) {
          await pose.send({ image: video });
        }
      },
      width: 800,
      height: 600
    });

    setupLoops();

    running = true;
    camera.start();

    $("stop").disabled = false;
    $("start").textContent = "Studio Running";

    setStatus("Studio active. Start dancing!");
  } catch (error) {
    console.error(error);
    setStatus("Could not start: " + error.message);

    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    Tone.Transport.stop();
    running = false;
  } finally {
    starting = false;
    $("start").disabled = false;
  }
});

$("stop").addEventListener("click", () => {
  running = false;

  Tone.Transport.stop();
  Tone.Transport.cancel();

  loops.forEach(loop => loop.dispose());
  loops = [];

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;

  if (master) {
    master.gain.rampTo(0, 0.05);
  }

  $("stop").disabled = true;
  $("start").textContent = "Start Studio";

  setStatus("Studio stopped.");
});
</script>
</body>
</html>
