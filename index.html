<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quaternion Bio-Humanoid</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030307; font-family: sans-serif; }
        #error-log { color: #ff4444; position: absolute; top: 20px; left: 20px; z-index: 100; font-size: 16px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="error-log"></div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Catch any script errors and display them on screen
        window.onerror = function(msg, url, line) {
            document.getElementById('error-log').innerText = "Script Error: " + msg + " (Line: " + line + ")";
            return true;
        };

        try {
            // 1. Scene, Camera, Renderer
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Cellular Atom Geometry & Material
            const atomGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const atomMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x38bdf8, 
                roughness: 0.1, 
                metalness: 0.8,
                emissive: 0x0284c7,
                emissiveIntensity: 0.4
            });

            // Define body regions forming a humanoid silhouette
            const bodyParts = [
                { name: 'head', count: 40, offset: new THREE.Vector3(0, 2.2, 0), radius: 0.35 },
                { name: 'torso', count: 120, offset: new THREE.Vector3(0, 0.8, 0), radius: 0.7 },
                { name: 'leftArm', count: 45, offset: new THREE.Vector3(-0.9, 1.0, 0), radius: 0.25 },
                { name: 'rightArm', count: 45, offset: new THREE.Vector3(0.9, 1.0, 0), radius: 0.25 },
                { name: 'leftLeg', count: 55, offset: new THREE.Vector3(-0.35, -0.8, 0), radius: 0.3 },
                { name: 'rightLeg', count: 55, offset: new THREE.Vector3(0.35, -0.8, 0), radius: 0.3 }
            ];

            const totalAtoms = bodyParts.reduce((sum, part) => sum + part.count, 0);
            const instancedMesh = new THREE.InstancedMesh(atomGeometry, atomMaterial, totalAtoms);
            scene.add(instancedMesh);

            const atomMetaData = [];
            const dummy = new THREE.Object3D();

            bodyParts.forEach(part => {
                for (let i = 0; i < part.count; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.acos(Math.random() * 2 - 1);
                    const r = Math.cbrt(Math.random()) * part.radius;

                    const localPos = new THREE.Vector3(
                        r * Math.sin(v) * Math.cos(u),
                        r * Math.sin(v) * Math.sin(u) + part.offset.y,
                        r * Math.cos(v) + part.offset.z
                    );
                    localPos.x += part.offset.x;

                    const theta = Math.PI * 0.25;
                    const q = new THREE.Quaternion(
                        localPos.x * Math.sin(theta), 
                        localPos.y * Math.sin(theta), 
                        localPos.z * Math.sin(theta), 
                        Math.cos(theta)
                    );

                    atomMetaData.push({
                        partName: part.name,
                        basePos: localPos,
                        quaternion: q,
                        phase: Math.random() * Math.PI
                    });
                }
            });

            // 3. Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            camera.position.set(0, 0.8, 5.5);

            // 4. Animation Loop
            function animate(time) {
                requestAnimationFrame(animate);
                const t = time * 0.002;

                const armQuaternion = new THREE.Quaternion();
                const legQuaternion = new THREE.Quaternion();
                const torsoQuaternion = new THREE.Quaternion();

                armQuaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.sin(t) * 0.4);
                legQuaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.sin(t) * 0.4);
                torsoQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(t * 0.5) * 0.2);

                atomMetaData.forEach((atom, idx) => {
                    let currentPos = atom.basePos.clone();

                    if (atom.partName.includes('Arm')) {
                        const shoulderOffset = new THREE.Vector3(atom.partName.includes('left') ? -0.9 : 0.9, 1.3, 0);
                        currentPos.sub(shoulderOffset);
                        currentPos.applyQuaternion(armQuaternion);
                        currentPos.add(shoulderOffset);
                    } else if (atom.partName.includes('Leg')) {
                        const hipOffset = new THREE.Vector3(atom.partName.includes('left') ? -0.35 : 0.35, -0.3, 0);
                        currentPos.sub(hipOffset);
                        currentPos.applyQuaternion(legQuaternion);
                        currentPos.add(hipOffset);
                    } else if (atom.partName === 'torso') {
                        currentPos.y -= 0.8;
                        currentPos.applyQuaternion(torsoQuaternion);
                        currentPos.y += 0.8;
                    }

                    dummy.position.copy(currentPos);
                    dummy.quaternion.copy(atom.quaternion);
                    dummy.scale.set(1, 1, 1);

                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(idx, dummy.matrix);
                });

                instancedMesh.instanceMatrix.needsUpdate = true;
                
                // Slow global spin for viewing
                scene.rotation.y = t * 0.2;

                renderer.render(scene, camera);
            }

            animate(0);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (err) {
            document.getElementById('error-log').innerText = "Setup Error: " + err.message;
        }
    </script>
</body>
</html>
