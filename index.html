<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Smooth Surface Example</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
</head>
<body>

<!-- Import Three.js and Addons using ES Modules -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';

  // 1. Scene setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(5, 5, 7);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // 2. Define the parametric surface function: f(u, v) -> (x, y, z)
  // u and v range from 0 to 1
  function waveFunction(u, v, target) {
    const x = (u - 0.5) * 10;
    const z = (v - 0.5) * 10;
    // Mathematical surface equation: y = sin(x) * cos(z)
    const y = Math.sin(x) * Math.cos(z);

    target.set(x, y, z);
  }

  // 3. Create ParametricGeometry (slices, stacks determine smoothness)
  const slices = 60; // Resolution along U
  const stacks = 60; // Resolution along V
  const geometry = new ParametricGeometry(waveFunction, slices, stacks);

  // Compute smooth normals so lighting updates seamlessly across vertices
  geometry.computeVertexNormals();

  // 4. Create material with double-sided rendering and smooth shading
  const material = new THREE.MeshStandardMaterial({
    color: 0x00aaff,
    roughness: 0.3,
    metalness: 0.2,
    side: THREE.DoubleSide,
    flatShading: false // Ensures smooth lighting transitions
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // 5. Add Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
  directionalLight.position.set(5, 10, 7);
  scene.add(directionalLight);

  const pointLight = new THREE.PointLight(0xff0055, 2, 20);
  pointLight.position.set(-3, 2, -3);
  scene.add(pointLight);

  // Add grid helper for visual reference
  const gridHelper = new THREE.GridHelper(12, 12, 0x444444, 0x222222);
  gridHelper.position.y = -2;
  scene.add(gridHelper);

  // 6. Handle Window Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 7. Animation Loop
  function animate() {
    requestAnimationFrame(animate);
    mesh.rotation.y += 0.003; // Gentle rotation
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
