<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quaternion Sculpture</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050509;
    }

    canvas {
        display: block;
    }

    #info {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        font-family: monospace;
        font-size: 14px;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="info">
    Quaternion Sculpture<br>
    Drag = rotate &nbsp; | &nbsp; Wheel = zoom
</div>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


// --------------------------------------------------
// Scene
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050509);


// --------------------------------------------------
// Camera
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 1.5, 8);


// --------------------------------------------------
// Renderer
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// --------------------------------------------------
// Controls
// --------------------------------------------------

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;


// --------------------------------------------------
// Lights
// --------------------------------------------------

scene.add(
    new THREE.AmbientLight(0xffffff, 1.2)
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(4, 6, 5);

scene.add(light);


// --------------------------------------------------
// Quaternion sculpture
// --------------------------------------------------

const positions = [];

const rings = 180;
const pointsPerRing = 24;


// Quaternion:
// q = w + xi + yj + zk
//
// We use the imaginary components
// (x,y,z) as our 3D position.
//
// The quaternion function:
//
// q(t,u) =
// cos(t)
// + sin(t) sin(u) i
// + cos(2t) sin(u) j
// + sin(3t) sin(u) k
//
// The radius is additionally modulated,
// creating the sculptural shape.
// --------------------------------------------------

for (let i = 0; i <= rings; i++) {

    const t =
        (i / rings) * Math.PI * 6;

    for (let j = 0; j < pointsPerRing; j++) {

        const u =
            (j / pointsPerRing) * Math.PI * 2;

        // Quaternion components

        const w = Math.cos(t);

        const x =
            Math.sin(t) *
            Math.cos(u);

        const y =
            Math.cos(2 * t) *
            Math.sin(u);

        const z =
            Math.sin(3 * t) *
            Math.cos(u);


        // Quaternion magnitude

        const magnitude =
            Math.sqrt(
                w*w +
                x*x +
                y*y +
                z*z
            );


        // Use the quaternion magnitude
        // to deform the sculpture.

        const radius =
            1.0 +
            0.35 * Math.sin(
                5 * t + 3 * u
            );


        positions.push(
            x * radius,
            y * radius,
            z * radius
        );
    }
}


// --------------------------------------------------
// Geometry
// --------------------------------------------------

const geometry =
    new THREE.BufferGeometry();

geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);


// --------------------------------------------------
// Material
// --------------------------------------------------

const material =
    new THREE.PointsMaterial({

        color: 0x66ccff,

        size: 0.045,

        transparent: true,

        opacity: 0.9,

        blending:
            THREE.AdditiveBlending
    });


// --------------------------------------------------
// Sculpture
// --------------------------------------------------

const sculpture =
    new THREE.Points(
        geometry,
        material
    );

scene.add(sculpture);


// --------------------------------------------------
// Animation
// --------------------------------------------------

function animate() {

    requestAnimationFrame(animate);

    sculpture.rotation.y += 0.002;

    sculpture.rotation.x =
        Math.sin(Date.now() * 0.0003) * 0.15;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// --------------------------------------------------
// Resize
// --------------------------------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
