<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي حاسوب i^n التخيلي</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f33;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }

        p.description {
            color: #8fa0c2;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .machine-controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        .machine {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            width: 40%;
        }

        .machine h3 {
            margin-top: 0;
            font-size: 16px;
            color: #a5b4fc;
        }

        .switch-btn {
            background-color: #1e293b;
            color: #fff;
            border: 2px solid #475569;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .switch-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .output-panel {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 5px solid var(--accent-color);
            transition: all 0.5s ease;
        }

        .bit-combination {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .state-result {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
            transition: color 0.3s;
        }

        .state-desc {
            font-size: 16px;
            font-style: italic;
            color: #cbd5e1;
        }

        /* ألوان الحالات الأربعة للبلورة/المعالج */
        .state-1 { --accent-color: #ffffff; }      /* 00 -> 1 */
        .state-i { --accent-color: #38bdf8; }      /* 01 -> i */
        .state-neg1 { --accent-color: #ef4444; }   /* 10 -> -1 */
        .state-negi { --accent-color: #a855f7; }   /* 11 -> -i */

    </style>
</head>
<body>

    <div class="container" id="computer-panel">
        <h1>حاسوب \(i^n\) المدمج ثنائي البت</h1>
        <p class="description">قم بتغيير مخرجات الآلة 1 والآلة 2 لرؤية كيف يتشكل البت التخيلي رباعي الأبعاد.</p>

        <div class="machine-controls">
            <!-- الآلة الأولى -->
            <div class="machine">
                <h3>الآلة 1 (البت الأول)</h3>
                <button id="btn-m1" class="switch-btn" onclick="toggleMachine(1)">0</button>
            </div>
            
            <!-- الآلة الثانية -->
            <div class="machine">
                <h3>الآلة 2 (البت الثاني)</h3>
                <button id="btn-m2" class="switch-btn" onclick="toggleMachine(2)">0</button>
            </div>
        </div>

        <!-- لوحة عرض المخرجات والحالة التخيلية -->
        <div class="output-panel" id="output-panel">
            <div class="bit-combination" id="bit-display">المخرجات المدمجة: 00</div>
            <div class="state-result" id="math-display">1</div>
            <div class="state-desc" id="desc-display">الحالة الواقعية الموجبة (n=0)</div>
        </div>
    </div>

    <script>
        // الحالات الابتدائية للآلتين
        let bit1 = 0;
        let bit2 = 0;

        // مصفوفة خارطة التطابق التي اقترحتَها
        const statesMapping = {
            "00": { math: "1",  desc: "الحالة الواقعية الموجبة (n=0)", class: "state-1" },
            "01": { math: "i",  desc: "الحالة التخيلية الموجبة (n=1)", class: "state-i" },
            "10": { math: "-1", desc: "الحالة الواقعية السالبة / المعكوسة (n=2)", class: "state-neg1" },
            "11": { math: "-i", desc: "الحالة التخيلية السالبة (n=3)", class: "state-negi" }
        };

        function toggleMachine(machineNum) {
            if (machineNum === 1) {
                bit1 = bit1 === 0 ? 1 : 0;
                document.getElementById("btn-m1").innerText = bit1;
                document.getElementById("btn-m1").classList.toggle("active", bit1 === 1);
            } else {
                bit2 = bit2 === 0 ? 1 : 0;
                document.getElementById("btn-m2").innerText = bit2;
                document.getElementById("btn-m2").classList.toggle("active", bit2 === 1);
            }

            updateComputerState();
        }

        function updateComputerState() {
            // دمج المخرجات لإنتاج المفتاح (مثل "01" أو "11")
            const combination = `${bit1}${bit2}`;
            const currentState = statesMapping[combination];

            // تحديث واجهة المستخدم بالبيانات الجديدة
            document.getElementById("bit-display").innerText = `المخرجات المدمجة: ${combination}`;
            document.getElementById("math-display").innerText = currentState.math;
            document.getElementById("desc-display").innerText = currentState.desc;

            // تغيير نمط الألوان بناءً على الحالة التخيلية النشطة
            const panel = document.getElementById("computer-panel");
            panel.className = "container " + currentState.class;
        }

        // تشغيل التهيئة الأولى
        updateComputerState();
    </script>
</body>
</html>
