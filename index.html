<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quaternion Bio-Humanoid</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030307; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Cellular Atom Geometry & Material
        const atomGeometry = new THREE.SphereGeometry(0.08, 16, 16);
        const atomMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x38bdf8, 
            roughness: 0.1, 
            metalness: 0.8,
            emissive: 0x0284c7,
            emissiveIntensity: 0.3
        });

        // Define body regions (clusters of atoms forming a humanoid silhouette)
        const bodyParts = [
            { name: 'head', count: 40, offset: new THREE.Vector3(0, 2.5, 0), radius: 0.4 },
            { name: 'torso', count: 120, offset: new THREE.Vector3(0, 1.0, 0), radius: 0.8 },
            { name: 'leftArm', count: 50, offset: new THREE.Vector3(-1.0, 1.2, 0), radius: 0.3 },
            { name: 'rightArm', count: 50, offset: new THREE.Vector3(1.0, 1.2, 0), radius: 0.3 },
            { name: 'leftLeg', count: 60, offset: new THREE.Vector3(-0.4, -0.8, 0), radius: 0.35 },
            { name: 'rightLeg', count: 60, offset: new THREE.Vector3(0.4, -0.8, 0), radius: 0.35 }
        ];

        const totalAtoms = bodyParts.reduce((sum, part) => sum + part.count, 0);
        const instancedMesh = new THREE.InstancedMesh(atomGeometry, atomMaterial, totalAtoms);
        scene.add(instancedMesh);

        // Generate atoms grouped by body segments
        const atomMetaData = [];
        const dummy = new THREE.Object3D();
        let instanceIndex = 0;

        bodyParts.forEach(part => {
            for (let i = 0; i < part.count; i++) {
                // Distribute atoms inside each body part's local volume
                const u = Math.random() * Math.PI * 2;
                const v = Math.acos(Math.random() * 2 - 1);
                const r = Math.cbrt(Math.random()) * part.radius;

                const localPos = new THREE.Vector3(
                    r * Math.sin(v) * Math.cos(u),
                    r * Math.sin(v) * Math.sin(u) + part.offset.y,
                    r * Math.cos(v) + part.offset.z
                );
                localPos.x += part.offset.x;

                // Base polar quaternion for internal atom orientation
                const theta = Math.PI * 0.25;
                const q = new THREE.Quaternion(localPos.x * Math.sin(theta), localPos.y * Math.sin(theta), localPos.z * Math.sin(theta), Math.cos(theta));

                atomMetaData.push({
                    partName: part.name,
                    basePos: localPos,
                    quaternion: q,
                    phase: Math.random() * Math.PI
                });
            }
        });

        // 3. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        camera.position.set(0, 1, 6);

        // 4. Articulated Animation Loop (Quaternion Joint Rotations)
        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.002;

            // Create quaternion rotations for joints (e.g., arms swinging, torso twisting)
            const armQuaternion = new THREE.Quaternion();
            const legQuaternion = new THREE.Quaternion();
            const torsoQuaternion = new THREE.Quaternion();

            armQuaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.sin(t) * 0.4);
            legQuaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.sin(t) * 0.4);
            torsoQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(t * 0.5) * 0.2);

            atomMetaData.forEach((atom, idx) => {
                let currentPos = atom.basePos.clone();

                // Apply joint transformations based on body part using quaternions
                if (atom.partName.includes('Arm')) {
                    // Pivot arms around shoulders
                    const shoulderOffset = new THREE.Vector3(atom.partName.includes('left') ? -0.7 : 0.7, 1.5, 0);
                    currentPos.sub(shoulderOffset);
                    currentPos.applyQuaternion(armQuaternion);
                    currentPos.add(shoulderOffset);
