<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaternion Sculpture</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
    </style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";


// -------------------------
// Scene
// -------------------------

const scene = new THREE.Scene();


// -------------------------
// Camera
// -------------------------

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.z = 8;


// -------------------------
// Renderer
// -------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// -------------------------
// Quaternion sculpture
// -------------------------

const geometry =
    new THREE.BufferGeometry();

const vertices = [];


// We create many points.
//
// Each point starts on a circle.
// A quaternion rotates that point.
//
// q = rotation around the Y axis.

for (let i = 0; i < 3000; i++) {

    const t = i * 0.025;

    const radius =
        1.5 +
        0.5 * Math.sin(t * 3.0);

    // Original point
    const point = new THREE.Vector3(
        radius * Math.cos(t),
        0.15 * Math.sin(t * 5.0),
        radius * Math.sin(t)
    );


    // -------------------------
    // QUATERNION
    // -------------------------

    const quaternion =
        new THREE.Quaternion();

    quaternion.setFromAxisAngle(
        new THREE.Vector3(0, 1, 0),
        t * 0.7
    );


    // Rotate the point
    point.applyQuaternion(quaternion);


    // Add another deformation

    point.y +=
        Math.sin(t * 2.0) * 0.8;


    vertices.push(
        point.x,
        point.y,
        point.z
    );
}


geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        vertices,
        3
    )
);


// -------------------------
// Material
// -------------------------

const material =
    new THREE.PointsMaterial({
        color: 0x00ffff,
        size: 0.035
    });


// -------------------------
// Object
// -------------------------

const sculpture =
    new THREE.Points(
        geometry,
        material
    );

scene.add(sculpture);


// -------------------------
// Animation
// -------------------------

function animate() {

    requestAnimationFrame(animate);

    sculpture.rotation.y += 0.003;
    sculpture.rotation.x += 0.001;

    renderer.render(
        scene,
        camera
    );
}

animate();


// -------------------------
// Resize
// -------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
