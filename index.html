
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>VR Camera Viewer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#screen {
    position: fixed;
    inset: 0;
    display: flex;
    background: black;
}

.eye {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    border-right: 1px solid #222;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#controls {
    position: fixed;
    z-index: 10;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 95%;
}

button {
    border: 1px solid #444;
    border-radius: 12px;
    background: #171717;
    color: white;
    padding: 13px 16px;
    font-size: 14px;
}

button:active {
    background: #333;
}

#status {
    position: fixed;
    z-index: 10;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: #111c;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12px;
    text-align: center;
}

#settings {
    position: fixed;
    z-index: 10;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    background: #111c;
    padding: 10px;
    border-radius: 10px;
    font-size: 12px;
    width: 230px;
}

input[type=range] {
    width: 100%;
}
</style>
</head>

<body>

<div id="status">
    VR CAMERA VIEWER — CAMERA OFF
</div>

<div id="settings">
    VR Zoom
    <input type="range" id="zoom"
           min="1" max="3" step="0.1" value="1">
</div>

<div id="screen">

    <div class="eye">
        <video id="leftEye"
               autoplay playsinline muted></video>
    </div>

    <div class="eye">
        <video id="rightEye"
               autoplay playsinline muted></video>
    </div>

</div>

<div id="controls">
    <button onclick="startCamera()">📷 Start Camera</button>
    <button onclick="switchCamera()">🔄 Switch Camera</button>
    <button onclick="toggleVR()">🥽 VR Mode</button>
    <button onclick="stopCamera()">⏹ Stop</button>
</div>

<script>

let stream = null;
let facing = "environment";
let vr = false;

const leftEye = document.getElementById("leftEye");
const rightEye = document.getElementById("rightEye");
const status = document.getElementById("status");
const zoom = document.getElementById("zoom");

async function startCamera() {

    try {

        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: facing,
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30 }
            }
        });

        leftEye.srcObject = stream;
        rightEye.srcObject = stream;

        await leftEye.play();
        await rightEye.play();

        status.textContent = "VR CAMERA VIEWER — CAMERA ON";

    } catch (error) {

        status.textContent =
            "Camera error: " + error.message;

        alert(
            "Camera access failed. Allow camera permission " +
            "and open this app using HTTPS or localhost."
        );
    }
}

async function switchCamera() {

    facing = facing === "environment"
        ? "user"
        : "environment";

    await startCamera();
}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(t => t.stop());

        stream = null;

        leftEye.srcObject = null;
        rightEye.srcObject = null;

        status.textContent =
            "VR CAMERA VIEWER — CAMERA OFF";
    }
}

async function toggleVR() {

    vr = !vr;

    if (vr) {

        try {

            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            }

        } catch (error) {
            console.log("Fullscreen unavailable");
        }

        if (screen.orientation &&
            screen.orientation.lock) {

            try {
                await screen.orientation.lock("landscape");
            } catch (error) {
                console.log("Orientation lock unavailable");
            }
        }

        document.getElementById("controls").style.display = "none";
        document.getElementById("settings").style.display = "none";
        status.style.display = "none";

    } else {

        document.getElementById("controls").style.display = "flex";
        document.getElementById("settings").style.display = "block";
        status.style.display = "block";

        if (document.fullscreenElement) {
            await document.exitFullscreen();
        }
    }
}

zoom.addEventListener("input", () => {

    const value = zoom.value;

    leftEye.style.transform =
        "scale(" + value + ")";

    rightEye.style.transform =
        "scale(" + value + ")";
});

</script>

</body>
</html>
