```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majestic Humanoid Quaternion Sculpture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1 class="text-xl font-bold tracking-widest text-cyan-400 drop-shadow-[0_2px_10px_rgba(0,255,255,0.5)] uppercase">Quaternion Humanoid Sculpture</h1>
        <p class="text-xs text-gray-400 tracking-wider mt-1">Pure Quaternion Kinematics &bull; Drag to Rotate &bull; Scroll to Zoom</p>
    </div>

    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene, Camera & Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.025);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.1, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;

        // 3. Lighting & Neon Rim Architecture
        const ambientLight = new THREE.AmbientLight(0x0a1128, 2.0);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0x00ffff, 2.5);
        keyLight.position.set(4, 8, 5);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xff00aa, 2.0);
        fillLight.position.set(-5, 4, -4);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0x00ffcc, 4, 15);
        rimLight.position.set(0, 0.5, 3);
        scene.add(rimLight);

        // 4. Stylized Floor Pedestal & Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x00ffff, 0x112233);
        gridHelper.position.y = -0.8;
        scene.add(gridHelper);

        const podiumGeo = new THREE.CylinderGeometry(1.8, 2.0, 0.1, 64);
        const podiumMat = new THREE.MeshStandardMaterial({
            color: 0x050510,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x001122
        });
        const podium = new THREE.Mesh(podiumGeo, podiumMat);
        podium.position.y = -0.85;
        podium.receiveShadow = true;
        scene.add(podium);

        // Podium glowing ring
        const ringGeo = new THREE.RingGeometry(1.5, 1.55, 64);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
        const podiumRing = new THREE.Mesh(ringGeo, ringMat);
        podiumRing.position.y = -0.79;
        scene.add(podiumRing);

        // 5. Materials (Frosted Glass, Polished Gold, Neon Cyan)
        const matGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.05,
            roughness: 0.1,
            transmission: 0.92,
            thickness: 1.2,
            transparent: true,
            opacity: 0.85
        });

        const matGold = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.95,
            roughness: 0.15
        });

        const matNeon = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            emissive: 0x004433,
            roughness: 0.2,
            metalness: 0.8
        });

        // 6. Anatomical Humanoid Skeletal Architecture via Pure Quaternions
        const humanoidGroup = new THREE.Group();
        scene.add(humanoidGroup);

        // Precise human body joint coordinate definitions (Bones)
        const skeletalBones = [
            // Spine & Torso Core (Pelvis to Chest)
            { start: new THREE.Vector3(0, -0.6, 0), end: new THREE.Vector3(0, 1.6, 0), count: 24, thickness: 0.42, taper: t => Math.sin(t * Math.PI) * 0.3 + 0.35 },
            
            // Left Arm (Shoulder -> Elbow -> Wrist -> Hand)
            { start: new THREE.Vector3(0, 1.45, 0), end: new THREE.Vector3(-0.85, 0.85, 0), count: 12, thickness: 0.18, taper: t => 1 - t * 0.3 },
            { start: new THREE.Vector3(-0.85, 0.85, 0), end: new THREE.Vector3(-1.3, 0.2, 0.05), count: 10, thickness: 0.14, taper: t => 0.7 - t * 0.4 },
            
            // Right Arm (Shoulder -> Elbow -> Wrist -> Hand)
            { start: new THREE.Vector3(0, 1.45, 0), end: new THREE.Vector3(0.85, 0.85, 0), count: 12, thickness: 0.18, taper: t => 1 - t * 0.3 },
            { start: new THREE.Vector3(0.85, 0.85, 0), end: new THREE.Vector3(1.3, 0.2, 0.05), count: 10, thickness: 0.14, taper: t => 0.7 - t * 0.4 },

            // Left Leg (Hip -> Knee -> Ankle -> Foot)
            { start: new THREE.Vector3(-0.22, -0.6, 0), end: new THREE.Vector3(-0.28, -1.3, 0), count: 12, thickness: 0.25, taper: t => 1 - t * 0.2 },
            { start: new THREE.Vector3(-0.28, -1.3, 0), end: new THREE.Vector3(-0.3, -2.0, 0.1), count: 10, thickness: 0.18, taper: t => 0.8 - t * 0.5 },

            // Right Leg (Hip -> Knee -> Ankle -> Foot)
            { start: new THREE.Vector3(0.22, -0.6, 0), end: new THREE.Vector3(0.28, -1.3, 0), count: 12, thickness: 0.25, taper: t => 1 - t * 0.2 },
            { start: new THREE.Vector3(0.28, -1.3, 0), end: new THREE.Vector3(0.3, -2.0, 0.1), count: 10, thickness: 0.18, taper: t => 0.8 - t * 0.5 }
        ];

        const torusGeometry = new THREE.TorusGeometry(1, 0.04, 16, 50);
        const sculpturalElements = [];

        skeletalBones.forEach((bone, boneIndex) => {
            for (let i = 0; i < bone.count; i++) {
                const t = i / bone.count;

                // 1. Interpolate base position along the anatomical bone segment
                const bonePosition = new THREE.Vector3().lerpVectors(bone.start, bone.end, t);

                // 2. Pure Quaternion Rotation Generation & Non-Commutative Chaining
                const qRotationA = new THREE.Quaternion();
                qRotationA.setFromAxisAngle(new THREE.Vector3(0, 1, 0), t * Math.PI * 6 + boneIndex);

                const qRotationB = new THREE.Quaternion();
                qRotationB.setFromAxisAngle(new THREE.Vector3(1, 0, 0), t * Math.PI * 3);

                const jointQuaternion = new THREE.Quaternion();
                jointQuaternion.multiplyQuaternions(qRotationA, qRotationB);

                // 3. Quaternion Vector Conjugation for Local Offset Mapping
                const radiusProfile = bone.thickness * bone.taper(t);
                const localOffset = new THREE.Vector3(
                    Math.cos(t * Math.PI * 8) * radiusProfile,
                    0,
                    Math.sin(t * Math.PI * 8) * radiusProfile
                );
                localOffset.applyQuaternion(jointQuaternion); // Sandwich product: q * v * q^-1

                const finalPosition = bonePosition.clone().add(localOffset);

                // Cyclical Material Selection (Glass, Gold, Neon)
                let activeMat = (i % 3 === 0) ? matGlass : ((i % 3 === 1) ? matGold : matNeon);

                const mesh = new THREE.Mesh(torusGeometry, activeMat);
                mesh.position.copy(finalPosition);
                mesh.quaternion.copy(jointQuaternion);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                // Scale elements based on anatomical profile
                const scaleVal = radiusProfile * 0.9;
                mesh.scale.set(scaleVal, scaleVal, scaleVal);

                humanoidGroup.add(mesh);
                sculpturalElements.push({
                    mesh,
                    initialQ: jointQuaternion.clone(),
                    boneIndex,
                    elementIndex: i
                });
            }
        });

        // 7. Majestic Head Sculpture (Polyhedral Quaternion Cluster)
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 1.85, 0);
        humanoidGroup.add(headGroup);

        const headGeo = new THREE.IcosahedronGeometry(0.28, 0);
        const headNodesCount = 16;
        for (let i = 0; i < headNodesCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / headNodesCount);
            const theta = Math.sqrt(headNodesCount * Math.PI) * phi;

            // Positioning via pure quaternion vector rotation
            const qNode = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), theta);
            const posNode = new THREE.Vector3(0, 0, 0.22).applyQuaternion(qNode);

            const headNodeMesh = new THREE.Mesh(headGeo, i % 2 === 0 ? matGold : matGlass);
            headNodeMesh.position.copy(posNode);
            headNodeMesh.quaternion.copy(qNode);
            headNodeMesh.scale.set(0.35, 0.35, 0.35);
            headGroup.add(headNodeMesh);
        }

        // 8. Cosmic Background Particle Atmosphere
        const starCount = 600;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 30;
            starPositions[i + 1] = Math.random() * 15 - 2;
            starPositions[i + 2] = (Math.random() - 0.5) * 30;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x00ffff,
            transparent: true,
            opacity: 0.6
        });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // 9. Window Resizing Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 10. Animation Loop Driven by Quaternion Evolution
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Animate sculpture rings organically using dynamic quaternion transformations
            sculpturalElements.forEach((item) => {
                const { mesh, initialQ, boneIndex, elementIndex } = item;
                const timeFactor = elapsedTime * 0.6 + elementIndex * 0.08;

                const dynamicQ = new THREE.Quaternion();
                dynamicQ.setFromAxisAngle(
                    new THREE.Vector3(Math.sin(boneIndex), Math.cos(elementIndex), 1).normalize(),
                    Math.sin(timeFactor) * 0.35
                );

                const currentQ = new THREE.Quaternion();
                currentQ.multiplyQuaternions(initialQ, dynamicQ);
                mesh.quaternion.copy(currentQ);
            });

            headGroup.rotation.y = elapsedTime * 0.25;
            starField.rotation.y = elapsedTime * 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
