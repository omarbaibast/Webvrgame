<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Human Quaternion Sculpture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010103;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #ui-overlay {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(255, 0, 170, 0.4);
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1 class="text-2xl font-black tracking-[0.2em] text-cyan-300 glow-text uppercase">Quaternion Humanoid</h1>
        <p class="text-xs text-gray-400 tracking-widest mt-1 uppercase font-medium">Pure Quaternion Kinematics &bull; Cinematic Bloom &bull; Interactive Orbit</p>
    </div>

    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.02);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.4,  // strength
            0.4,  // radius
            0.15  // threshold
        );

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.target.set(0, 1.1, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.35;

        const ambientLight = new THREE.AmbientLight(0x050b1a, 2.0);
        scene.add(ambientLight);

        // Key Light (Cyan)
        const keyLight = new THREE.DirectionalLight(0x00ffff, 3.5);
        keyLight.position.set(5, 9, 6);
        keyLight.castShadow = true;
        scene.add(keyLight);

        // Rim Light (Magenta/Pink)
        const rimLight = new THREE.DirectionalLight(0xff00aa, 3.0);
        rimLight.position.set(-6, 4, -5);
        scene.add(rimLight);

        // Ground Bounce Point Light
        const groundLight = new THREE.PointLight(0x00f0ff, 4, 12);
        groundLight.position.set(0, -0.5, 0);
        scene.add(groundLight);

        // Reflective Podium & Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x00ffff, 0x0a1628);
        gridHelper.position.y = -0.9;
        scene.add(gridHelper);

        const baseGeo = new THREE.CylinderGeometry(2.2, 2.5, 0.12, 64);
        const baseMat = new THREE.MeshStandardMaterial({
            color: 0x020208,
            metalness: 0.95,
            roughness: 0.1,
            emissive: 0x001122
        });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = -0.96;
        baseMesh.receiveShadow = true;
        scene.add(baseMesh);

        const baseRingGeo = new THREE.RingGeometry(1.8, 1.85, 64);
        baseRingGeo.rotateX(-Math.PI / 2);
        const baseRingMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
        const baseRing = new THREE.Mesh(baseRingGeo, baseRingMat);
        baseRing.position.y = -0.89;
        scene.add(baseRing);

        const matGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.05,
            roughness: 0.08,
            transmission: 0.95,
            thickness: 1.5,
            transparent: true,
            opacity: 0.9,
            ior: 1.5
        });

        const matGold = new THREE.MeshStandardMaterial({
            color: 0xf3ba2f,
            metalness: 0.96,
            roughness: 0.12,
            emissive: 0x3d2800,
            emissiveIntensity: 0.3
        });

        const matNeon = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            emissive: 0x00aa88,
            emissiveIntensity: 2.5,
            roughness: 0.15,
            metalness: 0.9
        });

        const matMagenta = new THREE.MeshStandardMaterial({
            color: 0xff00aa,
            emissive: 0xaa0066,
            emissiveIntensity: 2.5,
            roughness: 0.15,
            metalness: 0.9
        });

        const humanoidGroup = new THREE.Group();
        scene.add(humanoidGroup);

        // Highly detailed anatomical bone segments with smooth volumetric profiles
        const bodyBones = [
            // Spine S-Curve Core
            { start: new THREE.Vector3(0, -0.7, 0), end: new THREE.Vector3(0, 1.65, 0), count: 32, thickness: 0.38, taper: t => Math.sin(t * Math.PI) * 0.28 + 0.32 },
            
            // Ribcage Helix Cage
            { start: new THREE.Vector3(0, 0.6, 0), end: new THREE.Vector3(0, 1.4, 0), count: 18, thickness: 0.52, taper: t => Math.sin(t * Math.PI) * 0.45 + 0.25 },

            // Left Arm (Shoulder -> Bicep -> Elbow -> Forearm -> Wrist -> Hand)
            { start: new THREE.Vector3(0, 1.5, 0), end: new THREE.Vector3(-0.9, 0.85, 0.05), count: 14, thickness: 0.18, taper: t => 1 - t * 0.35 },
            { start: new THREE.Vector3(-0.9, 0.85, 0.05), end: new THREE.Vector3(-1.35, 0.15, 0.1), count: 12, thickness: 0.14, taper: t => 0.7 - t * 0.4 },

            // Right Arm (Shoulder -> Bicep -> Elbow -> Forearm -> Wrist -> Hand)
            { start: new THREE.Vector3(0, 1.5, 0), end: new THREE.Vector3(0.9, 0.85, 0.05), count: 14, thickness: 0.18, taper: t => 1 - t * 0.35 },
            { start: new THREE.Vector3(0.9, 0.85, 0.05), end: new THREE.Vector3(1.35, 0.15, 0.1), count: 12, thickness: 0.14, taper: t => 0.7 - t * 0.4 },

            // Left Leg (Hip -> Thigh -> Knee -> Shin -> Ankle)
            { start: new THREE.Vector3(-0.22, -0.7, 0), end: new THREE.Vector3(-0.3, -1.35, 0.05), count: 14, thickness: 0.26, taper: t => 1 - t * 0.25 },
            { start: new THREE.Vector3(-0.3, -1.35, 0.05), end: new THREE.Vector3(-0.32, -2.1, 0.1), count: 12, thickness: 0.2, taper: t => 0.8 - t * 0.45 },

            // Right Leg (Hip -> Thigh -> Knee -> Shin -> Ankle)
            { start: new THREE.Vector3(0.22, -0.7, 0), end: new THREE.Vector3(0.3, -1.35, 0.05), count: 14, thickness: 0.26, taper: t => 1 - t * 0.25 },
            { start: new THREE.Vector3(0.3, -1.35, 0.05), end: new THREE.Vector3(0.32, -2.1, 0.1), count: 12, thickness: 0.2, taper: t => 0.8 - t * 0.45 }
        ];

        const torusGeo = new THREE.TorusGeometry(1, 0.035, 20, 60);
        const sculpturalElements = [];

        bodyBones.forEach((bone, boneIndex) => {
            for (let i = 0; i < bone.count; i++) {
                const t = i / bone.count;

                // 1. Interpolate base position along bone vector
                const bonePos = new THREE.Vector3().lerpVectors(bone.start, bone.end, t);

                // 2. Pure Quaternion Kinematics & Non-Commutative Chaining
                const qA = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), t * Math.PI * 8 + boneIndex * 0.5);
                const qB = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), t * Math.PI * 4);
                
                const jointQuaternion = new THREE.Quaternion();
                jointQuaternion.multiplyQuaternions(qA, qB);

                // 3. Vector Conjugation for Spatial Offset Mapping (sandwich product q * v * q^-1)
                const radiusProfile = bone.thickness * bone.taper(t);
                const localOffset = new THREE.Vector3(
                    Math.cos(t * Math.PI * 10) * radiusProfile,
                    0,
                    Math.sin(t * Math.PI * 10) * radiusProfile
                );
                localOffset.applyQuaternion(jointQuaternion);

                const finalPos = bonePos.clone().add(localOffset);

                // Luxurious Material distribution
                let mat = matGlass;
                if (i % 4 === 1) mat = matGold;
                else if (i % 4 === 2) mat = matNeon;
                else if (i % 4 === 3) mat = matMagenta;

                const mesh = new THREE.Mesh(torusGeo, mat);
                mesh.position.copy(finalPos);
                mesh.quaternion.copy(jointQuaternion);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                const scaleVal = radiusProfile * 0.85;
                mesh.scale.set(scaleVal, scaleVal, scaleVal);

                humanoidGroup.add(mesh);
                sculpturalElements.push({
                    mesh,
                    initialQ: jointQuaternion.clone(),
                    boneIndex,
                    elementIndex: i
                });
            }
        });

        const headGroup = new THREE.Group();
        headGroup.position.set(0, 1.9, 0);
        humanoidGroup.add(headGroup);

        const headGeo = new THREE.IcosahedronGeometry(0.26, 0);
        const headNodesCount = 20;
        for (let i = 0; i < headNodesCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / headNodesCount);
            const theta = Math.sqrt(headNodesCount * Math.PI) * phi;

            const qNode = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), theta);
            const posNode = new THREE.Vector3(0, 0, 0.22).applyQuaternion(qNode);

            let nodeMat = (i % 2 === 0) ? matGold : matNeon;
            const headNode = new THREE.Mesh(headGeo, nodeMat);
            headNode.position.copy(posNode);
            headNode.quaternion.copy(qNode);
            headNode.scale.set(0.3, 0.3, 0.3);
            headGroup.add(headNode);
        }

        // Swirling ambient dust particle atmosphere
        const particleCount = 700;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 25;
            particlePos[i + 1] = Math.random() * 12 - 2;
            particlePos[i + 2] = (Math.random() - 0.5) * 25;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.045,
            color: 0x00ffff,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
        });
        const particleField = new THREE.Points(particleGeo, particleMat);
        scene.add(particleField);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Animate sculptural elements dynamically using quaternion transformations
            sculpturalElements.forEach((item) => {
                const { mesh, initialQ, boneIndex, elementIndex } = item;
                const timeFactor = elapsedTime * 0.5 + elementIndex * 0.06;

                const dynamicQ = new THREE.Quaternion();
                dynamicQ.setFromAxisAngle(
                    new THREE.Vector3(Math.sin(boneIndex), Math.cos(elementIndex), 1).normalize(),
                    Math.sin(timeFactor) * 0.28
                );

                const currentQ = new THREE.Quaternion();
                currentQ.multiplyQuaternions(initialQ, dynamicQ);
                mesh.quaternion.copy(currentQ);
            });

            headGroup.rotation.y = elapsedTime * 0.2;
            particleField.rotation.y = elapsedTime * 0.012;

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
