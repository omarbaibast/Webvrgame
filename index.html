<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Refined Quaternion Bio-Humanoid</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Finer atom geometry for a smoother appearance
        const atomGeometry = new THREE.SphereGeometry(0.06, 16, 16);
        const atomMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x06b6d4, 
            roughness: 0.1, 
            metalness: 0.9,
            emissive: 0x0e7490,
            emissiveIntensity: 0.4
        });

        // Anatomically proportioned body segments (Ellipsoids & Tapered Chains)
        const bodyParts = [
            { name: 'head', count: 60, offset: new THREE.Vector3(0, 2.4, 0), scale: new THREE.Vector3(0.35, 0.45, 0.38) },
            { name: 'neck', count: 20, offset: new THREE.Vector3(0, 1.85, 0), scale: new THREE.Vector3(0.18, 0.25, 0.18) },
            { name: 'chest', count: 150, offset: new THREE.Vector3(0, 1.3, 0), scale: new THREE.Vector3(0.65, 0.5, 0.4) },
            { name: 'pelvis', count: 100, offset: new THREE.Vector3(0, 0.5, 0), scale: new THREE.Vector3(0.55, 0.35, 0.4) },
            // Limbs (Segments for upper and lower arms/legs)
            { name: 'leftUpperArm', count: 40, offset: new THREE.Vector3(-0.8, 1.3, 0), scale: new THREE.Vector3(0.18, 0.4, 0.18) },
            { name: 'leftLowerArm', count: 35, offset: new THREE.Vector3(-0.8, 0.7, 0), scale: new THREE.Vector3(0.15, 0.38, 0.15) },
            { name: 'rightUpperArm', count: 40, offset: new THREE.Vector3(0.8, 1.3, 0), scale: new THREE.Vector3(0.18, 0.4, 0.18) },
            { name: 'rightLowerArm', count: 35, offset: new THREE.Vector3(0.8, 0.7, 0), scale: new THREE.Vector3(0.15, 0.38, 0.15) },
            { name: 'leftUpperLeg', count: 50, offset: new THREE.Vector3(-0.3, -0.1, 0), scale: new THREE.Vector3(0.22, 0.5, 0.22) },
            { name: 'leftLowerLeg', count: 45, offset: new THREE.Vector3(-0.3, -0.8, 0), scale: new THREE.Vector3(0.18, 0.48, 0.18) },
            { name: 'rightUpperLeg', count: 50, offset: new THREE.Vector3(0.3, -0.1, 0), scale: new THREE.Vector3(0.22, 0.5, 0.22) },
            { name: 'rightLowerLeg', count: 45, offset: new THREE.Vector3(0.3, -0.8, 0), scale: new THREE.Vector3(0.18, 0.48, 0.18) }
        ];

        const totalAtoms = bodyParts.reduce((sum, part) => sum + part.count, 0);
        const instancedMesh = new THREE.InstancedMesh(atomGeometry, atomMaterial, totalAtoms);
        scene.add(instancedMesh);

        const atomMetaData = [];
        const dummy = new THREE.Object3D();

        bodyParts.forEach(part => {
            for (let i = 0; i < part.count; i++) {
                // Distribute points inside an ellipsoid unit volume
                const u = Math.random() * Math.PI * 2;
                const v = Math.acos(Math.random() * 2 - 1);
                const r = Math.cbrt(Math.random()); // Even volumetric distribution

                const localPos = new THREE.Vector3(
                    r * Math.sin(v) * Math.cos(u) * part.scale.x + part.offset.x,
                    r * Math.sin(v) * Math.sin(u) * part.scale.y + part.offset.y,
                    r * Math.cos(v) * part.scale.z + part.offset.z
                );

                // Polar quaternion generation using local coordinates
                const theta = Math.PI * 0.3;
                const q = new THREE.Quaternion(
                    localPos.x * Math.sin(theta), 
                    localPos.y * Math.sin(theta), 
                    localPos.z * Math.sin(theta), 
                    Math.cos(theta)
                );

                atomMetaData.push({
                    partName: part.name,
                    basePos: localPos,
                    quaternion: q,
                    phase: Math.random() * Math.PI * 2
                });
            }
        });

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        camera.position.set(0, 1.0, 5.0);

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.0015;

            // Smooth articulation rotations
            const armRot = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.sin(t) * 0.4);
            const legRot = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.sin(t) * 0.4);
            const torsoRot = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(t * 0.5) * 0.15);

            atomMetaData.forEach((atom, idx) => {
                let currentPos = atom.basePos.clone();

                // Joint hierarchy application
                if (atom.partName.includes('Arm')) {
                    const shoulder = new THREE.Vector3(atom.partName.includes('left') ? -0.8 : 0.8, 1.5, 0);
                    currentPos.sub(shoulder);
                    currentPos.applyQuaternion(armRot);
                    currentPos.add(shoulder);
                } else if (atom.partName.includes('Leg')) {
                    const hip = new THREE.Vector3(atom.partName.includes('left') ? -0.3 : 0.3, 0.2, 0);
                    currentPos.sub(hip);
                    currentPos.applyQuaternion(legRot);
                    currentPos.add(hip);
                } else if (atom.partName === 'chest' || atom.partName === 'neck' || atom.partName === 'head') {
                    currentPos.y -= 0.5;
                    currentPos.applyQuaternion(torsoRot);
                    currentPos.y += 0.5;
                }

                // Organic breathing micro-pulse
                const pulse = Math.sin(t * 3 + atom.phase) * 0.015;
                currentPos.addScalar(pulse);

                dummy.position.copy(currentPos);
                dummy.quaternion.copy(atom.quaternion);
                dummy.scale.set(1, 1, 1);

                dummy.updateMatrix();
                instancedMesh.setMatrixAt(idx, dummy.matrix);
            });

            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.rotation.y = t * 0.2; // Slow rotation to view all angles

            renderer.render(scene, camera);
        }

        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
