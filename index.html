<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voxel Morphing Embodiment Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117;
            font-family: monospace;
            color: #00ffcc;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(13, 17, 23, 0.85);
            padding: 15px 20px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            max-width: 300px;
        }
        h1 { margin: 0 0 10px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .stat { margin: 5px 0; font-size: 13px; color: #a5d6ff; }
        .highlight { color: #ff7b72; font-weight: bold; }
        .controls { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        button {
            background: #21262d;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }
        button:hover { background: #00ffcc; color: #0d1117; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>AI Embodiment Core</h1>
        <div class="stat">Current Mindset: <span id="form-label" class="highlight">Initializing...</span></div>
        <div class="stat">Voxel Mass: <span id="voxel-count">0</span> units</div>
        <div class="stat">State Intention: <span id="ai-thought">Processing...</span></div>
        <div class="controls">
            <button onclick="triggerMorph('robot')">Form: Robot</button>
            <button onclick="triggerMorph('vehicle')">Form: Vehicle</button>
            <button onclick="triggerMorph('building')">Form: Building</button>
            <button onclick="triggerMorph('animal')">Form: Animal</button>
        </div>
    </div>

    <script>
        // --- 3D Scene Initialization ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);
        scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Lighting & Ground Grid ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(100, 50, 0x00ffcc, 0x21262d);
        scene.add(gridHelper);

        // --- Voxel Engine Setup ---
        const boxGeometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
        const voxelGroup = new THREE.Group();
        scene.add(voxelGroup);

        // Pre-allocated Voxel Pool for zero-garbage-collection morphing
        const MAX_VOXELS = 250;
        const voxelPool = [];
        for (let i = 0; i < MAX_VOXELS; i++) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3 });
            const mesh = new THREE.Mesh(boxGeometry, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.visible = false;
            voxelGroup.add(mesh);
            voxelPool.push({
                mesh: mesh,
                targetPos: new THREE.Vector3(),
                targetColor: new THREE.Color(0x00ffcc),
                active: false
            });
        }

        // --- Core Voxel Presets (Offset Coordinates relative to root) ---
        const FORM_SCHEMATICS = {
            robot: {
                label: "Autonomous Bipedal Unit",
                thought: "Perceiving spatial reach. Scanning vertical axis.",
                color: 0x00ffcc,
                voxels: (function() {
                    let pts = [];
                    // Legs
                    for(let y=0; y<4; y++) { pts.push([-1, y, 0]); pts.push([1, y, 0]); }
                    // Torso
                    for(let y=4; y<9; y++) { for(let x=-2; x<=2; x++) { pts.push([x, y, 0]); pts.push([x, y, 1]); } }
                    // Head
                    for(let y=9; y<=11; y++) { for(let x=-1; x<=1; x++) { pts.push([x, y, 0]); pts.push([x, y, 1]); } }
                    // Arms
                    for(let y=4; y<=8; y++) { pts.push([-3, y, 0]); pts.push([3, y, 0]); }
                    return pts;
                })()
            },
            vehicle: {
                label: "High-Speed Recon Vehicle",
                thought: "Optimizing ground traction. Calculating velocity vectors.",
                color: 0xffaa00,
                voxels: (function() {
                    let pts = [];
                    // Chassis Base
                    for(let x=-3; x<=3; x++) { for(let z=-2; z<=2; z++) { pts.push([x, 1, z]); pts.push([x, 2, z]); } }
                    // Cockpit
                    for(let x=-1; x<=1; x++) { for(let z=-1; z<=1; z++) { pts.push([x, 3, z]); } }
                    // Wheels
                    [[-3,-2], [3,-2], [-3,2], [3,2]].forEach(([wx, wz]) => {
                        pts.push([wx, 0, wz]); pts.push([wx, 1, wz+ (wz > 0 ? 1 : -1)]);
                    });
                    return pts;
                })()
            },
            building: {
                label: "Static Voxel Core Fortress",
                thought: "Anchoring structural grid. Establishing stationary baseline.",
                color: 0xff0055,
                voxels: (function() {
                    let pts = [];
                    // Hollow Tower Base
                    for(let y=0; y<14; y++) {
                        for(let x=-2; x<=2; x++) {
                            for(let z=-2; z<=2; z++) {
                                if(Math.abs(x) === 2 || Math.abs(z) === 2 || y > 11) pts.push([x, y, z]);
                            }
                        }
                    }
                    return pts;
                })()
            },
            animal: {
                label: "Quadrupedal Biomechanical Unit",
                thought: "Simulating low-center kinetic balance. Quadruped stride active.",
                color: 0x00ff66,
                voxels: (function() {
                    let pts = [];
                    // 4 Legs
                    [[-2,-1], [2,-1], [-2,1], [2,1]].forEach(([lx, lz]) => {
                        for(let y=0; y<3; y++) pts.push([lx, y, lz]);
                    });
                    // Spine Body
                    for(let x=-3; x<=3; x++) { for(let z=-1; z<=1; z++) { pts.push([x, 3, z]); pts.push([x, 4, z]); } }
                    // Head & Tail
                    pts.push([4, 5, 0]); pts.push([4, 6, 0]); pts.push([5, 6, 0]); // Head
                    pts.push([-4, 5, 0]); pts.push([-5, 6, 0]); // Tail
                    return pts;
                })()
            }
        };

        // --- AI State Machine ---
        let currentFormKey = 'robot';
        let stateTimer = 0;
        const AUTO_SWITCH_INTERVAL = 400; // Frames before AI changes its mind (~6-7s)

        function triggerMorph(formKey) {
            if (!FORM_SCHEMATICS[formKey]) return;
            currentFormKey = formKey;
            const schematic = FORM_SCHEMATICS[formKey];

            document.getElementById('form-label').innerText = schematic.label;
            document.getElementById('form-label').style.color = '#' + schematic.color.toString(16);
            document.getElementById('ai-thought').innerText = schematic.thought;
            document.getElementById('voxel-count').innerText = schematic.voxels.length;

            // Map target positions onto the pool
            for (let i = 0; i < MAX_VOXELS; i++) {
                if (i < schematic.voxels.length) {
                    const [x, y, z] = schematic.voxels[i];
                    voxelPool[i].targetPos.set(x, y, z);
                    voxelPool[i].targetColor.setHex(schematic.color);
                    voxelPool[i].active = true;
                    voxelPool[i].mesh.visible = true;
                } else {
                    voxelPool[i].active = false;
                }
            }
        }

        // Initialize first state
        triggerMorph('robot');

        // --- Main Render & Dynamics Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            controls.update();

            // 1. Lerp Voxels to Target Positions (Morphing Animation)
            for (let i = 0; i < MAX_VOXELS; i++) {
                const item = voxelPool[i];
                if (item.active) {
                    item.mesh.position.lerp(item.targetPos, 0.1);
                    item.mesh.material.color.lerp(item.targetColor, 0.05);
                } else if (item.mesh.visible) {
                    // Shrink unused voxels down before hiding
                    item.mesh.scale.lerp(new THREE.Vector3(0, 0, 0), 0.15);
                    if (item.mesh.scale.x < 0.05) {
                        item.mesh.visible = false;
                        item.mesh.scale.set(1, 1, 1);
                    }
                }
            }

            // 2. Form-Specific Behavior Dynamics (AI physical expression)
            if (currentFormKey === 'robot') {
                // Bobbing gait / vertical breathing
                voxelGroup.position.y = Math.sin(time * 3) * 0.4;
                voxelGroup.rotation.y = Math.sin(time * 0.5) * 0.2;
                voxelGroup.position.x = 0;
                voxelGroup.position.z = 0;
            } else if (currentFormKey === 'vehicle') {
                // Driving in a fast circular path
                voxelGroup.position.x = Math.cos(time * 1.5) * 12;
                voxelGroup.position.z = Math.sin(time * 1.5) * 12;
                voxelGroup.position.y = 0.2 + Math.random() * 0.05; // Road vibration
                voxelGroup.rotation.y = - (time * 1.5) + Math.PI / 2;
            } else if (currentFormKey === 'building') {
                // Stationary lock with subtle breathing energy pulse
                voxelGroup.position.set(0, 0, 0);
                voxelGroup.rotation.y = 0;
            } else if (currentFormKey === 'animal') {
                // Prowling / trotting motion
                voxelGroup.position.x = Math.sin(time) * 5;
                voxelGroup.position.z = Math.cos(time) * 5;
                voxelGroup.position.y = Math.abs(Math.sin(time * 6)) * 0.5; // Bounds
                voxelGroup.rotation.y = Math.atan2(Math.cos(time), -Math.sin(time));
            }

            // 3. Autonomous AI Mind Cycle
            stateTimer++;
            if (stateTimer > AUTO_SWITCH_INTERVAL) {
                stateTimer = 0;
                const forms = Object.keys(FORM_SCHEMATICS);
                const nextForm = forms[(forms.indexOf(currentFormKey) + 1) % forms.length];
                triggerMorph(nextForm);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
