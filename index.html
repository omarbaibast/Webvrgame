<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Quaternion Sculpture - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030305;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="info">Human Quaternion Sculpture &bull; Pure Quaternion Kinematics</div>

    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene, Camera & Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.2, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // 3. Lighting Architecture
        const ambientLight = new THREE.AmbientLight(0x112233, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f0ff, 2.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLightPink = new THREE.PointLight(0xff00aa, 3, 10);
        pointLightPink.position.set(-3, 1.5, -2);
        scene.add(pointLightPink);

        const pointLightCyan = new THREE.PointLight(0x00ffcc, 3, 10);
        pointLightCyan.position.set(3, 1.5, 2);
        scene.add(pointLightCyan);

        // 4. Materials (Glass, Gold, Neon)
        const matGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 1.0,
            transparent: true,
            opacity: 0.8
        });

        const matGold = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.9,
            roughness: 0.2
        });

        const matNeon = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            emissive: 0x004433,
            roughness: 0.2,
            metalness: 0.8
        });

        // 5. Humanoid Skeletal Construction via Pure Quaternions
        const humanGroup = new THREE.Group();
        scene.add(humanGroup);

        // Define anatomical skeletal chain segments (Start -> End coordinates)
        const bodyBones = [
            // Spine / Torso
            { start: new THREE.Vector3(0, 0.2, 0), end: new THREE.Vector3(0, 2.0, 0), count: 18, radius: 0.4 },
            // Left Arm
            { start: new THREE.Vector3(0, 1.8, 0), end: new THREE.Vector3(-0.9, 1.1, 0), count: 10, radius: 0.2 },
            { start: new THREE.Vector3(-0.9, 1.1, 0), end: new THREE.Vector3(-1.4, 0.4, 0.1), count: 8, radius: 0.15 },
            // Right Arm
            { start: new THREE.Vector3(0, 1.8, 0), end: new THREE.Vector3(0.9, 1.1, 0), count: 10, radius: 0.2 },
            { start: new THREE.Vector3(0.9, 1.1, 0), end: new THREE.Vector3(1.4, 0.4, 0.1), count: 8, radius: 0.15 },
            // Left Leg
            { start: new THREE.Vector3(-0.2, 0.3, 0), end: new THREE.Vector3(-0.3, -0.8, 0), count: 10, radius: 0.22 },
            { start: new THREE.Vector3(-0.3, -0.8, 0), end: new THREE.Vector3(-0.35, -1.8, 0), count: 10, radius: 0.18 },
            // Right Leg
            { start: new THREE.Vector3(0.2, 0.3, 0), end: new THREE.Vector3(0.3, -0.8, 0), count: 10, radius: 0.22 },
            { start: new THREE.Vector3(0.3, -0.8, 0), end: new THREE.Vector3(0.35, -1.8, 0), count: 10, radius: 0.18 }
        ];

        const ringGeometry = new THREE.TorusGeometry(1, 0.04, 16, 60);
        const structureElements = [];

        // Base quaternion generator for global orientation twist
        const globalOrientationQ = new THREE.Quaternion();

        bodyBones.forEach((bone, boneIndex) => {
            for (let i = 0; i < bone.count; i++) {
                const t = i / bone.count;

                // --- PURE QUATERNION POSITIONING & ORIENTATION MATH ---
                // 1. Interpolate base position along the skeletal bone segment
                const basePosition = new THREE.Vector3().lerpVectors(bone.start, bone.end, t);

                // 2. Generate sequential joint rotation quaternions
                const qRotationA = new THREE.Quaternion();
                qRotationA.setFromAxisAngle(new THREE.Vector3(0, 1, 0), t * Math.PI * 4 + boneIndex);

                const qRotationB = new THREE.Quaternion();
                qRotationB.setFromAxisAngle(new THREE.Vector3(1, 0, 0), t * Math.PI * 2);

                // 3. Chain rotations non-commutatively using quaternion multiplication
                const jointQuaternion = new THREE.Quaternion();
                jointQuaternion.multiplyQuaternions(qRotationA, qRotationB);

                // 4. Apply quaternion rotation to a local offset vector (Quaternion Vector Conjugation)
                const localOffset = new THREE.Vector3(Math.cos(t * Math.PI * 6) * bone.radius * (1 - t*0.3), 0, Math.sin(t * Math.PI * 6) * bone.radius * (1 - t*0.3));
                localOffset.applyQuaternion(jointQuaternion); // Equivalent to q * v * q^-1

                const finalPosition = basePosition.clone().add(localOffset);

                // Select sculptural material cyclically (Glass, Gold, Neon)
                let mat = (i % 3 === 0) ? matGlass : ((i % 3 === 1) ? matGold : matNeon);

                const mesh = new THREE.Mesh(ringGeometry, mat);
                mesh.position.copy(finalPosition);
                mesh.quaternion.copy(jointQuaternion);

                // Scale elements based on anatomical profiling
                const scale = (0.3 + 0.2 * Math.sin(t * Math.PI)) * (1.2 - t * 0.4);
                mesh.scale.set(scale, scale, scale);

                humanGroup.add(mesh);
                structureElements.push({ mesh, initialQ: jointQuaternion.clone(), basePos: basePosition, offset: localOffset, index: i });
            }
        });

        // Head Sculpture (Polyhedral Quaternion Cluster)
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 2.2, 0);
        humanGroup.add(headGroup);

        const headGeo = new THREE.IcosahedronGeometry(0.3, 0);
        for (let i = 0; i < 12; i++) {
            const phi = Math.acos(-1 + (2 * i) / 12);
            const theta = Math.sqrt(12 * Math.PI) * phi;

            // Generate positions strictly using quaternion vector rotation
            const qNode = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), theta);
            const pos = new THREE.Vector3(0, 0, 0.35).applyQuaternion(qNode);

            const headNode = new THREE.Mesh(headGeo, i % 2 === 0 ? matGold : matGlass);
            headNode.position.copy(pos);
            headNode.quaternion.copy(qNode);
            headNode.scale.set(0.4, 0.4, 0.4);
            headGroup.add(headNode);
        }

        // 6. Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Animation Loop (Quaternion Dynamic Evolution)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Animate sculpture components dynamically using quaternion increments
            structureElements.forEach((item) => {
                const { mesh, initialQ, index } = item;
                const timeFactor = elapsedTime * 0.5 + index * 0.1;

                // Create a dynamic breathing/twisting quaternion offset
                const dynamicQ = new THREE.Quaternion();
                dynamicQ.setFromAxisAngle(
                    new THREE.Vector3(Math.sin(index), Math.cos(index), 1).normalize(),
                    Math.sin(timeFactor) * 0.3
                );

                // Multiply initial joint quaternion with dynamic quaternion
                const currentQ = new THREE.Quaternion();
                currentQ.multiplyQuaternions(initialQ, dynamicQ);
                mesh.quaternion.copy(currentQ);
            });

            headGroup.rotation.y = elapsedTime * 0.3;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
