<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quaternion Sculpture</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: Arial;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            z-index: 10;
            top: 10px;
            left: 10px;
            width: 250px;
            padding: 15px;

            background: rgba(0,0,0,0.75);
            color: white;

            border-radius: 12px;
        }

        #ui h2 {
            margin-top: 0;
        }

        .control {
            margin: 15px 0;
        }

        input {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 0;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div id="ui">

    <h2>Quaternion Sculpture</h2>

    <div class="control">
        Rotation
        <input id="rotation"
               type="range"
               min="0"
               max="8"
               step="0.01"
               value="2.5">
    </div>

    <div class="control">
        Deformation
        <input id="deformation"
               type="range"
               min="0"
               max="1.5"
               step="0.01"
               value="0.4">
    </div>

    <div class="control">
        Frequency
        <input id="frequency"
               type="range"
               min="1"
               max="12"
               step="1"
               value="5">
    </div>

    <div class="control">
        Twist
        <input id="twist"
               type="range"
               min="-8"
               max="8"
               step="0.01"
               value="2">
    </div>

    <button id="random">
        Random Sculpture
    </button>

    <button id="sphere">
        Reset Sphere
    </button>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/controls/OrbitControls.js"></script>


<script>

console.log("Starting Quaternion Sculpture");


// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x050509);


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    0,
    4
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// CONTROLS
// =====================================================

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;


// =====================================================
// LIGHT
// =====================================================

const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    3,
    4,
    5
);

scene.add(light);


scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);


// =====================================================
// SPHERE
// =====================================================

const geometry =
    new THREE.SphereGeometry(
        1,
        120,
        120
    );


// Save original sphere

const original =
    geometry.attributes.position.clone();


// =====================================================
// MATERIAL
// =====================================================

const material =
    new THREE.MeshStandardMaterial({

        color: 0x2080ff,

        metalness: 0.5,

        roughness: 0.2,

        side: THREE.DoubleSide
    });


// =====================================================
// SCULPTURE
// =====================================================

const sculpture =
    new THREE.Mesh(
        geometry,
        material
    );

scene.add(sculpture);


// =====================================================
// PARAMETERS
// =====================================================

let rotation =
    2.5;

let deformation =
    0.4;

let frequency =
    5;

let twist =
    2;


// =====================================================
// VECTORS
// =====================================================

const p =
    new THREE.Vector3();

const axis =
    new THREE.Vector3();

const q =
    new THREE.Quaternion();


// =====================================================
// SCULPT
// =====================================================

function sculpt() {

    const positions =
        geometry.attributes.position;


    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        // Original sphere point

        p.fromBufferAttribute(
            original,
            i
        );


        const x = p.x;
        const y = p.y;
        const z = p.z;


        // ---------------------------------------------
        // SPHERICAL COORDINATES
        // ---------------------------------------------

        const theta =
            Math.atan2(z, x);

        const phi =
            Math.acos(
                Math.max(
                    -1,
                    Math.min(
                        1,
                        y
                    )
                )
            );


        // ---------------------------------------------
        // QUATERNION ROTATION ANGLE
        // ---------------------------------------------

        let angle =
            rotation *
            Math.sin(
                frequency * theta
            );


        angle +=
            twist * y;


        // ---------------------------------------------
        // ROTATION AXIS
        // ---------------------------------------------

        axis.set(
            Math.sin(phi) *
            Math.cos(theta),

            Math.cos(phi),

            Math.sin(phi) *
            Math.sin(theta)
        );


        axis.normalize();


        // ---------------------------------------------
        // CREATE QUATERNION
        // ---------------------------------------------

        q.setFromAxisAngle(
            axis,
            angle
        );


        // ---------------------------------------------
        // APPLY QUATERNION
        // ---------------------------------------------

        p.applyQuaternion(q);


        // ---------------------------------------------
        // RADIAL SCULPTING
        // ---------------------------------------------

        const deformationAmount =

            1 +

            deformation *
            Math.sin(
                frequency * theta
            ) *
            Math.sin(
                frequency * phi
            );


        p.multiplyScalar(
            deformationAmount
        );


        // ---------------------------------------------
        // WRITE POSITION
        // ---------------------------------------------

        positions.setXYZ(
            i,
            p.x,
            p.y,
            p.z
        );
    }


    positions.needsUpdate = true;

    geometry.computeVertexNormals();
}


// =====================================================
// SLIDERS
// =====================================================

document.getElementById(
    "rotation"
).oninput = function() {

    rotation =
        Number(this.value);

    sculpt();
};


document.getElementById(
    "deformation"
).oninput = function() {

    deformation =
        Number(this.value);

    sculpt();
};


document.getElementById(
    "frequency"
).oninput = function() {

    frequency =
        Number(this.value);

    sculpt();
};


document.getElementById(
    "twist"
).oninput = function() {

    twist =
        Number(this.value);

    sculpt();
};


// =====================================================
// RANDOM
// =====================================================

document.getElementById(
    "random"
).onclick = function() {

    rotation =
        Math.random() * 7;

    deformation =
        Math.random() * 1.2;

    frequency =
        2 +
        Math.floor(
            Math.random() * 10
        );

    twist =
        -5 +
        Math.random() * 10;


    document.getElementById(
        "rotation"
    ).value = rotation;

    document.getElementById(
        "deformation"
    ).value = deformation;

    document.getElementById(
        "frequency"
    ).value = frequency;

    document.getElementById(
        "twist"
    ).value = twist;


    sculpt();
};


// =====================================================
// RESET
// =====================================================

document.getElementById(
    "sphere"
).onclick = function() {

    rotation = 0;

    deformation = 0;

    twist = 0;

    sculpt();
};


// =====================================================
// INITIAL SCULPTURE
// =====================================================

sculpt();


// =====================================================
// ANIMATION
// =====================================================

function animate() {

    requestAnimationFrame(
        animate
    );

    sculpture.rotation.y +=
        0.003;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


console.log(
    "Quaternion sculpture running"
);

</script>

</body>
</html>
