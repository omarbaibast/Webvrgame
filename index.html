<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Mathematical Human Growth</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050509;
        font-family: Arial, sans-serif;
        color: white;
    }

    #info {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(0,0,0,.65);
        padding: 12px;
        border-radius: 10px;
        max-width: 330px;
    }

    #info h2 {
        margin: 0 0 7px 0;
        font-size: 18px;
    }

    #info p {
        margin: 4px 0;
        font-size: 13px;
        line-height: 1.4;
    }

    #controls {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        background: rgba(0,0,0,.75);
        padding: 12px;
        border-radius: 12px;

        width: min(90vw, 500px);
        box-sizing: border-box;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 7px 0;
    }

    .row label {
        width: 100px;
        font-size: 13px;
    }

    input[type=range] {
        flex: 1;
    }

    button {
        border: none;
        border-radius: 7px;
        padding: 8px 13px;
        margin-right: 5px;
        cursor: pointer;
    }

    #timeValue {
        width: 45px;
        text-align: right;
    }
</style>
</head>

<body>

<div id="info">
    <h2>Mathematical Human Growth</h2>

    <p>
        Start with a single mathematical sphere.
        Growth fields progressively create the head, torso,
        arms and legs.
    </p>

    <p>
        Model:
        <b>sphere → growth fields → human form → smoothing</b>
    </p>

    <p id="stage">Stage: primordial sphere</p>
</div>

<div id="controls">

    <div class="row">
        <label>Growth time</label>

        <input
            id="time"
            type="range"
            min="0"
            max="1"
            step="0.001"
            value="0">

        <span id="timeValue">0.00</span>
    </div>

    <div class="row">
        <label>Symmetry</label>

        <input
            id="symmetry"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1">
    </div>

    <div class="row">
        <label>Smoothing</label>

        <input
            id="smooth"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7">
    </div>

    <div>
        <button id="play">▶ Grow</button>
        <button id="reset">Reset</button>
    </div>

</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { MarchingCubes }
    from "three/addons/objects/MarchingCubes.js";

/* -------------------------------------------------------
   SCENE
------------------------------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 1.0, 7);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


/* -------------------------------------------------------
   LIGHTING
------------------------------------------------------- */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x222233,
    2.2
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(4, 6, 5);

scene.add(light);


/* -------------------------------------------------------
   HUMAN MATERIAL
------------------------------------------------------- */

const material = new THREE.MeshStandardMaterial({
    roughness: 0.55,
    metalness: 0.05
});


/* -------------------------------------------------------
   MARCHING CUBES
------------------------------------------------------- */

const resolution = 48;

const human = new MarchingCubes(
    resolution,
    material,
    true,
    true
);

human.scale.set(2.5, 2.5, 2.5);

human.position.y = 0;

scene.add(human);


/* -------------------------------------------------------
   MATHEMATICAL FUNCTIONS
------------------------------------------------------- */

function sigmoid(x, center, sharpness = 10) {

    return 1 /
        (1 + Math.exp(
            -sharpness * (x - center)
        ));
}


function clamp01(x) {

    return Math.max(
        0,
        Math.min(1, x)
    );
}


/*
    Smooth radial field.

    p = point
    c = center
    r = radius
*/

function blob(p, c, r, strength = 1) {

    const dx = p.x - c.x;
    const dy = p.y - c.y;
    const dz = p.z - c.z;

    const d2 =
        dx * dx +
        dy * dy +
        dz * dz;

    return strength *
        Math.exp(
            -d2 / (r * r)
        );
}


/*
    Capsule-like field.

    This gives us arms and legs.
*/

function capsule(
    p,
    a,
    b,
    radius,
    strength = 1
) {

    const ab = new THREE.Vector3(
        b.x - a.x,
        b.y - a.y,
        b.z - a.z
    );

    const ap = new THREE.Vector3(
        p.x - a.x,
        p.y - a.y,
        p.z - a.z
    );

    const ab2 = ab.lengthSq();

    let t = 0;

    if (ab2 > 0) {

        t =
            ap.dot(ab) /
            ab2;

        t = clamp01(t);
    }

    const closest = new THREE.Vector3(
        a.x + ab.x * t,
        a.y + ab.y * t,
        a.z + ab.z * t
    );

    const dx = p.x - closest.x;
    const dy = p.y - closest.y;
    const dz = p.z - closest.z;

    const d2 =
        dx * dx +
        dy * dy +
        dz * dz;

    return strength *
        Math.exp(
            -d2 / (radius * radius)
        );
}


/* -------------------------------------------------------
   GROWTH FIELD
------------------------------------------------------- */

function calculateField(p, time, symmetry) {

    /*
        Start with a primordial sphere.
    */

    let field =
        blob(
            p,
            new THREE.Vector3(0, 0, 0),
            0.85
        );


    /*
        At time 0 the object is basically
        just a sphere.
    */

    if (time < 0.05) {

        return field;
    }


    /*
        ------------------------------------------------
        TORSO
        ------------------------------------------------
    */

    const torsoGrowth =
        sigmoid(time, 0.15, 14);

    field +=
        blob(
            p,
            new THREE.Vector3(0, 0.15, 0),
            0.70,
            torsoGrowth * 1.7
        );


    field +=
        blob(
            p,
            new THREE.Vector3(0, -0.65, 0),
            0.50,
            torsoGrowth * 1.2
        );


    /*
        ------------------------------------------------
        HEAD
        ------------------------------------------------
    */

    const headGrowth =
        sigmoid(time, 0.35, 14);

    field +=
        blob(
            p,
            new THREE.Vector3(0, 1.05, 0),
            0.38,
            headGrowth * 2.0
        );


    /*
        NECK
    */

    field +=
        capsule(
            p,
            new THREE.Vector3(0, 0.55, 0),
            new THREE.Vector3(0, 0.82, 0),
            0.22,
            headGrowth
        );


    /*
        ------------------------------------------------
        ARMS
        ------------------------------------------------
    */

    const armGrowth =
        sigmoid(time, 0.48, 12);


    let s = symmetry;


    /*
        Left arm
    */

    field +=
        capsule(
            p,
            new THREE.Vector3(-0.48, 0.45, 0),
            new THREE.Vector3(-0.95, -0.05, 0),
            0.20,
            armGrowth * s * 1.6
        );


    field +=
        capsule(
            p,
            new THREE.Vector3(-0.95, -0.05, 0),
            new THREE.Vector3(-1.15, -0.65, 0),
            0.16,
            armGrowth * s * 1.4
        );


    /*
        Right arm
    */

    field +=
        capsule(
            p,
            new THREE.Vector3(0.48, 0.45, 0),
            new THREE.Vector3(0.95, -0.05, 0),
            0.20,
            armGrowth * s * 1.6
        );


    field +=
        capsule(
            p,
            new THREE.Vector3(0.95, -0.05, 0),
            new THREE.Vector3(1.15, -0.65, 0),
            0.16,
            armGrowth * s * 1.4
        );


    /*
        Hands
    */

    field +=
        blob(
            p,
            new THREE.Vector3(-1.15, -0.70, 0),
            0.20,
            armGrowth * s
        );

    field +=
        blob(
            p,
            new THREE.Vector3(1.15, -0.70, 0),
            0.20,
            armGrowth * s
        );


    /*
        ------------------------------------------------
        LEGS
        ------------------------------------------------
    */

    const legGrowth =
        sigmoid(time, 0.58, 12);


    /*
        Left leg
    */

    field +=
        capsule(
            p,
            new THREE.Vector3(-0.25, -0.65, 0),
            new THREE.Vector3(-0.35, -1.35, 0),
            0.25,
            legGrowth * s * 1.8
        );

    field +=
        capsule(
            p,
            new THREE.Vector3(-0.35, -1.35, 0),
            new THREE.Vector3(-0.42, -2.05, 0),
            0.20,
            legGrowth * s * 1.6
        );


    /*
        Right leg
    */

    field +=
        capsule(
            p,
            new THREE.Vector3(0.25, -0.65, 0),
            new THREE.Vector3(0.35, -1.35, 0),
            0.25,
            legGrowth * s * 1.8
        );

    field +=
        capsule(
            p,
            new THREE.Vector3(0.35, -1.35, 0),
            new THREE.Vector3(0.42, -2.05, 0),
            0.20,
            legGrowth * s * 1.6
        );


    /*
        Feet
    */

    field +=
        blob(
            p,
            new THREE.Vector3(-0.48, -2.10, 0.08),
            0.25,
            legGrowth * s
        );

    field +=
        blob(
            p,
            new THREE.Vector3(0.48, -2.10, 0.08),
            0.25,
            legGrowth * s
        );


    /*
        ------------------------------------------------
        SHOULDERS
        ------------------------------------------------
    */

    field +=
        blob(
            p,
            new THREE.Vector3(-0.48, 0.45, 0),
            0.30,
            armGrowth * s
        );

    field +=
        blob(
            p,
            new THREE.Vector3(0.48, 0.45, 0),
            0.30,
            armGrowth * s
        );


    return field;
}


/* -------------------------------------------------------
   UPDATE MESH
------------------------------------------------------- */

function updateHuman(time) {

    const symmetry =
        parseFloat(
            document.getElementById("symmetry").value
        );

    const smoothing =
        parseFloat(
            document.getElementById("smooth").value
        );


    human.reset();


    /*
        Marching Cubes coordinate system:
        roughly -1 to +1.
    */

    for (let x = 0; x < resolution; x++) {

        for (let y = 0; y < resolution; y++) {

            for (let z = 0; z < resolution; z++) {

                const px =
                    (x / (resolution - 1)) * 2 - 1;

                const py =
                    (y / (resolution - 1)) * 2 - 1;

                const pz =
                    (z / (resolution - 1)) * 2 - 1;


                /*
                    Our mathematical coordinate system
                    is stretched vertically.
                */

                const p = new THREE.Vector3(
                    px * 1.25,
                    py * 1.55,
                    pz * 1.05
                );


                let value =
                    calculateField(
                        p,
                        time,
                        symmetry
                    );


                /*
                    "Smoothing" parameter.

                    This is not a numerical Ricci-flow
                    solver. It acts as a field smoothing
                    control.
                */

                value =
                    Math.pow(
                        value,
                        1.0 - smoothing * 0.25
                    );


                human.setCell(
                    x,
                    y,
                    z,
                    value
                );
            }
        }
    }


    /*
        Iso-surface threshold.
    */

    human.isolation = 0.9;

    human.update();


    /*
        Slowly rotate the organism.
    */

    human.rotation.y += 0.002;
}


/* -------------------------------------------------------
   STAGE DESCRIPTION
------------------------------------------------------- */

function updateStage(t) {

    const stage =
        document.getElementById("stage");

    if (t < 0.15) {

        stage.textContent =
            "Stage: primordial sphere";

    } else if (t < 0.35) {

        stage.textContent =
            "Stage: torso emerging";

    } else if (t < 0.48) {

        stage.textContent =
            "Stage: head + neck emerging";

    } else if (t < 0.58) {

        stage.textContent =
            "Stage: arms emerging";

    } else if (t < 0.75) {

        stage.textContent =
            "Stage: legs emerging";

    } else {

        stage.textContent =
            "Stage: human-like mathematical organism";
    }
}


/* -------------------------------------------------------
   CONTROLS
------------------------------------------------------- */

const timeSlider =
    document.getElementById("time");

const timeValue =
    document.getElementById("timeValue");

const playButton =
    document.getElementById("play");

const resetButton =
    document.getElementById("reset");

let playing = false;


timeSlider.addEventListener(
    "input",
    () => {

        const t =
            parseFloat(timeSlider.value);

        timeValue.textContent =
            t.toFixed(2);

        updateStage(t);

        updateHuman(t);
    }
);


playButton.addEventListener(
    "click",
    () => {

        playing = !playing;

        playButton.textContent =
            playing
            ? "⏸ Pause"
            : "▶ Grow";
    }
);


resetButton.addEventListener(
    "click",
    () => {

        playing = false;

        playButton.textContent =
            "▶ Grow";

        timeSlider.value = 0;

        timeValue.textContent =
            "0.00";

        updateStage(0);

        updateHuman(0);
    }
);


/* -------------------------------------------------------
   MOUSE / TOUCH ROTATION
------------------------------------------------------- */

let dragging = false;
let previousX = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        dragging = true;
        previousX = e.clientX;
    }
);

window.addEventListener(
    "pointerup",
    () => {

        dragging = false;
    }
);

window.addEventListener(
    "pointermove",
    e => {

        if (!dragging) return;

        const dx =
            e.clientX - previousX;

        human.rotation.y +=
            dx * 0.01;

        previousX =
            e.clientX;
    }
);


/* -------------------------------------------------------
   ANIMATION
------------------------------------------------------- */

let lastTime = performance.now();

function animate(now) {

    requestAnimationFrame(animate);


    const dt =
        (now - lastTime) / 1000;

    lastTime = now;


    if (playing) {

        let t =
            parseFloat(timeSlider.value);

        t += dt * 0.08;

        if (t >= 1) {

            t = 1;
            playing = false;

            playButton.textContent =
                "▶ Grow";
        }

        timeSlider.value = t;

        timeValue.textContent =
            t.toFixed(2);

        updateStage(t);

        updateHuman(t);
    }


    renderer.render(
        scene,
        camera
    );
}


/* -------------------------------------------------------
   RESIZE
------------------------------------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* -------------------------------------------------------
   START
------------------------------------------------------- */

updateHuman(0);

animate(performance.now());

</script>

</body>
    </html>
