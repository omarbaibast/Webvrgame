<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quaternion Spatial Encryption</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(20,20,20,0.92);
        padding: 15px;
        border-radius: 10px;
        width: 280px;
    }

    h2 {
        margin-top: 0;
        font-size: 19px;
    }

    label {
        display: block;
        margin-top: 7px;
        font-size: 13px;
    }

    input {
        width: 55px;
        margin-right: 4px;
        background: #222;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 5px;
    }

    button {
        margin-top: 10px;
        padding: 8px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    #status {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #aaa;
    }

    #view {
        width: 100%;
        margin-top: 10px;
    }

    #canvas {
        position: fixed;
        inset: 0;
    }
</style>
</head>

<body>

<div id="ui">

    <h2>Quaternion Spatial Encryption</h2>

    <div>
        <b>Quaternion key</b>
    </div>

    <label>
        w:
        <input id="qw" type="number" step="0.01" value="0.9239">
    </label>

    <label>
        x:
        <input id="qx" type="number" step="0.01" value="0">
    </label>

    <label>
        y:
        <input id="qy" type="number" step="0.01" value="0.3827">
    </label>

    <label>
        z:
        <input id="qz" type="number" step="0.01" value="0">
    </label>

    <label>
        Number of points:
        <input id="pointCount" type="number" value="3000" min="100" max="20000">
    </label>

    <button onclick="generateObject()">Generate Object</button>
    <button onclick="encryptObject()">Encrypt</button>
    <button onclick="decryptObject()">Decrypt</button>

    <select id="view" onchange="changeView()">
        <option value="original">Original</option>
        <option value="encrypted">Encrypted</option>
        <option value="decrypted">Decrypted</option>
    </select>

    <div id="status">
        Ready.
    </div>

</div>

<div id="canvas"></div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


// ============================================================
// THREE.JS SETUP
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 7);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

document.getElementById("canvas").appendChild(renderer.domElement);


// ============================================================
// POINT DATA
// ============================================================

let originalPoints = [];
let encryptedPoints = [];
let decryptedPoints = [];

let pointCloud = null;


// ============================================================
// QUATERNION FUNCTIONS
// ============================================================

// Quaternion multiplication
function qMultiply(a, b) {

    return {
        w: a.w*b.w - a.x*b.x - a.y*b.y - a.z*b.z,

        x: a.w*b.x + a.x*b.w + a.y*b.z - a.z*b.y,

        y: a.w*b.y - a.x*b.z + a.y*b.w + a.z*b.x,

        z: a.w*b.z + a.x*b.y - a.y*b.x + a.z*b.w
    };
}


// Quaternion conjugate
function qConjugate(q) {

    return {
        w: q.w,
        x: -q.x,
        y: -q.y,
        z: -q.z
    };
}


// Normalize quaternion
function qNormalize(q) {

    const length = Math.sqrt(
        q.w*q.w +
        q.x*q.x +
        q.y*q.y +
        q.z*q.z
    );

    return {
        w: q.w / length,
        x: q.x / length,
        y: q.y / length,
        z: q.z / length
    };
}


// ============================================================
// QUATERNION ROTATION
// ============================================================

function rotatePoint(point, q) {

    // Pure quaternion representing the point
    const p = {
        w: 0,
        x: point.x,
        y: point.y,
        z: point.z
    };

    const qConj = qConjugate(q);

    // p' = q p q*
    const first = qMultiply(q, p);
    const result = qMultiply(first, qConj);

    return {
        x: result.x,
        y: result.y,
        z: result.z
    };
}


// ============================================================
// GENERATE 3D OBJECT
// ============================================================

function generateObject() {

    const count =
        parseInt(document.getElementById("pointCount").value);

    originalPoints = [];

    /*
        Generate points on the surface of a sphere.

        This gives us a recognizable 3D object
        whose geometry can be observed before
        and after transformation.
    */

    for (let i = 0; i < count; i++) {

        const phi =
            Math.acos(1 - 2 * (i + 0.5) / count);

        const theta =
            Math.PI * (1 + Math.sqrt(5)) * i;

        const radius = 2;

        const x =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        const y =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        const z =
            radius *
            Math.cos(phi);

        originalPoints.push({
            x: x,
            y: y,
            z: z
        });
    }

    encryptedPoints = [];
    decryptedPoints = [];

    updatePointCloud(originalPoints);

    document.getElementById("status").innerHTML =
        "Generated " + count + " points.";
}


// ============================================================
// READ QUATERNION KEY
// ============================================================

function getQuaternion() {

    const q = {

        w: parseFloat(
            document.getElementById("qw").value
        ),

        x: parseFloat(
            document.getElementById("qx").value
        ),

        y: parseFloat(
            document.getElementById("qy").value
        ),

        z: parseFloat(
            document.getElementById("qz").value
        )
    };

    return qNormalize(q);
}


// ============================================================
// ENCRYPT
// ============================================================

function encryptObject() {

    if (originalPoints.length === 0) {

        generateObject();
    }

    const q = getQuaternion();

    encryptedPoints = [];

    for (const p of originalPoints) {

        const encrypted =
            rotatePoint(p, q);

        encryptedPoints.push(encrypted);
    }

    document.getElementById("status").innerHTML =
        "Encrypted using:<br>" +
        "q = (" +
        q.w.toFixed(4) + ", " +
        q.x.toFixed(4) + ", " +
        q.y.toFixed(4) + ", " +
        q.z.toFixed(4) + ")";

    document.getElementById("view").value = "encrypted";

    updatePointCloud(encryptedPoints);
}


// ============================================================
// DECRYPT
// ============================================================

function decryptObject() {

    if (encryptedPoints.length === 0) {

        encryptObject();
    }

    const q = getQuaternion();

    const inverse =
        qConjugate(q);

    decryptedPoints = [];

    for (const p of encryptedPoints) {

        const decrypted =
            rotatePoint(p, inverse);

        decryptedPoints.push(decrypted);
    }

    document.getElementById("status").innerHTML =
        "Decrypted using q*.";

    document.getElementById("view").value =
        "decrypted";

    updatePointCloud(decryptedPoints);
}


// ============================================================
// VIEW SWITCH
// ============================================================

function changeView() {

    const view =
        document.getElementById("view").value;

    if (view === "original") {

        updatePointCloud(originalPoints);

    } else if (view === "encrypted") {

        updatePointCloud(encryptedPoints);

    } else if (view === "decrypted") {

        updatePointCloud(decryptedPoints);
    }
}


// ============================================================
// CREATE / UPDATE POINT CLOUD
// ============================================================

function updatePointCloud(points) {

    if (!points || points.length === 0) {
        return;
    }

    if (pointCloud) {

        scene.remove(pointCloud);

        pointCloud.geometry.dispose();
        pointCloud.material.dispose();
    }

    const positions =
        new Float32Array(points.length * 3);

    for (let i = 0; i < points.length; i++) {

        positions[i * 3 + 0] = points[i].x;

        positions[i * 3 + 1] = points[i].y;

        positions[i * 3 + 2] = points[i].z;
    }

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material =
        new THREE.PointsMaterial({
            size: 0.035
        });

    pointCloud =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(pointCloud);
}


// ============================================================
// ANIMATION
// ============================================================

function animate() {

    requestAnimationFrame(animate);

    if (pointCloud) {

        pointCloud.rotation.y += 0.002;
    }

    renderer.render(
        scene,
        camera
    );
}

animate();


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// Make functions available to HTML buttons
window.generateObject = generateObject;
window.encryptObject = encryptObject;
window.decryptObject = decryptObject;
window.changeView = changeView;


// Generate initial object
generateObject();

</script>

</body>
</html>
